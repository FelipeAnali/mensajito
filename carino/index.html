<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Madame Cariño</title>
<meta name="description" content="Tienes una llamada de Madame Cariño, cariño.">
<meta name="theme-color" content="#111111">
<meta property="og:type" content="website">
<meta property="og:title" content="📞 Llamada entrante: Madame Cariño">
<meta property="og:description" content="Contesta, cariño. Madame no espera.">
<meta property="og:url" content="https://felipeanali.github.io/mensajito/carino/">
<meta property="og:image" content="https://felipeanali.github.io/mensajito/carino/portada.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="es_CO">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;0,6..96,900;1,6..96,500;1,6..96,700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f6f2ec;
    --ink:#111111;
    --soft:#5b5550;
    --red:#d7263d;
    --gold:#c9a34a;
    --green:#22c55e;
  }

  *{box-sizing:border-box}
  button{-webkit-tap-highlight-color:transparent;font:inherit}
  body{
    margin:0;
    background-color:#e9e3da;
    background-image:
      linear-gradient(90deg, rgba(17,17,17,.04) 1px, transparent 1px),
      linear-gradient(rgba(17,17,17,.04) 1px, transparent 1px);
    background-size:28px 28px;
    color:var(--ink);
    font-family:"Inter",system-ui,sans-serif;
    -webkit-text-size-adjust:100%;
            text-size-adjust:100%;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    justify-content:center;
    padding:24px;
  }

  .frame{
    margin:auto 0;
    width:min(94vw,460px);
    background:var(--ink);
    border-radius:30px;
    padding:12px;
    box-shadow:0 30px 60px -25px rgba(0,0,0,.6);
  }
  .topbar{
    height:46px;
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 8px 0 14px;
    color:#fff;
  }
  .brand{
    font-family:"Bodoni Moda",Didot,serif;
    font-style:italic;
    font-weight:700;
    font-size:18px;
  }
  .brand b{color:var(--red);font-style:normal}
  .mute{
    margin-left:auto;
    width:36px;height:36px;
    border-radius:50%;
    border:0;
    background:rgba(255,255,255,.12);
    color:#fff;
    font-size:16px;
    cursor:pointer;
  }
  .mute:focus-visible{outline:2px solid #fff;outline-offset:2px}

  .atelier{
    position:relative;
    border-radius:20px;
    overflow:hidden;
    overflow:clip;
    min-height:620px;
    background:
      radial-gradient(60% 40% at 50% 28%, #fffdf9 0%, transparent 70%),
      repeating-linear-gradient(90deg, transparent 0 46px, rgba(17,17,17,.035) 46px 47px),
      var(--paper);
    touch-action:manipulation;
  }
  .stage{
    position:relative;
    z-index:2;
    min-height:620px;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:26px 22px 30px;
    text-align:center;
  }

  /* ---------- LLAMADA ENTRANTE ---------- */
  .call{
    position:absolute;
    top:0;right:0;bottom:0;left:0;
    z-index:12;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:70px 24px 50px;
    background:linear-gradient(180deg, #1c1c1f 0%, #0b0b0c 100%);
    color:#fff;
    text-align:center;
  }
  .call .tipo{font-size:14px;letter-spacing:1px;color:rgba(255,255,255,.65)}
  .call .quien{
    margin-top:8px;
    font-family:"Bodoni Moda",Didot,serif;
    font-weight:700;
    font-size:38px;
  }
  .call .quien b{color:var(--red)}
  .avatar{
    position:relative;
    margin-top:46px;
    width:150px;height:150px;
    border-radius:50%;
    background:var(--paper);
    overflow:hidden;
    box-shadow:0 0 0 6px rgba(255,255,255,.08);
  }
  .avatar svg{position:absolute;left:-30px;top:-42px;width:210px;height:229px}
  .ondas{position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-75px 0 0 -75px;pointer-events:none}
  .ondas i{
    position:absolute;
    top:0;right:0;bottom:0;left:0;
    border-radius:50%;
    border:2px solid rgba(255,255,255,.35);
    animation:onda 2s ease-out infinite;
  }
  .ondas i:nth-child(2){animation-delay:.7s}
  .ondas i:nth-child(3){animation-delay:1.4s}
  @keyframes onda{from{transform:scale(1);opacity:.9}to{transform:scale(1.9);opacity:0}}
  .avatar-wrap{position:relative;animation:timbra 1.2s ease-in-out infinite}
  @keyframes timbra{
    0%,40%,100%{transform:rotate(0)}
    5%,15%,25%{transform:rotate(-6deg)}
    10%,20%,30%{transform:rotate(6deg)}
  }
  .call .botones{
    margin-top:auto;
    width:100%;
    display:flex;
    justify-content:space-around;
  }
  .call .op{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;color:rgba(255,255,255,.75)}
  .redondo{
    width:72px;height:72px;
    border-radius:50%;
    border:0;
    color:#fff;
    font-size:30px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:transform .15s ease;
  }
  .redondo:active{transform:scale(.9)}
  .redondo:focus-visible{outline:3px solid #fff;outline-offset:4px}
  .redondo.si{background:var(--green);animation:llama 1.2s ease-in-out infinite}
  .redondo.no{background:#ef4444}
  .redondo.no span{display:inline-block;transform:rotate(135deg)}
  @keyframes llama{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.6)}50%{box-shadow:0 0 0 14px rgba(34,197,94,0)}}
  .call .nota{min-height:1.3em;margin-top:18px;font-family:"Bodoni Moda",serif;font-style:italic;font-size:17px;color:#f3e3b8}

  /* ---------- MADAME ---------- */
  .madame{
    position:relative;
    width:210px;
    height:229px;
    border:0;background:transparent;padding:0;
    cursor:pointer;
    flex:none;
  }
  .madame:focus-visible{outline:3px solid var(--red);outline-offset:6px;border-radius:20px}
  .madame svg{width:100%;height:100%;overflow:visible}
  .madame .cuerpo{transform-origin:110px 240px;animation:respira 3.4s ease-in-out infinite}
  @keyframes respira{0%,100%{transform:scale(1)}50%{transform:scale(1.015,.99)}}
  .madame.wow .cuerpo{animation:wow .6s cubic-bezier(.3,1.6,.5,1)}
  @keyframes wow{30%{transform:translateY(-14px) scale(1.04)}}
  .madame .cabeza{transform-origin:110px 160px;transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
  .madame.sospecha .cabeza{transform:rotate(-7deg)}
  .madame .boca{transform-origin:110px 160px;transform-box:view-box}
  .madame.habla .boca{animation:habla .18s ease-in-out infinite alternate}
  @keyframes habla{from{transform:scaleY(.4)}to{transform:scaleY(1.6)}}
  .madame .parpado{transform-origin:center;transform-box:fill-box;transform:scaleY(0);animation:parpadea 5s infinite}
  @keyframes parpadea{0%,94%,100%{transform:scaleY(0)}96%{transform:scaleY(1)}}
  .madame .lid{transition:height .4s ease}
  .madame .tel{transform-origin:150px 150px;transition:transform .5s ease}
  .madame.colgo .tel{transform:translate(30px,70px) rotate(40deg);opacity:0;transition:transform .6s ease, opacity .6s ease .2s}

  /* ---------- BURBUJA ---------- */
  .bubble{
    position:relative;
    width:100%;
    margin-top:14px;
    background:#fff;
    border:2px solid var(--ink);
    border-radius:18px;
    padding:18px 18px 16px;
    font-family:"Bodoni Moda",Didot,serif;
    font-weight:500;
    font-size:22px;
    line-height:1.3;
    text-align:left;
    box-shadow:6px 6px 0 var(--ink);
    min-height:86px;
  }
  .bubble::before{
    content:"";
    position:absolute;
    left:50%;top:-12px;
    width:20px;height:20px;
    margin-left:-10px;
    background:#fff;
    border-left:2px solid var(--ink);
    border-top:2px solid var(--ink);
    transform:rotate(45deg);
  }
  .bubble em{font-style:italic;color:var(--red)}
  .bubble .who{
    display:block;
    margin-bottom:4px;
    font-family:"Inter",sans-serif;
    font-size:11px;
    font-weight:700;
    letter-spacing:2.5px;
    text-transform:uppercase;
    color:var(--soft);
  }
  .bubble .who i{font-style:normal;color:var(--green)}
  .cursor{display:inline-block;width:2px;height:1em;background:var(--ink);vertical-align:-2px;margin-left:2px;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  .ask{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:12px;
    margin-top:20px;
  }
  .ask input{
    width:100%;
    font-family:"Bodoni Moda",Didot,serif;
    font-weight:700;
    font-size:26px;
    text-align:center;
    color:var(--ink);
    background:transparent;
    border:0;
    border-bottom:3px solid var(--ink);
    border-radius:0;
    padding:8px 6px;
    outline:none;
    -webkit-appearance:none;
            appearance:none;
  }
  .ask input::placeholder{color:rgba(17,17,17,.3);font-style:italic;font-weight:500}
  .ask input:focus{border-color:var(--red)}
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:14px 22px;
    border:2px solid var(--ink);
    border-radius:999px;
    background:var(--ink);
    color:#fff;
    font-family:"Inter",sans-serif;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
    box-shadow:4px 4px 0 var(--red);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--red)}
  .btn:focus-visible{outline:3px solid var(--red);outline-offset:4px}
  .btn.light{background:#fff;color:var(--ink);box-shadow:4px 4px 0 var(--ink)}
  .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:22px}
  .colgo-txt{margin-top:16px;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--soft)}

  /* ---------- ¡NOMBRE, CARIÑOOOO! ---------- */
  .shout{
    position:absolute;
    top:0;right:0;bottom:0;left:0;
    z-index:10;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:var(--ink);
    color:#fff;
    text-align:center;
    animation:fadein .2s ease;
  }
  @keyframes fadein{from{opacity:0}}
  .shout .nombre{
    font-family:"Bodoni Moda",Didot,serif;
    font-weight:900;
    line-height:1;
    max-width:100%;
    overflow-wrap:break-word;
    animation:zoom .7s cubic-bezier(.3,1.6,.5,1);
  }
  .shout .carino{
    margin-top:10px;
    font-family:"Bodoni Moda",Didot,serif;
    font-style:italic;
    font-weight:700;
    font-size:clamp(34px,10vw,54px);
    color:var(--red);
    white-space:nowrap;
  }
  .shout .carino span{display:inline-block;opacity:0;animation:letra .3s ease forwards}
  @keyframes letra{from{opacity:0;transform:translateY(16px) scale(.6)}to{opacity:1;transform:none}}
  @keyframes zoom{from{transform:scale(.2);opacity:0}}

  .sequin{
    position:absolute;
    z-index:15;
    top:-12px;
    width:8px;height:8px;
    border-radius:50%;
    pointer-events:none;
    animation:cae var(--dur,2.4s) linear var(--delay,0s) forwards;
  }
  @keyframes cae{to{transform:translate(var(--x,0),700px) rotate(540deg)}}

  .step{width:100%;display:flex;flex-direction:column;align-items:center;animation:sube .6s cubic-bezier(.2,.9,.25,1) both}
  @keyframes sube{from{opacity:0;transform:translateY(12px)}}

  [hidden]{display:none !important}

  @media (prefers-reduced-motion: reduce){
    .madame .cuerpo,.madame .parpado,.madame.habla .boca,.avatar-wrap,.ondas i,.redondo.si{animation:none}
    .step,.shout,.shout .nombre{animation:none}
    .shout .carino span{animation:none;opacity:1}
    .sequin{display:none}
  }
  @media (max-width:420px){
    .atelier,.stage{min-height:590px}
    .bubble{font-size:20px}
  }
</style>
</head>
<body>
  <main class="frame">
    <div class="topbar">
      <span class="brand">Atelier <b>Cariño</b></span>
      <button class="mute" id="mute" aria-label="Silenciar a Madame">🔊</button>
    </div>

    <div class="atelier" id="atelier">

      <!-- Llamada entrante -->
      <div class="call" id="call">
        <div class="tipo">Llamada entrante…</div>
        <div class="quien">Madame <b>Cariño</b></div>
        <div class="avatar-wrap">
          <div class="ondas" aria-hidden="true"><i></i><i></i><i></i></div>
          <div class="avatar" id="avatar" aria-hidden="true"></div>
        </div>
        <p class="nota" id="nota"></p>
        <div class="botones">
          <div class="op"><button class="redondo no" id="rechazar" aria-label="Rechazar"><span>📞</span></button>Rechazar</div>
          <div class="op"><button class="redondo si" id="contestar" aria-label="Contestar">📞</button>Contestar</div>
        </div>
      </div>

      <div class="stage">
        <button class="madame sospecha" id="madame" aria-label="Madame Cariño">
          <svg viewBox="0 0 220 240" aria-hidden="true" id="dibujo">
            <defs>
              <radialGradient id="piel" cx="45%" cy="40%" r="65%">
                <stop offset="0" stop-color="#f7d2b4"/>
                <stop offset="1" stop-color="#e9b08f"/>
              </radialGradient>
              <linearGradient id="pelo" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#3a2a1f"/>
                <stop offset="1" stop-color="#1d140e"/>
              </linearGradient>
              <clipPath id="clipI"><ellipse cx="86" cy="124" rx="11" ry="8"/></clipPath>
              <clipPath id="clipD"><ellipse cx="134" cy="124" rx="11" ry="8"/></clipPath>
            </defs>
            <g class="cuerpo">
              <!-- vestido con hombreras y cuello rojo -->
              <path d="M58 240 Q56 196 80 182 L140 182 Q164 196 162 240 Z" fill="#1f1f24"/>
              <path d="M62 206 Q76 182 102 186" stroke="#33333b" stroke-width="11" fill="none" stroke-linecap="round"/>
              <path d="M64 224 Q78 200 100 204" stroke="#2a2a31" stroke-width="10" fill="none" stroke-linecap="round"/>
              <path d="M158 206 Q144 182 118 186" stroke="#33333b" stroke-width="11" fill="none" stroke-linecap="round"/>
              <path d="M156 224 Q142 200 120 204" stroke="#2a2a31" stroke-width="10" fill="none" stroke-linecap="round"/>
              <rect x="101" y="160" width="18" height="24" fill="#e9b08f"/>
              <path d="M96 180 L110 214 L124 180" stroke="#c4224a" stroke-width="5" fill="none" stroke-linejoin="round"/>
              <g class="cabeza">
                <!-- melena -->
                <path d="M44 156 C26 70 60 30 110 30 C160 30 194 70 176 156 Q166 166 152 158 L150 112 L70 112 L68 158 Q54 166 44 156 Z" fill="url(#pelo)"/>
                <ellipse cx="110" cy="120" rx="47" ry="50" fill="url(#piel)"/>
                <path d="M58 108 C50 52 76 36 110 36 C144 36 170 52 162 108 Q136 99 110 100 Q84 99 58 108 Z" fill="url(#pelo)"/>
                <path d="M110 40 Q108 70 112 98 M84 46 Q78 74 80 100 M136 46 Q142 74 140 100" stroke="#4a3628" stroke-width="2" fill="none" opacity=".6"/>
                <ellipse cx="78" cy="146" rx="9" ry="5" fill="#e88f86" opacity=".35"/>
                <ellipse cx="142" cy="146" rx="9" ry="5" fill="#e88f86" opacity=".35"/>
                <!-- ojos -->
                <ellipse cx="86" cy="124" rx="11" ry="8" fill="#fff"/>
                <ellipse cx="134" cy="124" rx="11" ry="8" fill="#fff"/>
                <circle id="ojoI" cx="86" cy="126" r="5" fill="#4a2f22"/>
                <circle id="ojoD" cx="134" cy="126" r="5" fill="#4a2f22"/>
                <circle id="luzI" cx="88" cy="124" r="1.6" fill="#fff"/>
                <circle id="luzD" cx="136" cy="124" r="1.6" fill="#fff"/>
                <rect class="lid" id="lidI" x="72" y="110" width="28" height="13" fill="#efc09f" clip-path="url(#clipI)"/>
                <rect class="lid" id="lidD" x="120" y="110" width="28" height="13" fill="#efc09f" clip-path="url(#clipD)"/>
                <path d="M77 134 Q86 138 95 134" stroke="#c98a6e" stroke-width="1.5" fill="none" stroke-linecap="round"/>
                <path d="M125 134 Q134 138 143 134" stroke="#c98a6e" stroke-width="1.5" fill="none" stroke-linecap="round"/>
                <ellipse class="parpado" cx="86" cy="124" rx="12" ry="9" fill="#efc09f"/>
                <ellipse class="parpado" cx="134" cy="124" rx="12" ry="9" fill="#efc09f"/>
                <!-- gafas gigantes -->
                <circle cx="86" cy="124" r="25" fill="rgba(255,255,255,.12)" stroke="#141414" stroke-width="5"/>
                <circle cx="134" cy="124" r="25" fill="rgba(255,255,255,.12)" stroke="#141414" stroke-width="5"/>
                <path d="M109 121 Q110 118 111 121" stroke="#141414" stroke-width="4" fill="none" stroke-linecap="round"/>
                <path d="M70 112 Q74 104 82 102" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".7"/>
                <path d="M118 112 Q122 104 130 102" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".7"/>
                <!-- nariz y boca -->
                <ellipse cx="110" cy="142" rx="9" ry="10" fill="#e8a283"/>
                <ellipse cx="107" cy="139" rx="3" ry="2.5" fill="#f6c9ad"/>
                <path class="boca" d="M101 160 Q110 155 119 160 Q110 166 101 160 Z" fill="#b8323f"/>
              </g>
              <!-- teléfono en la oreja -->
              <g class="tel">
                <path d="M150 204 Q176 196 168 158" stroke="#1f1f24" stroke-width="16" fill="none" stroke-linecap="round"/>
                <path d="M172 112 Q186 140 150 170" stroke="#d7263d" stroke-width="10" fill="none" stroke-linecap="round"/>
                <ellipse cx="170" cy="112" rx="9" ry="14" fill="#b81c31" transform="rotate(-20 170 112)"/>
                <ellipse cx="148" cy="170" rx="12" ry="8" fill="#b81c31" transform="rotate(-30 148 170)"/>
                <ellipse cx="166" cy="160" rx="10" ry="8" fill="#efc09f"/>
                <path d="M146 178 q-6 8 2 12 q8 4 0 11 q-8 5 1 11 q8 5 0 11" stroke="#2a2a2a" stroke-width="2" fill="none"/>
              </g>
            </g>
          </svg>
        </button>

        <div class="bubble" id="bubble" aria-live="polite"><span class="who">Madame Cariño · <i id="estado">en llamada</i></span><span id="dice"></span><span class="cursor"></span></div>

        <form class="ask step" id="pasoNombre" hidden>
          <input id="nombre" type="text" maxlength="24" autocomplete="given-name" placeholder="di tu nombre…" aria-label="Tu nombre">
          <button class="btn" type="submit">Decirle quién soy</button>
        </form>

        <div class="step" id="pasoFinal" hidden>
          <div class="colgo-txt" id="colgoTxt">📞 Madame colgó</div>
          <div class="row">
            <button class="btn light" id="otraVez">Otra vez, cariño</button>
            <button class="btn" id="compartir">Compartir 📲</button>
          </div>
        </div>
      </div>
    </div>
  </main>

<script>
  // ===================================================================
  //  EDITA AQUÍ  →  lo que dice Madame Cariño
  // ===================================================================
  const CONFIG = {
    aloTexto: "¿Aló?… *te mira raro por encima de las gafas* …¿Quién es?",
    aloVoz: [["¿Aló?", .85, 1.1], ["¿Quién es?", .75, .95]],
    sinNombre: "¿Y? Tu nombre, cariño. No tengo todo el día.",
    // {n} = su nombre
    final: "Felipe me había contado de ti. *Jumm…* Sí. Esta vez sí tiene buenos gustos.",
    finalVoz: [["Felipe me había contado de ti.", .95, 1.1], ["Jumm.", .5, .9], ["Sí. Esta vez sí tiene buenos gustos.", .9, 1.15]],
    rechazos: ["¿Rechazar a Madame? Nadie rechaza a Madame, cariño.", "Ni lo intentes, cariño.", "Contesta. Ahora."],
    toques: ["¿Qué? Estoy en una llamada, cariño.", "¡No me toques el peinado!", "Jumm.", "¡Cariñoooo!"]
  };
  // ===================================================================

  const $ = (id) => document.getElementById(id);
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const atelier = $("atelier");
  const madame = $("madame");
  const azar = (a, b) => a + Math.random() * (b - a);
  const vibrar = (ms) => { try { navigator.vibrate && navigator.vibrate(ms); } catch(e){} };
  let nombre = "";
  let fase = "llamada"; // llamada → alo → grito → final

  // Foto de perfil de la llamada: el mismo dibujo de Madame
  const mini = $("dibujo").cloneNode(true);
  mini.removeAttribute("id");
  mini.querySelectorAll("[id]").forEach((n) => {
    const v = n.id; n.id = "m-" + v;
  });
  // Los degradados del clon apuntan a sus propias definiciones
  mini.innerHTML = mini.innerHTML.replace(/url\(#(piel|pelo|clipI|clipD)\)/g, "url(#m-$1)");
  mini.querySelector(".tel").remove();
  $("avatar").appendChild(mini);

  // ===================================================================
  //  Voz y sonidos
  // ===================================================================
  let conVoz = true;
  let voz = null;
  function elegirVoz(){
    if (!("speechSynthesis" in window)) return;
    const vs = speechSynthesis.getVoices().filter((v) => /^es/i.test(v.lang));
    voz = vs.find((v) => /Paulina|Monica|Mónica|Marisol|Helena|Sabina|Google español|female|mujer/i.test(v.name))
       || vs.find((v) => /es-(MX|US|CO|419)/i.test(v.lang)) || vs[0] || null;
  }
  if ("speechSynthesis" in window){ elegirVoz(); speechSynthesis.onvoiceschanged = elegirVoz; }

  let turno = 0;
  function hablar(partes, alTerminar){
    const mio = ++turno;
    madame.classList.add("habla");
    const fin = () => {
      if (mio === turno) madame.classList.remove("habla");
      if (alTerminar){ const f = alTerminar; alTerminar = null; f(); }
    };
    if (!conVoz || !("speechSynthesis" in window)){
      setTimeout(fin, Math.min(partes.reduce((t, p) => t + p[0].length * 60, 500), 4500));
      return;
    }
    try {
      speechSynthesis.cancel();
      partes.forEach(([texto, rate, pitch], i) => {
        const u = new SpeechSynthesisUtterance(texto);
        u.lang = voz ? voz.lang : "es-ES";
        if (voz) u.voice = voz;
        u.rate = rate; u.pitch = pitch;
        if (i === partes.length - 1){ u.onend = fin; u.onerror = fin; }
        speechSynthesis.speak(u);
      });
      setTimeout(fin, 9000);
    } catch(e){ fin(); }
  }
  $("mute").addEventListener("click", () => {
    conVoz = !conVoz;
    $("mute").textContent = conVoz ? "🔊" : "🔇";
    $("mute").setAttribute("aria-label", conVoz ? "Silenciar a Madame" : "Activar la voz de Madame");
    if (!conVoz && "speechSynthesis" in window) speechSynthesis.cancel();
  });

  let ac = null;
  function sonido(){
    if (!ac){ try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return null; } }
    if (ac.state === "suspended") ac.resume();
    return ac;
  }
  try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch(e){}
  function acorde(frecs, dur = 1.2, vol = .08, tipo = "triangle"){
    const a = sonido(); if (!a || !conVoz) return;
    const t = a.currentTime;
    frecs.forEach((f, i) => {
      const o = a.createOscillator(), g = a.createGain();
      o.type = tipo; o.frequency.value = f;
      o.connect(g); g.connect(a.destination);
      g.gain.setValueAtTime(0, t + i * .05);
      g.gain.linearRampToValueAtTime(vol, t + i * .05 + .02);
      g.gain.exponentialRampToValueAtTime(.0004, t + i * .05 + dur);
      o.start(t + i * .05); o.stop(t + i * .05 + dur + .05);
    });
  }
  function clicTelefono(){ acorde([880, 660], .15, .06, "square"); }

  // ===================================================================
  //  Burbuja que se escribe letra por letra
  // ===================================================================
  let escribiendo = null;
  function decir(texto){
    const d = $("dice");
    clearInterval(escribiendo);
    d.textContent = "";
    const nodos = [];
    texto.split(/(\*[^*]+\*)/).forEach((t) => {
      if (!t) return;
      const el = document.createElement(t.startsWith("*") ? "em" : "span");
      d.appendChild(el);
      nodos.push([el, t.startsWith("*") ? t.slice(1, -1) : t]);
    });
    if (reduce){ nodos.forEach(([n, t]) => n.textContent = t); return; }
    let k = 0, j = 0;
    escribiendo = setInterval(() => {
      if (k >= nodos.length){ clearInterval(escribiendo); return; }
      const [n, t] = nodos[k];
      n.textContent = t.slice(0, ++j);
      if (j >= t.length){ k++; j = 0; }
    }, 30);
  }

  // ===================================================================
  //  Ojos: desconfiados al principio, que siguen el dedo
  // ===================================================================
  function parpados(alto){ $("lidI").setAttribute("height", alto); $("lidD").setAttribute("height", alto); }
  parpados(15);
  const ojos = [["ojoI", "luzI", 86], ["ojoD", "luzD", 134]];
  function mirar(cx, cy){
    const svg = $("dibujo").getBoundingClientRect();
    if (!svg.width) return;
    const sx = svg.width / 220, sy = svg.height / 240;
    ojos.forEach(([o, l, x0]) => {
      const ox = svg.left + x0 * sx, oy = svg.top + 126 * sy;
      const ang = Math.atan2(cy - oy, cx - ox);
      const dist = Math.min(5, Math.hypot(cx - ox, cy - oy) / 25);
      const dx = Math.cos(ang) * dist, dy = Math.max(-1, Math.min(2, Math.sin(ang) * dist * .5));
      $(o).setAttribute("cx", x0 + dx); $(o).setAttribute("cy", 126 + dy);
      $(l).setAttribute("cx", x0 + 2 + dx); $(l).setAttribute("cy", 124 + dy);
    });
  }
  window.addEventListener("pointermove", (e) => mirar(e.clientX, e.clientY));
  window.addEventListener("pointerdown", (e) => mirar(e.clientX, e.clientY));
  // Mientras desconfía, mira de reojo de un lado a otro
  let reojo = setInterval(() => {
    if (!madame.classList.contains("sospecha")) return;
    const r = $("dibujo").getBoundingClientRect();
    mirar(r.left + (Math.random() < .5 ? -200 : r.width + 200), r.top + r.height * .45);
  }, 1600);

  let toque = 0;
  madame.addEventListener("click", () => {
    madame.classList.remove("wow"); void madame.offsetWidth; madame.classList.add("wow");
    const t = CONFIG.toques[toque++ % CONFIG.toques.length];
    decir(t);
    hablar([[t, 1, 1.2]]);
    vibrar(15);
  });

  function lentejuelas(n = 60){
    if (reduce) return;
    const col = ["#c9a34a", "#f3e3b8", "#d7263d", "#ffffff", "#111111"];
    for (let i = 0; i < n; i++){
      const s = document.createElement("span");
      s.className = "sequin";
      s.style.left = azar(0, 100) + "%";
      s.style.background = col[i % col.length];
      s.style.boxShadow = "0 0 6px rgba(255,255,255,.8)";
      s.style.setProperty("--x", azar(-60, 60) + "px");
      s.style.setProperty("--dur", azar(1.8, 3.2) + "s");
      s.style.setProperty("--delay", azar(0, .7) + "s");
      atelier.appendChild(s);
      s.addEventListener("animationend", () => s.remove());
    }
  }

  // ===================================================================
  //  1. Llamada entrante
  // ===================================================================
  let rechazos = 0;
  $("rechazar").addEventListener("click", () => {
    $("nota").textContent = CONFIG.rechazos[Math.min(rechazos++, CONFIG.rechazos.length - 1)];
    vibrar([60, 40, 60]);
    sonido();
  });

  function iniciarLlamada(){
    clicTelefono();
    vibrar(30);
    $("call").hidden = true;
    madame.classList.add("sospecha");
    madame.classList.remove("colgo");
    parpados(15);
    $("pasoFinal").hidden = true;
    $("pasoNombre").hidden = true;
    fase = "alo";
    $("estado").textContent = "en llamada";
    $("estado").style.color = "";
    decir(CONFIG.aloTexto);
    const pedirNombre = () => {
      if (fase !== "alo" || !$("pasoNombre").hidden) return;
      $("pasoNombre").hidden = false;
      setTimeout(() => $("nombre").focus({preventScroll:true}), 100);
    };
    hablar(CONFIG.aloVoz, pedirNombre);
    // Por si la voz no avisa que terminó
    setTimeout(pedirNombre, 3200);
  }
  $("contestar").addEventListener("click", iniciarLlamada);

  // Si el link trae ?para=Nombre, ya viene escrito
  const params = new URLSearchParams(location.search);
  if (params.get("para")) $("nombre").value = params.get("para").slice(0, 24);

  // ===================================================================
  //  2. Ella dice su nombre → ¡NOMBRE, CARIÑOOOO!
  // ===================================================================
  const capital = (s) => s.split(/\s+/).map((w) => w.charAt(0).toUpperCase() + w.slice(1)).join(" ");

  $("pasoNombre").addEventListener("submit", (e) => {
    e.preventDefault();
    const v = $("nombre").value.trim();
    if (!v){ decir(CONFIG.sinNombre); hablar([[CONFIG.sinNombre, 1, 1.05]]); $("nombre").focus(); return; }
    nombre = capital(v);
    fase = "grito";
    $("nombre").blur();
    $("pasoNombre").hidden = true;
    gritar();
  });

  function gritar(){
    const s = document.createElement("div");
    s.className = "shout";
    const n = document.createElement("div");
    n.className = "nombre";
    n.textContent = "¡" + nombre + "!";
    const ancho = Math.min(atelier.clientWidth - 40, 420);
    n.style.fontSize = Math.max(30, Math.min(78, ancho / ((nombre.length + 2) * .62))) + "px";
    const c = document.createElement("div");
    c.className = "carino";
    "cariñoooooo".split("").forEach((ch, i) => {
      const sp = document.createElement("span");
      sp.textContent = ch;
      sp.style.animationDelay = (.5 + i * .09) + "s";
      c.appendChild(sp);
    });
    s.append(n, c);
    atelier.appendChild(s);
    acorde([261.63, 329.63, 392, 523.25], 1.6, .09);
    hablar([[nombre + "!", .9, 1.35], ["cariño", .42, 1.15]]);
    vibrar([40, 60, 120]);
    setTimeout(() => lentejuelas(70), 300);
    setTimeout(() => {
      s.style.transition = "opacity .5s ease";
      s.style.opacity = "0";
      setTimeout(() => s.remove(), 500);
      remate();
    }, reduce ? 1500 : 3600);
  }

  // ===================================================================
  //  3. "Felipe me había contado de ti… Jumm… sí, esta vez sí tiene buenos gustos"
  // ===================================================================
  function remate(){
    fase = "final";
    madame.classList.remove("sospecha");
    parpados(11);
    madame.classList.remove("wow"); void madame.offsetWidth; madame.classList.add("wow");
    const t = CONFIG.final.replace(/\{n\}/g, nombre);
    decir(t);
    hablar(CONFIG.finalVoz, () => {
      setTimeout(() => {
        madame.classList.add("colgo");
        $("estado").textContent = "llamada finalizada";
        $("estado").style.color = "#d7263d";
        clicTelefono();
        $("pasoFinal").hidden = false;
        lentejuelas(40);
      }, 600);
    });
  }

  $("otraVez").addEventListener("click", () => {
    $("nombre").value = "";
    fase = "llamada";
    $("call").hidden = false;
    $("nota").textContent = "";
    rechazos = 0;
    madame.classList.remove("colgo");
    madame.classList.add("sospecha");
    decir("");
  });

  $("compartir").addEventListener("click", async () => {
    const url = location.origin + location.pathname;
    const texto = "📞 Te está llamando Madame Cariño. Contesta, cariño.";
    if (navigator.share){
      try { await navigator.share({title: "Madame Cariño", text: texto, url}); return; }
      catch(e){ if (e && e.name === "AbortError") return; }
    }
    window.open("https://wa.me/?text=" + encodeURIComponent(texto + " " + url), "_blank", "noopener");
  });
</script>
</body>
</html>
