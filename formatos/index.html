  /* Al abrir: carga los datos y los lleva a la estructura actual con las migraciones.
     Nunca se borra nada por cambiar de versión. Solo en MODO_DEMO, si no hay datos
     (o son tan viejos que no tienen migración), se cargan los datos de ejemplo. */
  const [errorCarga, setErrorCarga] = useState('');
  // Con servidor, los datos se piden DESPUÉS de entrar (el servidor decide qué ve cada usuario).
  const [conSesion, setConSesion] = useState(() => !Adaptador.requiereSesion || Adaptador.tieneSesion());
  const [conexion, setConexion] = useState(null);
  useEffect(() => Adaptador.alCambiarEstado(e => { setConexion(e); if (e.sesionVencida) setConSesion(false); }), []);
  useEffect(() => { if (!conSesion) return; setErrorCarga(''); Adaptador.cargar().then(guardados => {
    // migrar ajusta el mismo objeto: la versión original se anota ANTES para saber si hubo migración.
    const versionOriginal = guardados ? guardados.esquema : null;
    const { db: d, aviso } = migrar(guardados);
    if (d){ if (d.esquema !== versionOriginal) Adaptador.guardar(d, []); reemplazarDb(d); if (aviso) avisar(aviso, 'error'); return; }
    if (MODO_DEMO && Adaptador.tipo === 'local'){ const nuevo = sembrar(); Adaptador.guardar(nuevo, []); reemplazarDb(nuevo); return; }
    setErrorCarga(aviso || (Adaptador.tipo === 'servidor' ? 'Sin conexión y sin datos guardados en este celular. Conectate a internet y recargá.' : 'No hay datos para mostrar.'));
  }).catch(e => { if (e && e.sesion) setConSesion(false); else setErrorCarga(e && e.message ? e.message : 'No se pudieron cargar los datos.'); }); }, [conSesion]);
  const avisar = useCallback((msg, tipo) => { setAviso({ msg, tipo }); clearTimeout(timer.current); timer.current = setTimeout(() => setAviso(null), 4200); }, []);
  /* ÚNICA forma de modificar datos: copia, aplica el cambio, deja auditoría, muestra y guarda.
     Se arma sobre dbRef (y no dentro de setDb) para que el guardado sea un efecto que ocurre
     una sola vez; dos commits seguidos se encadenan bien porque dbRef se actualiza al instante. */
  const commit = useCallback((fn, accion) => {
    const antes = dbRef.current;
    const next = copiaParaCambio(antes);
    try{ fn(next); }
    catch(e){ console.error(e); avisar('No se guardó: ocurrió un error interno (' + (e && e.message ? e.message : e) + ').', 'error'); return false; }
    if (accion){ next.auditoria.unshift({ id: uid(), fecha: Adaptador.ahora().toISOString(), usuario: usuarioRef.current ? usuarioRef.current.nombre : 'Sistema', accion }); next.auditoria = next.auditoria.slice(0, 500); }
    // Qué cambió, registro por registro, y si el usuario tiene permiso para cada cosa.
    const ops = calcularOperaciones(antes, next);
    if (!ops.length) return true;
    const negada = ops.map(op => motivoSinPermiso(antes, usuarioRef.current, op)).find(Boolean);
    if (negada){ avisar('No se guardó: ' + negada, 'error'); return false; }
    congelarSoloAgregar(next);   // los registros y renglones nuevos quedan congelados
    dbRef.current = next;
    setDb(next);
    Adaptador.guardar(next, ops).then(ok => { if (!ok) avisar('No se pudo guardar. ' + (Adaptador === AdaptadorLocal ? 'El almacenamiento del navegador está lleno: descargá un respaldo y borrá registros viejos.' : 'Revisá la conexión e intentá de nuevo.'), 'error'); });
    return true;
  }, [avisar]);

  // Con servidor y sin sesión: primero usuario y contraseña.
  if (!conSesion) return html`<${LoginServidor} equipoPendiente=${equipoURL} onEntrar=${u => { try{ localStorage.setItem('cnv_sesion', u.id); }catch(e){} setSesion(u.id); setRuta({ v: u.rol === 'operario' ? 'inicio' : 'tablero' }); setConSesion(true); }} />`;
  if (!db) return html`<p style=${{ padding: 24 }}>${errorCarga || 'Cargando…'}</p>`;
  const usuario = db.usuarios.find(u => u.id === sesion && u.estado === 'activo');
  usuarioRef.current = usuario || null;
  const entrar = id => { try{ localStorage.setItem('cnv_sesion', id); }catch(e){} setSesion(id); const u = db.usuarios.find(x => x.id === id); setRuta({ v: u && u.rol === 'admin' ? 'tablero' : u && u.rol === 'maestro' ? 'tablero' : 'inicio' }); };
  const salir = () => {
    // Con cambios sin enviar no se pierde nada (esperan en el celular), pero se avisa.
    if (conexion && conexion.pendientes && !window.confirm('Tenés ' + conexion.pendientes + (conexion.pendientes === 1 ? ' cambio' : ' cambios') + ' sin enviar. Quedan guardados en este celular y se envían cuando vuelvas a entrar. ¿Salir igual?')) return;
    try{ localStorage.removeItem('cnv_sesion'); }catch(e){}
    setSesion(null);
    // Con servidor: se cierra la sesión allá y se vuelve a la pantalla de usuario y contraseña.
    if (Adaptador.requiereSesion){ Adaptador.cerrarSesion(); setConSesion(false); reemplazarDb(null); }
  };
  const toast = html`<${React.Fragment}>
    <${EstadoConexion} estado=${conexion} onCerrarRechazo=${() => Adaptador.limpiarRechazo && Adaptador.limpiarRechazo()} />
    ${aviso && html`<div className=${'toast' + (aviso.tipo === 'error' ? ' error' : '')} role="status">${aviso.msg}</div>`}
  <//>`;

  // Con servidor el usuario viene del inicio de sesión; si no está en los datos, se vuelve a entrar.
  if (!usuario && Adaptador.requiereSesion) return html`<${LoginServidor} equipoPendiente=${equipoURL} onEntrar=${u => { try{ localStorage.setItem('cnv_sesion', u.id); }catch(e){} setSesion(u.id); }} />`;
  if (!usuario) return html`<${React.Fragment}><${Login} db=${db} entrar=${entrar} equipoPendiente=${equipoURL} />${toast}<//>`;
  if (usuario.rol === 'operario') return html`<${React.Fragment}><${Operario} db=${db} usuario=${usuario} commit=${commit} salir=${salir} avisar=${avisar} equipoInicial=${equipoURL} limpiarEquipoInicial=${() => setEquipoURL(null)} />${toast}<//>`;

  const ir = (v, extra) => { setRuta(Object.assign({ v }, extra || {})); setMenu(false); const m = document.querySelector('.main'); if (m) m.scrollTop = 0; };
  const esMaestro = usuario.rol === 'maestro';
  const nav = [['tablero','Tablero'], ['formularios','Formularios'], ['resultados','Resultados'], ['equipos','Equipos y QR']];
  const navMaestro = [['usuarios','Usuarios'], ['catalogos','Sedes y secciones'], ['auditoria','Auditoría'], ['sistema','Sistema']];
  const activa = ruta.v === 'constructor' ? 'formularios' : ruta.v;
  let vista;
  switch (ruta.v){
    case 'formularios': vista = html`<${Formularios} db=${db} commit=${commit} ir=${ir} avisar=${avisar} />`; break;
    case 'constructor': vista = html`<${Constructor} key=${ruta.formId} db=${db} formId=${ruta.formId} commit=${commit} ir=${ir} avisar=${avisar} usuario=${usuario} />`; break;
    case 'resultados': vista = html`<${Resultados} key=${JSON.stringify(ruta)} db=${db} avisar=${avisar} inicial=${ruta} />`; break;
    case 'equipos': vista = html`<${Equipos} db=${db} commit=${commit} avisar=${avisar} puedeEditar=${esMaestro} />`; break;
    case 'usuarios': vista = esMaestro && html`<${Usuarios} db=${db} commit=${commit} />`; break;
    case 'catalogos': vista = esMaestro && html`<${Catalogos} db=${db} commit=${commit} />`; break;
    case 'auditoria': vista = esMaestro && html`<${Auditoria} db=${db} />`; break;
    case 'sistema': vista = esMaestro && html`<${Sistema} db=${db} commit=${commit} avisar=${avisar} reiniciar=${() => { const d = sembrar(); Adaptador.guardar(d, []); reemplazarDb(d); ir('tablero'); avisar('Datos de demostración restaurados.'); }} importar=${d => { const m = migrar(d); if (!m.db) return m.aviso || 'Respaldo no válido.'; Adaptador.guardar(m.db, []); reemplazarDb(m.db); return ''; }} />`; break;
    default: vista = html`<${Tablero} db=${db} ir=${ir} />`;
  }
  return html`<${React.Fragment}>
    <div className="shell">
      <nav className=${'side' + (menu ? ' abierta' : '')} aria-label="Menú principal">
        <div className="marca"><b>Formatos digitales</b><small>Supertiendas Cañaveral</small></div>
        ${nav.map(([k, n]) => html`<button key=${k} className=${'nav' + (activa === k ? ' on' : '')} onClick=${() => ir(k)}>${n}</button>`)}
        ${esMaestro && html`<div className="nav-grupo">Configuración</div>`}
        ${esMaestro && navMaestro.map(([k, n]) => html`<button key=${k} className=${'nav' + (activa === k ? ' on' : '')} onClick=${() => ir(k)}>${n}</button>`)}
        <div className="yo"><b>${usuario.nombre}</b><span style=${{ color:'var(--lime)', fontWeight: 800 }}>${ROLES[usuario.rol]}</span><br/><button className="btn chico" style=${{ marginTop: 8 }} onClick=${salir}>${Adaptador.requiereSesion ? 'Salir' : 'Cambiar de usuario'}</button></div>
      </nav>
      <div className=${'velo-menu' + (menu ? ' si' : '')} onClick=${() => setMenu(false)}></div>
      <main className="main">
        <div className="topmovil"><button className="btn chico" onClick=${() => setMenu(true)} aria-label="Abrir menú">Menú</button><b style=${{ fontFamily:'Poppins, sans-serif' }}>Formatos digitales</b></div>
        ${vista}
      </main>
    </div>
    ${toast}
  <//>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
})();
</script>
</body>
</html>
