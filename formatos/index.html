/* Ventana emergente. Se cierra con Escape o tocando fuera. */
function Modal({ titulo, children, onCerrar, ancho, clase }){
  useEffect(() => { const k = e => { if (e.key === 'Escape') onCerrar && onCerrar(); }; window.addEventListener('keydown', k); return () => window.removeEventListener('keydown', k); }, [onCerrar]);
  return html`<div className=${'velo ' + (clase || '')} onMouseDown=${e => { if (e.target === e.currentTarget && onCerrar) onCerrar(); }}>
    <div className=${'modal' + (ancho ? ' ancho' : '')} role="dialog" aria-modal="true" aria-label=${titulo}>
      ${titulo && html`<h2>${titulo}</h2>`}
      ${children}
    </div>
  </div>`;
}
/* Dibuja un QR (SVG) con el texto dado. */
function QR({ texto, tam }){
  const svg = useMemo(() => { try{ const q = qrcode(0, 'M'); q.addData(texto); q.make(); return q.createSvgTag({ cellSize: tam || 4, margin: 2, scalable: true }); }catch(e){ return ''; } }, [texto, tam]);
  return html`<div dangerouslySetInnerHTML=${{ __html: svg }}></div>`;
}
/**
 * Gráfica de CUMPLIMIENTO DIARIO: qué porcentaje de los registros que
 * tocaban se hicieron cada día.
 *
 *   % del día = registros hechos / registros esperados
 *   esperados = equipos × horarios del día. Hoy solo cuentan los horarios
 *               que ya empezaron (a las 10:00 se esperan solo los de las 08:00).
 *   hechos    = parejas distintas equipo + horario (si alguien registró dos
 *               veces el mismo horario, cuenta una).
 *
 * Color de la barra: verde ≥ 95 %, amarilla 80–94 %, naranja < 80 %.
 * Días anteriores al primer registro del formulario salen como "sin datos"
 * (el formulario todavía no se usaba), en gris y sin porcentaje.
 * La línea punteada marca el 100 %. Debajo de cada fecha, en naranja, las alertas del día.
 *
 * Props:
 *   datos  [{ dia:'AAAA-MM-DD', esperados, hechos, alertas, sinDatos }]
 *   onDia  se llama con el día al tocar una barra (abre la planilla de ese día).
 */
function CumplimientoDiario({ datos, onDia }){
  // En pantallas angostas el dibujo es más angosto para que textos y barras no queden diminutos.
  const angosto = typeof window !== 'undefined' && window.innerWidth < 700;
  const W = angosto ? 560 : 1100, H = angosto ? 260 : 230, pl = 40, pr = 10, pt = 22, pb = 42;
  const n = datos.length; const bw = (W - pl - pr) / n;
  const y = pct => pt + (H - pt - pb) * (1 - pct / 100);
  const color = pct => pct >= 95 ? 'var(--b-bien)' : pct >= 80 ? 'var(--b-medio)' : 'var(--b-mal)';
  const cadaCuanto = n > 14 ? 3 : 1;   // con 30 días se muestra una fecha de cada 3 para que no se encimen
  return html`<svg className="svg-graf" viewBox=${'0 0 ' + W + ' ' + H} role="img" aria-label="Cumplimiento diario en porcentaje">
    ${[0, 50, 100].map(v => html`<g key=${v}>
      <line x1=${pl} x2=${W - pr} y1=${y(v)} y2=${y(v)} stroke="var(--line)" strokeDasharray=${v === 100 ? '5 4' : ''} />
      <text x=${pl - 8} y=${y(v) + 4} fontSize="12" textAnchor="end" fill="var(--muted)">${v}%</text>
    </g>`)}
    ${datos.map((d, i) => {
      const pct = d.esperados ? Math.min(100, Math.round(100 * d.hechos / d.esperados)) : 0;
      const x = pl + i * bw + bw * 0.16, w = bw * 0.68, cx = x + w / 2;
      const mostrarFecha = i % cadaCuanto === 0 || i === n - 1;
      const clicable = !d.sinDatos && d.esperados > 0;
      return html`<g key=${d.dia} style=${{ cursor: clicable ? 'pointer' : 'default' }} onClick=${() => clicable && onDia(d.dia)}>
        <title>${fmtDiaCorto(d.dia)}: ${d.sinDatos ? 'sin datos' : d.esperados ? d.hechos + ' de ' + d.esperados + ' registros (' + pct + '%) · ' + d.alertas + (d.alertas === 1 ? ' alerta' : ' alertas') + ' · clic para ver la planilla' : 'todavía no empieza ningún horario'}</title>
        <rect x=${x} y=${pt} width=${w} height=${H - pt - pb} fill="transparent" />
        ${d.sinDatos || !d.esperados
          ? html`<rect x=${x} y=${y(0) - 3} width=${w} height="3" fill="var(--line)" rx="1" />`
          : html`<g><rect x=${x} y=${y(pct)} width=${w} height=${Math.max(2, y(0) - y(pct))} fill=${color(pct)} rx="3" />
                 ${n <= 14 && html`<text x=${cx} y=${y(pct) - 6} fontSize="12" fontWeight="700" textAnchor="middle" fill="var(--text)">${pct}%</text>`}</g>`}
        ${mostrarFecha && html`<text x=${cx} y=${H - 22} fontSize="12" textAnchor="middle" fill="var(--muted)">${fmtDiaCorto(d.dia)}</text>`}
        ${d.alertas > 0 && n <= 14 && html`<text x=${cx} y=${H - 6} fontSize="11.5" fontWeight="700" textAnchor="middle" fill="var(--alert)">${d.alertas} ${d.alertas === 1 ? 'alerta' : 'alertas'}</text>`}
      </g>`;
    })}
  </svg>`;
}
/* Línea de temperatura de un equipo; la franja verde es el rango permitido. puntos = [{f, v, alerta}]. */
function LineaTemp({ puntos, rango }){
  const W = 640, H = 220, pl = 36, pb = 24, pt = 12, pr = 10;
  if (!puntos.length) return html`<div className="vacio">Este equipo no tiene lecturas en el periodo.</div>`;
  const vals = puntos.map(p => p.v).concat(rango ? rango.filter(x => !vacio(x)).map(Number) : []);
  let mn = Math.min(...vals) - 2, mx = Math.max(...vals) + 2;
  const x = i => pl + (W - pl - pr) * (puntos.length === 1 ? 0.5 : i / (puntos.length - 1));
  const y = v => pt + (H - pt - pb) * (1 - (v - mn) / (mx - mn));
  const camino = puntos.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.v).toFixed(1)).join(' ');
  const marcas = [mn, (mn + mx) / 2, mx].map(v => Math.round(v));
  return html`<svg className="svg-graf" viewBox=${'0 0 ' + W + ' ' + H} role="img" aria-label="Tendencia de temperatura">
    ${rango && html`<rect x=${pl} width=${W - pl - pr} y=${y(vacio(rango[1]) ? mx : Number(rango[1]))} height=${Math.max(0, y(vacio(rango[0]) ? mn : Number(rango[0])) - y(vacio(rango[1]) ? mx : Number(rango[1])))} fill="var(--ok-bg)" />`}
    ${marcas.map(v => html`<text key=${v} x=${pl - 6} y=${y(v) + 4} fontSize="11" textAnchor="end" fill="var(--muted)">${v}°</text>`)}
    <path d=${camino} fill="none" stroke="var(--forest)" strokeWidth="2.2" strokeLinejoin="round" />
    ${puntos.map((p, i) => html`<circle key=${i} cx=${x(i)} cy=${y(p.v)} r=${p.alerta ? 5 : 3} fill=${p.alerta ? 'var(--alert)' : 'var(--forest)'}><title>${fmtFecha(p.f)}: ${p.v} °C</title></circle>`)}
    <text x=${pl} y=${H - 6} fontSize="11" fill="var(--muted)">${fmtFecha(puntos[0].f).slice(0, 5)}</text>
    <text x=${W - pr} y=${H - 6} fontSize="11" textAnchor="end" fill="var(--muted)">${fmtFecha(puntos[puntos.length - 1].f).slice(0, 5)}</text>
  </svg>`;
}
/* Recuadro para firmar con el dedo o el mouse. Entrega la firma como imagen PNG (dataURL). */
function Firma({ valor, onCambio }){
  const ref = useRef(null); const dib = useRef(false);
  const preparar = () => {
    const c = ref.current; if (!c) return null; const r = c.getBoundingClientRect();
    if (c.width !== Math.round(r.width * 2)){ c.width = Math.round(r.width * 2); c.height = Math.round(r.height * 2); }
    const ctx = c.getContext('2d'); ctx.setTransform(2, 0, 0, 2, 0, 0); ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#05200B';
    return ctx;
  };
  useEffect(() => { const ctx = preparar(); if (ctx && valor){ const img = new Image(); img.onload = () => { const r = ref.current.getBoundingClientRect(); ctx.drawImage(img, 0, 0, r.width, r.height); }; img.src = valor; } }, []);
  const pos = e => { const r = ref.current.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  return html`<div>
    <canvas ref=${ref} className="firma" aria-label="Espacio para firmar"
      onPointerDown=${e => { const ctx = preparar(); dib.current = true; ref.current.setPointerCapture(e.pointerId); const [x, y] = pos(e); ctx.beginPath(); ctx.moveTo(x, y); }}
      onPointerMove=${e => { if (!dib.current) return; const ctx = ref.current.getContext('2d'); const [x, y] = pos(e); ctx.lineTo(x, y); ctx.stroke(); }}
      onPointerUp=${() => { if (!dib.current) return; dib.current = false; onCambio(ref.current.toDataURL('image/png')); }}></canvas>
    <div className="fila" style=${{ marginTop: 6 }}>
      <button type="button" className="btn chico" onClick=${() => { const c = ref.current; c.getContext('2d').clearRect(0, 0, c.width, c.height); onCambio(''); }}>Borrar firma</button>
      ${valor && html`<span className="tag verde">Firmado</span>`}
    </div>
  </div>`;
}

/* =====================================================================
   FORMULARIO PARA LLENAR (lo usan el operario y la vista previa)
   ===================================================================== */
/* Una barrita por horario: verde registrado, naranja con alerta, amarilla si ya pasó sin registro */
/* reg = { '08:00': registro, ... } de UN equipo en UN día.
   Gris = todavía no toca; amarilla = pasaron 2 h sin registro. */
function Puntos({ horarios, reg, dia }){
  const ahora = new Date(); const m = ahora.getHours() * 60 + ahora.getMinutes();
  const pasado = h => (dia || diaKey(ahora)) < diaKey(ahora) || m > minutos(h) + 120;
  return html`<div className="puntos" aria-hidden="true">${horarios.map(h => { const r = reg[h]; const c = r ? (r.alertas.length ? 'mal' : 'ok') : pasado(h) ? 'falta' : ''; return html`<span key=${h} className=${'punto ' + c} title=${h + (r ? ' registrado' : pasado(h) ? ' sin registro' : ' pendiente')}></span>`; })}</div>`;
}
/**
 * Formulario listo para llenar. Lo usan el operario y la vista previa del constructor.
 * Props:
 *   preguntas  lista de preguntas (la versión PUBLICADA para el operario).
 *   activo     equipo escaneado (con área) o null en formatos generales.
 *   turno      horario del registro ('12:00') o ''.
 *   progreso   texto "Hoy lleva X de 4 registros" (opcional).
 *   onEnviar   recibe { valores, alertas } ya validados.
 *   previa     true en la vista previa: no guarda nada.
 * Al enviar: valida obligatorias SOLO de preguntas visibles, guarda solo
 * las visibles, aplica el redondeo y calcula qué preguntas quedaron en alerta.
 *
 * Pensado para que sea tan rápido como el papel:
 *   - Las preguntas automáticas y bloqueadas no se muestran como tarjetas; van
 *     resumidas (plegadas en la tarjeta del equipo). La primera pregunta en
 *     pantalla es la que hay que llenar (la temperatura), y recibe el foco.
 *   - Temperatura: botón «± Cambiar signo» porque el teclado numérico del iPhone
 *     no trae el signo menos; si el rango es negativo y escriben un positivo,
 *     se ofrece «¿Era -20 °C?».
 *   - El botón Enviar queda fijo abajo y avisa cuántas obligatorias faltan.
 *   - lecturas = { qid, lista:[{fecha, turno, v, alerta}] }: últimas lecturas del
 *     equipo; se muestran bajo esa pregunta de temperatura. Si la nueva lectura
 *     cambia 5 °C o más frente a la última, se pide confirmar (no bloquea).
 *   - revisionAbierta: si el equipo tiene un caso de revisión sin cerrar, se avisa.
 */
function Formulario({ titulo, descripcion, instructivo, preguntas, activo, usuario, turno, progreso, lecturas, revisionAbierta, onEnviar, previa }){
  const [valores, setValores] = useState(() => valoresIniciales(preguntas, activo, usuario, { turno }));
  const [errores, setErrores] = useState({});
  const [enviando, setEnviando] = useState(false);
  const vistos = useRef(new Set());
  const poner = (id, v) => { setValores(p => Object.assign({}, p, { [id]: v })); setErrores(p => { const n = Object.assign({}, p); delete n[id]; return n; }); };
  const visibles = preguntas.filter(q => esVisible(q, valores, preguntas, activo));
  /* Las preguntas automáticas y bloqueadas (sede, sección, código, horario…) no van como
     tarjetas: el operario no tiene que hacer nada con ellas. Se muestran resumidas
     (en la tarjeta del equipo, o en un recuadro si el formulario no viene de un QR). */
  const esAuto = q => q.tipo !== 'seccion' && q.autollenado && q.bloqueada;
  const automaticas = visibles.filter(esAuto);
  const paraLlenar = visibles.filter(q => !esAuto(q));
  // Un título de sección solo se muestra si debajo tiene al menos una pregunta para llenar.
  const conContenido = new Set();
  paraLlenar.forEach((q, i) => {
    if (q.tipo !== 'seccion') return;
    // Mira las preguntas que siguen hasta el próximo título: si hay alguna, el título se muestra.
    for (let j = i + 1; j < paraLlenar.length && paraLlenar[j].tipo !== 'seccion'; j++){ conContenido.add(q.id); break; }
  });
  const primeraTemp = paraLlenar.find(q => q.tipo === 'temperatura');
  // Obligatorias visibles que siguen vacías: se avisan en la barra de Enviar.
  const faltan = paraLlenar.filter(q => q.tipo !== 'seccion' && q.requerida && vacio(valores[q.id])).length;
  let num = 0;

  const enviar = async () => {
    const err = {};
    visibles.forEach(q => { if (q.tipo !== 'seccion' && q.requerida && !q.bloqueada && vacio(valores[q.id])) err[q.id] = 'Esta pregunta es obligatoria.'; });
    setErrores(err);
    if (Object.keys(err).length){ const primero = document.getElementById('preg-' + Object.keys(err)[0]); if (primero) primero.scrollIntoView({ behavior:'smooth', block:'center' }); return; }
    const limpio = {};
    visibles.forEach(q => { if (q.tipo === 'seccion' || vacio(valores[q.id])) return; limpio[q.id] = (q.tipo === 'temperatura' || q.tipo === 'numero') && q.redondear && !isNaN(valorNum(q, valores[q.id])) ? String(valorNum(q, valores[q.id])) : valores[q.id]; });
    const alertas = visibles.filter(q => enAlerta(q, valores[q.id], activo, valores)).map(q => q.id);
    setEnviando(true); await onEnviar({ valores: limpio, alertas }); setEnviando(false);
  };
  const aproximar = q => { const v = valores[q.id]; if (q.redondear && !vacio(v) && !isNaN(valorNum(q, v))) poner(q.id, String(valorNum(q, v))); };

  const control = q => {
    const v = valores[q.id];
    if (q.autollenado && q.bloqueada) return html`<div className="auto"><span>${vacio(v) ? 'Sin dato (se llena al escanear el QR)' : textoValor(q, v)}</span><small>Llenado automático</small></div>`;
    switch (q.tipo){
      case 'texto': return html`<input value=${v || ''} onChange=${e => poner(q.id, e.target.value)} />`;
      case 'parrafo': return html`<textarea value=${v || ''} onChange=${e => poner(q.id, e.target.value)}></textarea>`;
      case 'numero': return html`<input type="number" inputMode="decimal" value=${v ?? ''} onBlur=${() => aproximar(q)} onChange=${e => poner(q.id, e.target.value)} />`;
      case 'fecha': return html`<input type="date" value=${v || ''} onChange=${e => poner(q.id, e.target.value)} />`;
      case 'hora': return html`<input type="time" value=${v || ''} onChange=${e => poner(q.id, e.target.value)} />`;
      case 'temperatura': {
        const r = rangoDe(q, activo, valores); const fuera = enAlerta(q, v, activo, valores);
        const paso = q.redondear ? 1 : 0.5;
        const mover = d => { const n = valorNum(q, v); const base = isNaN(n) ? (r ? Number(vacio(r[1]) ? r[0] : r[1]) : 0) : n; poner(q.id, String(+(base + d).toFixed(1))); };
        const n = valorNum(q, v); const crudo = parseFloat(String(v).replace(',', '.'));
        // Cambia el signo del valor escrito: 20 → -20 y -20 → 20.
        const cambiarSigno = () => { const t = String(v ?? '').trim(); poner(q.id, t.startsWith('-') ? t.slice(1) : '-' + (t || '')); };
        // Si el rango solo admite negativos (congelación) y escribieron un positivo, casi seguro olvidaron el signo.
        const sugerirNegativo = r && !vacio(r[1]) && Number(r[1]) < 0 && !isNaN(n) && n > 0;
        return html`<div>
          <div className="temp">
            <button type="button" aria-label=${'Bajar ' + paso + ' grado'} onClick=${() => mover(-paso)}>−</button>
            <input type="number" inputMode="decimal" step=${q.redondear ? 1 : 0.1} aria-label=${q.etiqueta} value=${v ?? ''} autoFocus=${!previa && q === primeraTemp} onBlur=${() => aproximar(q)} onChange=${e => poner(q.id, e.target.value)} />
            <button type="button" aria-label=${'Subir ' + paso + ' grado'} onClick=${() => mover(paso)}>+</button>
          </div>
          <div className="temp-extra">
            <button type="button" className="btn chico" onClick=${cambiarSigno} aria-label="Cambiar el signo (positivo o negativo)">± Cambiar signo</button>
            ${sugerirNegativo && html`<button type="button" className="btn chico lima" onClick=${() => poner(q.id, String(-n))}>¿Era ${-n} °C?</button>`}
          </div>
          <div className="temp-u">grados Celsius${r ? ' · permitido: ' + fmtRango(r) : ''}</div>
          ${q.redondear && !isNaN(crudo) && crudo !== n && html`<div className="temp-u">Se registra como ${n} °C</div>`}
          ${lecturas && lecturas.qid === q.id && html`<div className="lecturas">
            ${lecturas.lista.length === 0 ? html`<span>Es la primera lectura de este equipo.</span>` : html`<${React.Fragment}>
              <span>Últimas lecturas:</span>
              ${lecturas.lista.map((l, i) => html`<span key=${i} className=${'lectura' + (l.alerta ? ' mal' : '')}>${nombreDia(l.fecha)} ${l.turno || fmtFecha(l.fecha).slice(11)} · <b>${l.v} °C</b></span>`)}
            <//>`}
          </div>`}
          ${lecturas && lecturas.qid === q.id && lecturas.lista.length > 0 && !isNaN(n) && Math.abs(n - lecturas.lista[0].v) >= 5 && html`<div className="aviso-caja">Cambió ${Math.abs(n - lecturas.lista[0].v)} °C desde la última lectura (${lecturas.lista[0].v} °C). Confirmá que leíste bien el termómetro.</div>`}
          ${fuera && html`<div className="alerta-caja" role="alert">Fuera del rango permitido (${fmtRango(r)}).</div>`}
          ${!fuera && !vacio(v) && r && html`<div className="rango-ok">Dentro del rango.</div>`}
        </div>`;
      }
      case 'opcion': return html`<div className="chips">${(q.opciones || []).filter(Boolean).map(o => html`<button type="button" key=${o} className=${'chip' + (v === o ? ' on' : '')} aria-pressed=${v === o} onClick=${() => poner(q.id, v === o ? '' : o)}>${o}</button>`)}</div>`;
      case 'multiple': { const arr = Array.isArray(v) ? v : []; return html`<div className="chips">${(q.opciones || []).filter(Boolean).map(o => html`<button type="button" key=${o} className=${'chip' + (arr.includes(o) ? ' on' : '')} aria-pressed=${arr.includes(o)} onClick=${() => poner(q.id, arr.includes(o) ? arr.filter(x => x !== o) : arr.concat(o))}>${o}</button>`)}</div>`; }
      case 'sino': return html`<div className="sino">${['Sí','No'].map(o => html`<button type="button" key=${o} className=${'chip' + (v === o ? ' on' : '')} aria-pressed=${v === o} onClick=${() => poner(q.id, o)}>${o}</button>`)}</div>`;
      case 'foto': return html`<div className="pila" style=${{ gap: 8 }}>
        ${v && html`<img className="foto-prev" src=${v} alt="Foto adjunta" />`}
        <div className="fila">
          <label className="btn foto-btn">${v ? 'Cambiar foto' : 'Tomar foto'}
            <input type="file" accept="image/*" capture="environment" onChange=${async e => { const f = e.target.files[0]; if (f) poner(q.id, await comprimirFoto(f)); e.target.value = ''; }} />
          </label>
          ${v && html`<button type="button" className="btn peligro" onClick=${() => poner(q.id, '')}>Quitar</button>`}
        </div>
      </div>`;
      case 'firma': return html`<${Firma} valor=${v} onCambio=${x => poner(q.id, x)} />`;
      default: return null;
    }
  };

  return html`<div className="form-llenar">
    <div className="form-cab">
      <h2>${titulo || 'Formulario sin nombre'}</h2>
      ${descripcion && !activo && html`<p className="muted chico" style=${{ marginTop: 4 }}>${descripcion}</p>`}
    </div>
    ${instructivo && html`<details className="instructivo"><summary>Ver instructivo</summary><div>${instructivo}</div></details>`}
    ${activo && html`<div className="equipo-chip"><span className="c">${activo.codigo}</span><span className="d">${activo.sede} · ${activo.seccion}</span><span className="d">${tipoCompleto(activo)}${turno ? ' · registro de las ' + turno : ''}</span>${progreso && html`<span className="d" style=${{ color:'var(--lime)' }}>${progreso}</span>`}
      ${automaticas.length > 0 && html`<details><summary>Ver los ${automaticas.length} datos que se llenaron solos</summary><dl>${automaticas.map(q => html`<${React.Fragment} key=${q.id}><dt>${q.etiqueta}</dt><dd>${textoValor(q, valores[q.id]) || '—'}</dd><//>`)}</dl></details>`}
    </div>`}
    ${revisionAbierta && html`<div className="aviso-caja">Este equipo tiene una revisión pendiente desde ${nombreDia(revisionAbierta.abierta)} a las ${fmtFecha(revisionAbierta.abierta).slice(11)}${revisionAbierta.veces > 1 ? ' (falló ' + revisionAbierta.veces + ' veces)' : ''}.</div>`}
    ${!activo && automaticas.length > 0 && html`<dl className="auto-lista">${automaticas.map(q => html`<${React.Fragment} key=${q.id}><dt>${q.etiqueta}</dt><dd>${textoValor(q, valores[q.id]) || '—'}</dd><//>`)}</dl>`}
    ${paraLlenar.map(q => {
      if (q.tipo === 'seccion') return conContenido.has(q.id) ? html`<div key=${q.id} className="sec-tit">${q.etiqueta}</div>` : null;
      num++;
      const nueva = q.condicion && q.condicion.qid && !String(q.condicion.qid).startsWith('@') && !vistos.current.has(q.id);
      vistos.current.add(q.id);
      return html`<div key=${q.id} id=${'preg-' + q.id} className=${'preg' + (errores[q.id] ? ' error' : '') + (nueva ? ' nueva' : '')}>
        <span className="et">${num}. ${q.etiqueta}${q.requerida && !q.bloqueada ? ' ' : ''}${q.requerida && !q.bloqueada ? html`<em aria-label="obligatoria">*</em>` : ''}</span>
        ${q.ayuda && html`<p className="ay">${q.ayuda}</p>`}
        ${control(q)}
        ${errores[q.id] && html`<p className="err">${errores[q.id]}</p>`}
      </div>`;
    })}
    <div className="barra-enviar">
      ${faltan > 0 && html`<p>${faltan === 1 ? 'Falta 1 pregunta obligatoria' : 'Faltan ' + faltan + ' preguntas obligatorias'}</p>`}
      <button type="button" className="btn pri enviar" disabled=${enviando} onClick=${enviar}>${previa ? 'Enviar (vista previa)' : enviando ? 'Guardando…' : 'Enviar registro'}</button>
    </div>
  </div>`;
}

/**
 * Entrada con usuario y contraseña. Se usa cuando hay servidor (Adaptador.requiereSesion).
 * onEntrar(usuario) recibe el usuario que devolvió el servidor.
 */
function LoginServidor({ onEntrar, equipoPendiente }){
  const [usuario, setUsuario] = useState('');
  const [clave, setClave] = useState('');
  const [error, setError] = useState('');
  const [entrando, setEntrando] = useState(false);
  const entrar = async e => {
    e.preventDefault(); setError(''); setEntrando(true);
    try{ const u = await Adaptador.iniciarSesion(usuario.trim(), clave); onEntrar(u); }
    catch(err){ setError(err.red ? 'No hay conexión con el servidor. Revisá la señal e intentá de nuevo.' : err.message || 'No se pudo entrar.'); }
    setEntrando(false);
  };
  return html`<div className="login">
    <section className="login-izq">
      <div className="sello">Supertiendas Cañaveral</div>
      <div><h1>Formatos digitales</h1><p>Registrá desde el celular escaneando el QR de cada equipo.</p></div>
    </section>
    <section className="login-der">
      <form className="pila" onSubmit=${entrar} style=${{ maxWidth: 420 }}>
        <h2 style=${{ fontSize: 24 }}>Entrar</h2>
        ${equipoPendiente && html`<p className="muted">Escaneaste el equipo <b className="codigo">${equipoPendiente}</b>. Entrá para registrar la lectura.</p>`}
        <label className="campo"><span>Usuario</span><input value=${usuario} autoComplete="username" autoCapitalize="none" onChange=${e => setUsuario(e.target.value)} /></label>
        <label className="campo"><span>Contraseña</span><input type="password" value=${clave} autoComplete="current-password" onChange=${e => setClave(e.target.value)} /></label>
        ${error && html`<p className="alerta-caja" role="alert">${error}</p>`}
        <button className="btn pri" type="submit" disabled=${entrando || !usuario.trim() || !clave}>${entrando ? 'Entrando…' : 'Entrar'}</button>
      </form>
    </section>
  </div>`;
}

/* Franja de estado de la conexión, a todo el ancho arriba de la pantalla. Solo aparece
   si hay algo que contar (sin señal, cambios por enviar o un cambio rechazado).
   Mientras se ve, corre el contenido hacia abajo (clase "con-aviso" en <body> y su
   alto en --alto-aviso) para no tapar el encabezado. */
function EstadoConexion({ estado, onCerrarRechazo }){
  const ref = useRef(null);
  let clase = '', texto = null;
  if (estado && estado.rechazo){ clase = 'conexion mal'; texto = html`<span>El servidor rechazó un cambio: ${estado.rechazo}</span><button className="btn chico" onClick=${onCerrarRechazo}>Entendido</button>`; }
  else if (estado && !estado.enLinea){ clase = 'conexion'; texto = 'Sin conexión' + (estado.pendientes ? ' · ' + estado.pendientes + (estado.pendientes === 1 ? ' cambio guardado' : ' cambios guardados') + ' en este celular; se enviarán solos' : ' · mostrando los últimos datos cargados'); }
  else if (estado && estado.pendientes){ clase = 'conexion'; texto = (estado.enviando ? 'Enviando' : 'Por enviar') + ': ' + estado.pendientes + (estado.pendientes === 1 ? ' cambio' : ' cambios') + '…'; }
  useLayoutEffect(() => {
    const alto = ref.current ? ref.current.offsetHeight : 0;
    document.body.classList.toggle('con-aviso', alto > 0);
    document.documentElement.style.setProperty('--alto-aviso', alto + 'px');
  });
  useEffect(() => () => document.body.classList.remove('con-aviso'), []);
  if (!texto) return null;
  return html`<div ref=${ref} className=${clase} role=${estado.rechazo ? 'alert' : 'status'}>${texto}</div>`;
}

/* =====================================================================
   OPERARIO
   ===================================================================== */
/**
 * Lector de QR con la cámara (BarcodeDetector del navegador).
 * Si no hay cámara: indica usar la cámara normal del celular (el QR abre
 * la app con ?equipo=CÓDIGO).
 *   codigoManual → muestra el campo para escribir el código (Sistema).
 *   simulador    → botones de prueba con códigos; SOLO para demostraciones.
 */
function Escaner({ equipos, onCodigo, onCerrar, codigoManual, simulador }){
  const vid = useRef(null);
  const [estado, setEstado] = useState('iniciando');
  const [texto, setTexto] = useState('');
  useEffect(() => {
    let stream = null, timer = null, vivo = true;
    (async () => {
      if (!('BarcodeDetector' in window) || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ setEstado('sin-camara'); return; }
      try{
        stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment' } });
        if (!vivo){ stream.getTracks().forEach(t => t.stop()); return; }
        vid.current.srcObject = stream; await vid.current.play();
        const det = new window.BarcodeDetector({ formats:['qr_code'] }); setEstado('leyendo');
        const tick = async () => { if (!vivo) return; try{ const r = await det.detect(vid.current); if (r.length){ onCodigo(extraerCodigo(r[0].rawValue)); return; } }catch(e){} timer = setTimeout(tick, 280); };
        tick();
      }catch(e){ setEstado('sin-permiso'); }
    })();
    return () => { vivo = false; clearTimeout(timer); if (stream) stream.getTracks().forEach(t => t.stop()); };
  }, []);
  const sinCamara = estado === 'sin-camara' || estado === 'sin-permiso';
  return html`<${Modal} titulo="Escanear el QR del equipo" onCerrar=${onCerrar}>
    ${!sinCamara && html`<video ref=${vid} className="camara" playsInline muted></video>`}
    ${!sinCamara && html`<p className="muted chico" style=${{ marginTop: 8 }}>Apuntá al QR pegado en el equipo. El registro se abre solo.</p>`}
    ${sinCamara && html`<div className="panel" style=${{ background:'var(--soft)', borderColor:'transparent' }}>
      <p><b>${estado === 'sin-permiso' ? 'No hay permiso para usar la cámara aquí.' : 'Este navegador no lee QR desde la app.'}</b></p>
      <p className="muted chico" style=${{ marginTop: 6 }}>Abrí la cámara normal del celular y apuntá al QR del equipo: el enlace abre esta app con el registro listo para llenar.</p>
    </div>`}
    ${codigoManual && html`<div className="pila" style=${{ marginTop: 14 }}>
      <label className="campo"><span>¿El QR está dañado? Escribí el código impreso debajo</span>
        <input placeholder="Ej. SC14-CBP-NEV-CON-01" value=${texto} autoCapitalize="characters" onChange=${e => setTexto(e.target.value)} onKeyDown=${e => { if (e.key === 'Enter' && texto.trim()) onCodigo(extraerCodigo(texto)); }} />
      </label>
      <button className="btn pri" style=${{ alignSelf:'flex-start' }} disabled=${!texto.trim()} onClick=${() => onCodigo(extraerCodigo(texto))}>Abrir equipo</button>
    </div>`}
    ${simulador && equipos.length > 0 && html`<div className="pila" style=${{ marginTop: 16, borderTop:'1px dashed var(--line)', paddingTop: 14 }}>
      <p className="chico"><span className="tag aviso">Solo demostración</span> Simulá que escaneaste un QR. Esto no aparece en la versión real.</p>
      <div className="chips">${equipos.slice(0, 16).map(a => html`<button type="button" key=${a.codigo} className="chip codigo" style=${{ minHeight: 36, padding:'6px 10px' }} onClick=${() => onCodigo(a.codigo)}>${a.codigo}</button>`)}</div>
    </div>`}
    <div className="modal-pie"><button className="btn" onClick=${onCerrar}>Cancelar</button></div>
  <//>`;
}
/**
 * Aplicación del operario (vista de celular). Dos pestañas:
 *   Registrar  → estado del horario actual (cuántos van y hasta qué hora hay
 *                plazo), equipos agrupados por sección con su avance (1/4…),
 *                formatos generales y lo registrado hoy (plegado).
 *                El botón de escanear queda fijo abajo.
 *   Resultados → la misma pantalla de resultados del administrador,
 *                limitada a los equipos de su sede y área.
 * Reglas: solo abre equipos de SU área (esMio); el formulario solo se
 * activa escaneando el QR; si el horario ya tiene registro, avisa.
 * equipoInicial = código recibido por la URL del QR al abrir la app.
 */
function Operario({ db, usuario, commit, salir, avisar, equipoInicial, limpiarEquipoInicial }){
  const [pantalla, setPantalla] = useState({ v:'inicio' });
  const [pestana, setPestana] = useState('registrar');
  const [escaneando, setEscaneando] = useState(false);
  const [eligiendo, setEligiendo] = useState(null);
  const ahora = new Date();
  const hoy = diaKey(ahora);
  const misAreas = usuario.areas || [];
  const esMio = a => equipoEsDe(db, usuario, a);   // misma regla que valida los permisos al guardar
  void misAreas;
  const misEquipos = db.activos.filter(a => a.estado === 'activo' && esMio(a));
  const formsEquipo = db.formularios.filter(f => f.publicado && !f.archivado && f.vinculo === 'equipo');
  const formsLibres = db.formularios.filter(f => f.publicado && !f.archivado && f.vinculo === 'libre');
  const sedeU = db.sedes.find(s => s.nombre === usuario.sede);
  const cierre = (sedeU && sedeU.horaCierre) || '';
  const fPrin = formsEquipo[0];
  const horarios = (fPrin && fPrin.horarios && fPrin.horarios.length ? fPrin.horarios : HORARIOS_DEF).slice().sort();
  const turno = turnoDe(horarios, ahora, cierre);
  const ultimo = horarios[horarios.length - 1];
  const hechosTurno = new Set(db.respuestas.filter(r => r.activo && diaKey(r.fecha) === hoy && r.turno === turno).map(r => r.activo));
  const pendientes = misEquipos.filter(a => !hechosTurno.has(a.codigo));
  const idsEquipo = new Set(formsEquipo.map(f => f.id));
  const hoyPorEquipo = {};
  db.respuestas.forEach(r => { if (r.activo && r.turno && idsEquipo.has(r.formId) && diaKey(r.fecha) === hoy){ const e = hoyPorEquipo[r.activo] = hoyPorEquipo[r.activo] || {}; if (!e[r.turno] || e[r.turno].fecha < r.fecha) e[r.turno] = r; } });
  const cuantos = c => horarios.filter(h => (hoyPorEquipo[c] || {})[h]).length;
  const completos = misEquipos.filter(a => cuantos(a.codigo) === horarios.length).length;
  const ordenados = misEquipos.slice().sort((a, b) => (hechosTurno.has(a.codigo) - hechosTurno.has(b.codigo)) || (cuantos(a.codigo) - cuantos(b.codigo)) || a.codigo.localeCompare(b.codigo));
  const misHoy = db.respuestas.filter(r => r.usuarioId === usuario.id && diaKey(r.fecha) === hoy).sort((a, b) => b.fecha.localeCompare(a.fecha));
  // Casos de revisión abiertos de SUS equipos (activos y de su área), el más antiguo primero.
  const misRevisiones = (db.revisiones || []).filter(v => !v.cerrada && misEquipos.some(a => a.codigo === v.equipo)).sort((a, b) => a.abierta.localeCompare(b.abierta));
  const [cerrando, setCerrando] = useState(null);   // caso que se está cerrando (ventana de confirmación)
  const [notaCierre, setNotaCierre] = useState('');
  /* Últimas 3 lecturas de un equipo en un formulario, para mostrarlas al registrar.
     Se usan las respuestas a la primera pregunta de temperatura del formulario publicado. */
  const lecturasDe = (f, codigo) => {
    const qT = f.publicado.preguntas.find(q => q.tipo === 'temperatura');
    if (!qT) return null;
    const lista = db.respuestas.filter(r => r.formId === f.id && r.activo === codigo && !vacio(r.valores[qT.id]) && !isNaN(parseFloat(r.valores[qT.id])))
      .sort((a, b) => b.fecha.localeCompare(a.fecha)).slice(0, 3)
      .map(r => ({ fecha: r.fecha, turno: r.turno, v: parseFloat(r.valores[qT.id]), alerta: r.alertas.includes(qT.id) }));
    return { qid: qT.id, lista };
  };

  const abrirEquipo = useCallback(codigo => {
    setEscaneando(false); setPestana('registrar');
    const a = db.activos.find(x => x.codigo === codigo);
    if (!a){ avisar('No encontramos el equipo ' + codigo + '. Revisá el código o avisale a tu administrador.', 'error'); return; }
    if (a.estado !== 'activo'){ avisar('El equipo ' + codigo + ' está dado de baja.', 'error'); return; }
    if (!esMio(a)){ avisar('Este equipo es de ' + areaDe(db, a.seccion) + (a.sede !== usuario.sede ? ' en ' + a.sede : '') + '. Tu usuario registra ' + textoAreas(usuario) + '. Si te toca cubrir esa área, pedile al administrador que te la asigne.', 'error'); return; }
    const fs = formsEquipo.filter(f => !f.tipoEquipo || f.tipoEquipo === a.tipo);
    if (!fs.length){ avisar('Este equipo todavía no tiene un formulario asignado.', 'error'); return; }
    const act = conArea(db, a);
    const abrir = f => {
      const t = turnoDe(f.horarios, new Date(), cierre);
      if (db.respuestas.some(r => r.formId === f.id && r.activo === a.codigo && diaKey(r.fecha) === diaKey(new Date()) && r.turno === t)) avisar('Este equipo ya tiene registro del horario de las ' + t + '. Si lo enviás otra vez quedan los dos.');
      setPantalla({ v:'llenar', formId: f.id, activo: act, turno: (f.horarios && f.horarios.length) ? t : '' });
    };
    if (fs.length === 1) abrir(fs[0]); else setEligiendo({ activo: act, forms: fs, abrir });
  }, [db, cierre]);

  useEffect(() => { if (equipoInicial){ abrirEquipo(equipoInicial); limpiarEquipoInicial(); } }, [equipoInicial]);
  // Cada vez que cambia la pantalla o la pestaña, se vuelve arriba (si no, un formulario abre a la mitad).
  useEffect(() => { try{ window.scrollTo(0, 0); }catch(e){} }, [pantalla.v, pantalla.formId, pestana]);

  const guardar = async (form, activo, turnoReg, { valores, alertas }) => {
    /* Fotos y firmas se suben como archivos; en el registro queda solo su dirección
       (en modo local la "dirección" es la misma imagen). */
    const conArchivos = Object.assign({}, valores);
    for (const q of form.publicado.preguntas){
      if ((q.tipo === 'foto' || q.tipo === 'firma') && conArchivos[q.id]){
        try{ conArchivos[q.id] = await Adaptador.subirArchivo(conArchivos[q.id]); }
        catch(e){ avisar('No se pudo subir la imagen de «' + q.etiqueta + '». Intentá de nuevo.', 'error'); return; }
      }
    }
    valores = conArchivos;
    // La hora la da el adaptador (con servidor, la hora oficial la pone el servidor).
    const r = { id:'r' + uid(), formId: form.id, version: form.publicado.version, usuarioId: usuario.id, usuario: usuario.nombre, fecha: Adaptador.ahora().toISOString(), turno: turnoReg || '', activo: activo ? activo.codigo : null, sede: activo ? activo.sede : (usuario.sede || ''), seccion: activo ? activo.seccion : '', valores, alertas };
    // Guarda el registro y, si no se reguló, abre (o suma a) el caso de revisión del equipo.
    const guardado = commit(d => { d.respuestas.push(r); registrarRevision(d, form, r); }, null);
    if (!guardado) return;   // sin permiso: el aviso ya se mostró y el formulario queda como estaba
    setPantalla({ v:'listo', formId: form.id, activo, turno: turnoReg, alertas: alertas.length });
  };

  let cuerpo;
  if (pestana === 'resultados'){
    cuerpo = html`<${Resultados} db=${db} avisar=${avisar} alcance=${esMio} usuarioId=${usuario.id} />`;
  } else if (pantalla.v === 'llenar'){
    const f = db.formularios.find(x => x.id === pantalla.formId);
    cuerpo = html`<div>
      <div style=${{ padding:'10px 16px 0', marginBottom: -6 }}><button className="btn chico plano" style=${{ paddingLeft: 0 }} onClick=${() => setPantalla({ v:'inicio' })}>← Volver al inicio</button></div>
      <${Formulario} key=${f.id + (pantalla.activo ? pantalla.activo.codigo : '')} titulo=${f.nombre} descripcion=${f.descripcion} instructivo=${f.instructivo} preguntas=${f.publicado.preguntas} activo=${pantalla.activo} usuario=${usuario} turno=${pantalla.turno} progreso=${pantalla.activo && pantalla.turno ? 'Hoy lleva ' + cuantos(pantalla.activo.codigo) + ' de ' + horarios.length + ' registros' : ''}
        lecturas=${pantalla.activo ? lecturasDe(f, pantalla.activo.codigo) : null}
        revisionAbierta=${pantalla.activo ? (db.revisiones || []).find(v => v.equipo === pantalla.activo.codigo && !v.cerrada) : null} onEnviar=${x => guardar(f, pantalla.activo, pantalla.turno, x)} />
    </div>`;
  } else if (pantalla.v === 'listo'){
    cuerpo = html`<div className="op-cuerpo">
      <div className="panel" style=${{ borderColor: pantalla.alertas ? 'var(--alert)' : 'var(--forest)' }}>
        <h2 style=${{ fontSize: 22 }}>Registro guardado</h2>
        <p className="muted" style=${{ marginTop: 6 }}>${pantalla.activo ? pantalla.activo.codigo + ' · ' : ''}${pantalla.turno ? 'horario de las ' + pantalla.turno + ' · ' : ''}${fmtFecha(new Date().toISOString())}</p>
        ${pantalla.activo && pantalla.turno && html`<div style=${{ marginTop: 12 }}><span className="cuenta">${cuantos(pantalla.activo.codigo)}/${horarios.length} <small>registros hoy en este equipo</small></span><${Puntos} horarios=${horarios} reg=${hoyPorEquipo[pantalla.activo.codigo] || {}} /></div>`}
        ${pantalla.alertas ? html`<p className="alerta-caja">Quedó marcado como alerta y ya aparece en el tablero del administrador.</p>` : html`<p className="rango-ok">Todo en orden.</p>`}
      </div>
      <p className="muted chico" style=${{ textAlign:'center' }}>${pendientes.length ? 'Te faltan ' + pendientes.length + ' equipos del horario de las ' + turno + '.' : 'Ya registraste todos tus equipos del horario de las ' + turno + '.'}</p>
      <button className="btn" onClick=${() => setPantalla({ v:'inicio' })}>Ir al inicio</button>
    </div>`;
  } else {
    // ---- Plazo del horario actual: se considera a tiempo hasta 2 horas después de su hora ----
    const minAhora = ahora.getHours() * 60 + ahora.getMinutes();
    const inicioT = minutos(turno), finT = minutos(turno) + 120;
    const siguiente = horarios.find(h => minutos(h) > minAhora);
    const textoPlazo = minAhora < inicioT ? 'Empieza a las ' + turno
      : minAhora <= finT ? 'A tiempo hasta las ' + pad(Math.floor(finT / 60) % 24) + ':' + pad(finT % 60)
      : 'Ya pasó el plazo' + (siguiente ? ' · siguiente: ' + siguiente : '');
    const hechos = misEquipos.length - pendientes.length;

    // ---- Equipos agrupados por sección; las secciones con pendientes van primero y abiertas ----
    const porSeccion = {};
    misEquipos.forEach(a => { (porSeccion[a.seccion] = porSeccion[a.seccion] || []).push(a); });
    const secciones = Object.entries(porSeccion).map(([nombre, lista]) => ({
      nombre,
      lista: lista.slice().sort((x, y) => (hechosTurno.has(x.codigo) - hechosTurno.has(y.codigo)) || x.codigo.localeCompare(y.codigo)),
      pend: lista.filter(a => !hechosTurno.has(a.codigo)).length
    })).sort((x, y) => (y.pend > 0) - (x.pend > 0) || x.nombre.localeCompare(y.nombre));

    cuerpo = html`<div className="op-cuerpo">
      <div className="estado-turno">
        <div className="fila" style=${{ justifyContent:'space-between', alignItems:'flex-start' }}>
          <div><span className="muted chico" style=${{ fontWeight: 800 }}>Horario de las ${turno}</span><div className="grande">${hechos} <small>de ${misEquipos.length} equipos</small></div></div>
          <span className=${'tag ' + (pendientes.length === 0 ? 'verde' : minAhora <= finT ? 'aviso' : 'alerta')}>${pendientes.length === 0 ? 'Completo' : textoPlazo}</span>
        </div>
        <div className="barra"><i style=${{ width: (misEquipos.length ? 100 * hechos / misEquipos.length : 0) + '%' }}></i></div>
        <p className="muted chico" style=${{ marginTop: 8 }}>Registros del día: ${horarios.join(' · ')}${cierre && minutos(cierre) < minutos(ultimo) ? ' · tu sede cierra a las ' + cierre + ': el de las ' + ultimo + ' se hace antes del cierre' : ''}</p>
      </div>

      ${misRevisiones.length > 0 && html`<section className="pila" style=${{ gap: 8 }}>
        <div className="fila" style=${{ justifyContent:'space-between' }}><h3 style=${{ fontSize: 16 }}>Revisiones pendientes</h3><span className="tag alerta">${misRevisiones.length}</span></div>
        <p className="muted chico">Equipos que no regularon su temperatura y quedaron esperando revisión. Cerralo cuando ya lo hayan revisado.</p>
        ${misRevisiones.map(v => { const a = misEquipos.find(x => x.codigo === v.equipo); return html`<div key=${v.id} className="revision-op">
          <div className="fila" style=${{ justifyContent:'space-between', alignItems:'flex-start', flexWrap:'nowrap' }}>
            <span style=${{ minWidth: 0 }}><b className="codigo">${v.equipo.split('-').slice(2).join('-')}</b><small>${v.seccion}${a ? ' · ' + tipoCompleto(a).toLowerCase() : ''}</small></span>
            <span className="tag alerta" style=${{ flexShrink: 0 }}>${hace(v.abierta)}</span>
          </div>
          ${v.solicitud && html`<p className="chico" style=${{ marginTop: 6 }}><b>Solicitud:</b> ${v.solicitud}</p>`}
          ${v.veces > 1 && html`<p className="chico" style=${{ marginTop: 4, color:'var(--alert)', fontWeight: 800 }}>Volvió a fallar ${v.veces - 1} ${v.veces === 2 ? 'vez' : 'veces'} más · última ${nombreDia(v.ultima)} ${fmtFecha(v.ultima).slice(11)}</p>`}
          <button className="btn chico" style=${{ marginTop: 8 }} onClick=${() => { setCerrando(v); setNotaCierre(''); }}>Ya lo revisaron</button>
        </div>`; })}
      </section>`}

      <section className="pila" style=${{ gap: 8 }}>
        <div className="fila" style=${{ justifyContent:'space-between' }}><h3 style=${{ fontSize: 16 }}>Tus equipos</h3><span className="muted chico">${completos} de ${misEquipos.length} con los ${horarios.length} registros del día</span></div>
        ${misEquipos.length === 0 ? html`<p className="muted chico">No tenés equipos asignados. Pedile al administrador que revise tu área.</p>` :
          secciones.map(sc => html`<details key=${sc.nombre} className="seccion-op" open=${sc.pend > 0}>
            <summary><span>${sc.nombre}</span><span className=${'tag ' + (sc.pend ? 'aviso' : 'verde')}>${sc.pend ? 'Faltan ' + sc.pend : 'Al día'}</span></summary>
            ${sc.lista.map(a => { const n = cuantos(a.codigo); const listo = hechosTurno.has(a.codigo); return html`<div key=${a.codigo} className="eq-fila" data-codigo=${a.codigo}>
              <span style=${{ minWidth: 0 }}><b>${a.codigo.split('-').slice(2).join('-')}</b><small>${tipoCompleto(a).toLowerCase()}</small></span>
              <${Puntos} horarios=${horarios} reg=${hoyPorEquipo[a.codigo] || {}} />
              <span className="cuenta" style=${{ color: listo ? 'var(--ok)' : 'var(--text)' }} title=${listo ? 'Registrado en el horario de las ' + turno : 'Falta el horario de las ' + turno}>${n}/${horarios.length}</span>
            </div>`; })}
          </details>`)}
      </section>

      ${formsLibres.length > 0 && html`<section className="pila" style=${{ gap: 8 }}>

        <div className="lista-op">${formsLibres.map(f => html`<button key=${f.id} className="item-op" onClick=${() => setPantalla({ v:'llenar', formId: f.id, activo: null, turno:'' })}><span><b>${f.nombre}</b><span className="muted chico">${f.descripcion}</span></span><span className="tag">Llenar</span></button>`)}</div>
      </section>`}

      <details className="plegable">
        <summary>Lo que registraste hoy (${misHoy.length})</summary>
        ${misHoy.length === 0 ? html`<p className="muted chico">Todavía no has enviado registros hoy.</p>` : html`<div className="pila" style=${{ gap: 6 }}>
          ${misHoy.slice(0, 12).map(r => { const f = db.formularios.find(x => x.id === r.formId); return html`<div key=${r.id} className="fila" style=${{ justifyContent:'space-between', borderBottom:'1px solid var(--line)', paddingBottom: 6 }}><span><b className="codigo">${r.activo || (f && f.nombre)}</b><span className="muted chico"> · ${r.turno ? r.turno + ' · ' : ''}${fmtFecha(r.fecha).slice(11)}${f && valorDe(r, preguntaTemperatura(f.publicado.preguntas)) ? ' · ' + valorDe(r, preguntaTemperatura(f.publicado.preguntas)) : ''}</span></span>${r.alertas.length ? html`<span className="tag alerta">Alerta</span>` : html`<span className="tag verde">OK</span>`}</div>`; })}
          <button className="btn chico" style=${{ alignSelf:'flex-start' }} onClick=${() => setPestana('resultados')}>Ver todos en Resultados</button>
        </div>`}
      </details>
    </div>`;
  }

  // Botón de escanear fijo abajo: en el inicio y en la confirmación (no mientras se llena ni en Resultados).
  const conBarra = pestana === 'registrar' && pantalla.v !== 'llenar';

  return html`<div className=${'op' + (pestana === 'resultados' ? ' ancho' : '')}>
    <header className="op-cab">
      <div className="fila"><span><b>${usuario.nombre}</b><br/><small>${usuario.sede || 'Sin sede asignada'} · ${textoAreas(usuario)}</small></span><button className="btn chico" onClick=${salir}>Salir</button></div>
      <div className="op-tabs" role="tablist">
        <button role="tab" aria-selected=${pestana === 'registrar'} className=${'op-tab' + (pestana === 'registrar' ? ' on' : '')} onClick=${() => setPestana('registrar')}>Registrar</button>
        <button role="tab" aria-selected=${pestana === 'resultados'} className=${'op-tab' + (pestana === 'resultados' ? ' on' : '')} onClick=${() => setPestana('resultados')}>Resultados</button>
      </div>
    </header>
    ${cuerpo}
    ${conBarra && html`<div className="op-barra"><button className="escanear" onClick=${() => { setPantalla({ v:'inicio' }); setEscaneando(true); }}><b>${pantalla.v === 'listo' ? 'Escanear otro equipo' : 'Escanear QR del equipo'}</b></button></div>`}
    ${escaneando && html`<${Escaner} equipos=${misEquipos} codigoManual=${!!db.config.codigoManual} simulador=${MODO_DEMO && db.config.simulador !== false} onCodigo=${abrirEquipo} onCerrar=${() => setEscaneando(false)} />`}
    ${cerrando && html`<${Modal} titulo=${'Cerrar revisión de ' + cerrando.equipo} onCerrar=${() => setCerrando(null)}>
      <p className="muted">Pedida ${nombreDia(cerrando.abierta)} a las ${fmtFecha(cerrando.abierta).slice(11)}${cerrando.veces > 1 ? ' · falló ' + cerrando.veces + ' veces' : ''}.</p>
      <label className="campo" style=${{ marginTop: 12 }}><span>¿Qué se hizo? (opcional)</span><textarea value=${notaCierre} placeholder="Ej.: mantenimiento cambió el empaque de la puerta" onChange=${e => setNotaCierre(e.target.value)}></textarea></label>
      <p className="muted chico" style=${{ marginTop: 8 }}>En el próximo horario la lectura del equipo confirmará si quedó bien.</p>

          setCerrando(null); avisar('Revisión cerrada.');

    <//>`}

/**
 * Cumplimiento por horario con "embudo": Sedes → Secciones → Equipos.
 *
 * - Arriba se elige el horario (08:00, 12:00…). Cada botón muestra cuántos
 *   equipos tienen registro en ese horario.
 * - Un CLIC en una fila baja un nivel (sede → sus secciones → sus equipos).
 *   Las migas de pan ("Todas las sedes › SC PUNTO 14 › …") permiten subir.
 * - DOBLE CLIC en una fila, o el botón "Planilla", abre Resultados → Planilla
 *   ya filtrada por esa sede / sección / equipo, con el detalle de los 4 horarios.
 * - En el nivel de equipos, un clic muestra su tendencia en la gráfica del tablero.
 *
 * Estado de cada fila:
 *   Cumplió     → todos sus equipos tienen registro en ese horario.
 *   En curso    → faltan registros pero el horario todavía está dentro de su
 *                 margen de 2 horas (todavía se puede cumplir).
 *   No cumplió  → faltan registros y ya pasó el margen.
 * Los que no cumplieron salen primero.
 *
 * Props:
 *   db, form      datos y formulario seleccionado en el tablero.
 *   equipos       equipos del alcance del tablero (ya filtrados por sede si aplica).
 *   registrosHoy  registros de hoy de ese formulario.
 *   horarios      horarios del formulario, ordenados.
 *   sedeFija      sede elegida en el filtro del tablero ('' = todas). Si viene,
 *                 el embudo arranca en esa sede y no se puede subir más.
 *   ir            navegación de la app (para abrir la planilla).
 *   onEquipo      se llama con el código cuando se toca un equipo.
 */
function CumplimientoHorario({ db, form, equipos, registrosHoy, horarios, sedeFija, ir, onEquipo }){
  const ahora = new Date(); const ahoraMin = ahora.getHours() * 60 + ahora.getMinutes();
  // Horario por defecto: el último que ya empezó (o el primero si aún no empieza ninguno).
  const yaEmpezados = horarios.filter(h => minutos(h) <= ahoraMin);
  const [horario, setHorario] = useState(yaEmpezados.length ? yaEmpezados[yaEmpezados.length - 1] : horarios[0]);
  const [nivel, setNivel] = useState({ sede: sedeFija || '', seccion: '' });
  const [soloPendientes, setSoloPendientes] = useState(false);
  const qTemp = form.publicado.preguntas.find(q => q.tipo === 'temperatura');

  // Último registro de cada equipo en el horario elegido.
  const regDe = {};
  registrosHoy.forEach(r => { if (r.turno === horario && r.activo && (!regDe[r.activo] || regDe[r.activo].fecha < r.fecha)) regDe[r.activo] = r; });
  const enCurso = ahoraMin <= minutos(horario) + 120;
  const cuentaPorHorario = h => new Set(registrosHoy.filter(r => r.turno === h && r.activo).map(r => r.activo)).size;

  // Arma las filas del nivel actual: agrupa los equipos por sede o por sección.
  const agrupar = (lista, campo) => {
    const g = {};
    lista.forEach(a => { const k = a[campo]; g[k] = g[k] || { nombre: k, total: 0, ok: 0 }; g[k].total++; if (regDe[a.codigo]) g[k].ok++; });
    return Object.values(g);
  };
  const enNivel = equipos.filter(a => (!nivel.sede || a.sede === nivel.sede) && (!nivel.seccion || a.seccion === nivel.seccion));
  const tipoNivel = !nivel.sede ? 'sede' : !nivel.seccion ? 'seccion' : 'equipo';
  let filas = tipoNivel === 'equipo'
    ? enNivel.map(a => ({ nombre: a.codigo, detalle: tipoCompleto(a).toLowerCase(), total: 1, ok: regDe[a.codigo] ? 1 : 0, equipo: a, reg: regDe[a.codigo] }))
    : agrupar(enNivel, tipoNivel);
  if (soloPendientes) filas = filas.filter(f => f.ok < f.total);
  filas.sort((a, b) => (a.ok / a.total) - (b.ok / b.total) || a.nombre.localeCompare(b.nombre));
  const okNivel = enNivel.filter(a => regDe[a.codigo]).length;

  const estado = f => f.ok === f.total ? html`<span className="tag verde">Cumplió</span>`
    : enCurso ? html`<span className="tag aviso">En curso · ${f.total === 1 ? 'pendiente' : 'faltan ' + (f.total - f.ok)}</span>`
    : html`<span className="tag alerta">No cumplió${f.total === 1 ? '' : ' · faltan ' + (f.total - f.ok)}</span>`;

  // Bajar un nivel (clic) o abrir la planilla con el filtro de esa fila (doble clic / botón).
  const bajar = f => {
    if (tipoNivel === 'sede') setNivel({ sede: f.nombre, seccion: '' });
    else if (tipoNivel === 'seccion') setNivel({ sede: nivel.sede, seccion: f.nombre });
    else onEquipo(f.nombre);
  };
  const abrirPlanilla = f => {
    const filtro = { formId: form.id, vista: 'planilla', sede: nivel.sede, seccion: nivel.seccion, buscar: '' };
    if (f && tipoNivel === 'sede') filtro.sede = f.nombre;
    if (f && tipoNivel === 'seccion') filtro.seccion = f.nombre;
    if (f && tipoNivel === 'equipo') filtro.buscar = f.nombre;
    ir('resultados', filtro);
  };

  return html`<div className="panel" style=${{ marginBottom: 14 }}>
    <div className="fila" style=${{ justifyContent:'space-between', marginBottom: 12 }}>
      <div><h3 style=${{ fontSize: 16 }}>Cumplimiento por horario</h3><p className="muted chico">Clic para bajar de nivel · doble clic o «Planilla» para ver el detalle de los 4 horarios.</p></div>
      <label className="check"><input type="checkbox" checked=${soloPendientes} onChange=${e => setSoloPendientes(e.target.checked)} /> Solo los que no han cumplido</label>
    </div>

    <div className="horarios-sel" role="group" aria-label="Horario">${horarios.map(h => { const n = cuentaPorHorario(h); return html`<button key=${h} className=${'horario-btn' + (h === horario ? ' on' : '')} aria-pressed=${h === horario} onClick=${() => setHorario(h)}>
      <span className="fila" style=${{ justifyContent:'space-between', fontWeight: 800 }}><span>${h}</span><span className="chico">${n} de ${equipos.length}</span></span>
      <span className="barra"><i style=${{ width: (equipos.length ? 100 * n / equipos.length : 0) + '%' }}></i></span>
    </button>`; })}</div>

    <div className="fila" style=${{ justifyContent:'space-between', marginBottom: 10 }}>
      <nav className="migas" aria-label="Nivel">
        ${sedeFija ? html`<span className=${tipoNivel === 'seccion' ? 'actual' : ''}>${!nivel.seccion ? sedeFija : html`<button onClick=${() => setNivel({ sede: sedeFija, seccion: '' })}>${sedeFija}</button>`}</span>`
          : tipoNivel === 'sede' ? html`<span className="actual">Todas las sedes</span>` : html`<button onClick=${() => setNivel({ sede: '', seccion: '' })}>Todas las sedes</button>`}
        ${nivel.sede && !sedeFija && html`<${React.Fragment}><span className="muted">›</span>${!nivel.seccion ? html`<span className="actual">${nivel.sede}</span>` : html`<button onClick=${() => setNivel({ sede: nivel.sede, seccion: '' })}>${nivel.sede}</button>`}<//>`}
        ${nivel.seccion && html`<${React.Fragment}><span className="muted">›</span><span className="actual">${nivel.seccion}</span><//>`}
      </nav>
      <span className="fila chico">
        <b>${okNivel} de ${enNivel.length} equipos registraron a las ${horario}</b>
        <button className="btn chico" onClick=${() => abrirPlanilla(null)}>Planilla de este nivel</button>
      </span>
    </div>

    ${filas.length === 0 ? html`<p className="rango-ok">${soloPendientes ? 'Todos cumplieron en este horario.' : 'No hay equipos en este nivel.'}</p>` : html`<div className="cump-lista limitada">${filas.map(f => html`<div key=${f.nombre} className="cump-fila" role="button" tabIndex="0"
        title=${tipoNivel === 'equipo' ? 'Clic: ver tendencia · doble clic: planilla' : 'Clic: ver detalle · doble clic: planilla'}
        onClick=${() => bajar(f)} onDoubleClick=${() => abrirPlanilla(f)} onKeyDown=${e => { if (e.key === 'Enter') bajar(f); }}>
      <span className="nom">${tipoNivel === 'equipo' ? html`<span className="codigo">${f.nombre}</span>` : f.nombre}
        <small>${tipoNivel === 'equipo' ? f.detalle + (f.reg ? ' · ' + fmtFecha(f.reg.fecha).slice(11) + ' · ' + f.reg.usuario : '') : (f.total === 1 ? '1 equipo' : f.total + ' equipos')}</small></span>
      <span className="barra"><i style=${{ width: (100 * f.ok / f.total) + '%', background: f.ok === f.total ? 'var(--b-bien)' : enCurso ? 'var(--b-medio)' : 'var(--b-mal)' }}></i></span>
      <span className="num">${tipoNivel === 'equipo' ? (f.reg && qTemp && !vacio(f.reg.valores[qTemp.id]) ? f.reg.valores[qTemp.id] + ' °C' : '—') : f.ok + '/' + f.total}</span>
      ${tipoNivel === 'equipo' && f.reg && f.reg.alertas.length ? html`<span className="tag alerta">Alerta</span>` : estado(f)}
      <button className="btn chico" onClick=${e => { e.stopPropagation(); abrirPlanilla(f); }}>Planilla</button>
    </div>`)}</div>`}
  </div>`;
}

/* Clase de color de una celda según su %: mismos cortes que el cumplimiento diario. */
const claseCumpl = pct => pct === null ? 'c-nada' : pct >= 95 ? 'c-bien' : pct >= 80 ? 'c-medio' : 'c-mal';

/**
 * MAPA DE CALOR de cumplimiento: muestra QUIÉN falla SIEMPRE y CUÁNDO.
 *
 * Filas: las sedes (o las secciones, si el tablero tiene una sede elegida).
 * Columnas, según el modo:
 *   'horario' → los horarios del formulario. Cada celda = % de cumplimiento de
 *               ese horario en los últimos 7 días. Sirve para ver patrones como
 *               "esta sede siempre falla a las 20:00".
 *   'dia'     → los últimos 14 días. Cada celda = % del día completo.
 * Última columna: el promedio de la fila. Las filas peores salen primero.
 *
 * Mismo cálculo que el cumplimiento diario: registros hechos ÷ esperados,
 * contando una vez cada pareja equipo + horario. Hoy solo cuentan los
 * horarios que ya empezaron; los días antes del primer registro no cuentan.
 *
 * Props:
 *   equipos    equipos del alcance del tablero.
 *   resps      registros del formulario en el alcance del tablero.
 *   horarios   horarios del formulario.
 *   primerDia  primer día con registros ('AAAA-MM-DD').
 *   sedeFija   sede de la cabecera ('' = todas). Si viene, las filas son secciones.
 *   onCelda    ({ grupo, dia }) al tocar una celda → abre la planilla filtrada.
 */
function MapaCalor({ equipos, resps, horarios, primerDia, sedeFija, onCelda }){
  const [modo, setModo] = useState('horario');
  const campo = sedeFija ? 'seccion' : 'sede';
  const hoy = diaKey(new Date());
  const ahoraMin = new Date().getHours() * 60 + new Date().getMinutes();
  const nDias = modo === 'horario' ? 7 : 14;
  const dias = [];
  for (let i = nDias - 1; i >= 0; i--){ const k = diaKey(Date.now() - i * 864e5); if (primerDia && k >= primerDia) dias.push(k); }
  const horariosDe = k => k === hoy ? horarios.filter(h => minutos(h) <= ahoraMin) : horarios;

  // Parejas hechas: 'dia|equipo|horario' (una sola vez aunque haya dos registros).
  const hechas = new Set();
  resps.forEach(r => { if (r.activo && r.turno) hechas.add(diaKey(r.fecha) + '|' + r.activo + '|' + r.turno); });

  // Equipos por grupo (sede o sección).
  const grupos = {};
  equipos.forEach(a => { (grupos[a[campo]] = grupos[a[campo]] || []).push(a.codigo); });

  // Una celda = { hechos, esperados } para un grupo y una columna (horario o día).
  const celda = (codigos, col) => {
    let hechos = 0, esperados = 0;
    const diasCol = modo === 'horario' ? dias.filter(k => horariosDe(k).includes(col)) : [col];
    diasCol.forEach(k => {
      const hs = modo === 'horario' ? [col] : horariosDe(k);
      codigos.forEach(c => hs.forEach(h => { esperados++; if (hechas.has(k + '|' + c + '|' + h)) hechos++; }));
    });
    return { hechos, esperados, pct: esperados ? Math.round(100 * hechos / esperados) : null };
  };
  const columnas = modo === 'horario' ? horarios : dias;
  const filas = Object.entries(grupos).map(([nombre, codigos]) => {
    const celdas = columnas.map(c => celda(codigos, c));
    const t = celdas.reduce((acc, c) => ({ h: acc.h + c.hechos, e: acc.e + c.esperados }), { h: 0, e: 0 });
    return { nombre, n: codigos.length, celdas, prom: t.e ? Math.round(100 * t.h / t.e) : null };
  }).sort((a, b) => (a.prom ?? 101) - (b.prom ?? 101) || a.nombre.localeCompare(b.nombre));

  return html`<div className="panel" style=${{ marginBottom: 14 }}>
    <div className="panel-tit">
      <div><h3>Mapa de calor · ${sedeFija ? 'secciones de ' + sedeFija : 'sedes'}</h3><p className="muted chico">${modo === 'horario' ? 'Cumplimiento de cada horario en los últimos 7 días: muestra en qué horario falla cada ' + (sedeFija ? 'sección' : 'sede') + '.' : 'Cumplimiento de cada día en las últimas 2 semanas.'} Las peores salen primero. Tocá una celda para ver la planilla.</p></div>
      <div className="fila" style=${{ flexWrap:'nowrap', flexShrink: 0 }}>
        <button className=${'btn chico' + (modo === 'horario' ? ' pri' : '')} onClick=${() => setModo('horario')}>Por horario</button>
        <button className=${'btn chico' + (modo === 'dia' ? ' pri' : '')} onClick=${() => setModo('dia')}>Por día</button>
      </div>
    </div>
    ${!dias.length || !filas.length ? html`<p className="muted chico">Todavía no hay registros para armar el mapa.</p>` : html`<div className="limitada" style=${{ overflowX:'auto' }}><table className="mapa">
      <thead><tr><th className="fila-tit">${sedeFija ? 'Sección' : 'Sede'}</th>${columnas.map(c => html`<th key=${c}>${modo === 'horario' ? c : fmtDiaCorto(c)}</th>`)}<th>Promedio</th></tr></thead>
      <tbody>${filas.map(f => html`<tr key=${f.nombre}>
        <td className="nombre" title=${f.nombre + ' · ' + f.n + ' equipos'}>${f.nombre}</td>
        ${f.celdas.map((c, i) => html`<td key=${columnas[i]}><button className=${'celda-mapa ' + claseCumpl(c.pct)} disabled=${c.pct === null}
            title=${f.nombre + ' · ' + (modo === 'horario' ? 'horario ' + columnas[i] + ', últimos 7 días' : fmtDiaCorto(columnas[i])) + ': ' + (c.pct === null ? 'todavía no toca' : c.hechos + ' de ' + c.esperados + ' registros')}
            onClick=${() => onCelda({ grupo: f.nombre, dia: modo === 'dia' ? columnas[i] : hoy })}>${c.pct === null ? '—' : c.pct + '%'}</button></td>`)}
        <td><span className=${'celda-mapa prom ' + claseCumpl(f.prom)} style=${{ cursor:'default' }}>${f.prom === null ? '—' : f.prom + '%'}</span></td>
      </tr>`)}</tbody>
    </table></div>`}
  </div>`;
}

/**
 * RANKING de equipos con más alertas: pensado para MANTENIMIENTO.
 * Un equipo que se sale de rango muchas veces probablemente tiene una falla
 * (compresor, empaque, puerta) y conviene revisarlo antes de perder producto.
 *
 * Por equipo muestra: número de alertas en el periodo, cuántas se regularon
 * solas en 15 minutos y cuántas necesitaron solicitar revisión, y la fecha
 * de la última. La pregunta "¿se reguló?" se ubica sola: es la pregunta
 * Sí/No que aparece cuando la temperatura queda en alerta.
 *
 * Props: equipos, resps (alcance del tablero), form, revisiones (casos; un ● en el
 *        número indica que el equipo tiene un caso abierto), onEquipo(código) → tendencia.
 */
function RankingAlertas({ equipos, resps, form, revisiones, onEquipo }){
  const [dias, setDias] = useState(30);
  const preguntas = form.publicado.preguntas;
  const qRegulo = preguntaRegulo(preguntas);
  const desde = diaKey(Date.now() - (dias - 1) * 864e5);
  const enAlcance = new Set(equipos.map(a => a.codigo));
  const porEquipo = {};
  resps.forEach(r => {
    if (!r.alertas.length || !r.activo || !enAlcance.has(r.activo) || diaKey(r.fecha) < desde) return;
    const e = porEquipo[r.activo] = porEquipo[r.activo] || { codigo: r.activo, n: 0, solas: 0, revision: 0, ultima: '' };
    e.n++;
    if (qRegulo && r.valores[qRegulo.id] === 'Sí') e.solas++;
    if (qRegulo && r.valores[qRegulo.id] === 'No') e.revision++;
    if (r.fecha > e.ultima) e.ultima = r.fecha;
  });
  const lista = Object.values(porEquipo).sort((a, b) => b.n - a.n || b.revision - a.revision || b.ultima.localeCompare(a.ultima)).slice(0, 10);
  const max = lista.length ? lista[0].n : 1;
  const equipoDe = c => equipos.find(a => a.codigo === c);
  // Va dentro de una fila .par (altura fija): la lista se desplaza por dentro (.desplaza).
  return html`<div className="panel">
    <div className="panel-tit">
      <div><h3>Equipos con más alertas</h3><p className="muted chico">Para mantenimiento: los que más se salen de rango probablemente tienen una falla. Tocá uno para ver su tendencia.</p></div>
      <select value=${dias} onChange=${e => setDias(+e.target.value)} style=${{ width:'auto', minWidth: 96, padding:'5px 8px', flexShrink: 0 }} aria-label="Periodo"><option value="7">7 días</option><option value="30">30 días</option></select>
    </div>
    ${lista.length === 0 ? html`<p className="rango-ok">Ningún equipo tuvo alertas en el periodo.</p>` : html`<div className="desplaza"><div className="pila" style=${{ gap: 5 }}>${lista.map((e, i) => { const a = equipoDe(e.codigo); return html`<div key=${e.codigo} className="rank" role="button" tabIndex="0"
        title=${e.codigo + (a ? ' · ' + a.sede + ' · ' + a.seccion + ' · ' + tipoCompleto(a).toLowerCase() : '') + '\n' + e.n + ' alertas · ' + (qRegulo ? e.solas + ' se regularon solas · ' + e.revision + ' necesitaron revisión · ' : '') + 'última ' + fmtFecha(e.ultima)}
        onClick=${() => onEquipo(e.codigo)} onKeyDown=${ev => { if (ev.key === 'Enter') onEquipo(e.codigo); }}>
      <span className="pos">${i + 1}</span>
      <span style=${{ minWidth: 0 }}><b className="codigo">${e.codigo}</b><small>${a ? a.seccion + ' · ' + tipoCompleto(a).toLowerCase() : ''}</small></span>
      <span className="barra"><i style=${{ width: (100 * e.n / max) + '%', background:'var(--b-mal)' }}></i></span>
      <span className="extra chico muted" style=${{ whiteSpace:'nowrap' }}>${qRegulo ? e.revision + ' con revisión' : ''}</span>
      <span className="tag alerta" title=${(revisiones || []).some(v => v.equipo === e.codigo && !v.cerrada) ? 'Tiene una revisión abierta' : ''}>${(revisiones || []).some(v => v.equipo === e.codigo && !v.cerrada) ? '● ' : ''}${e.n}</span>
    </div>`; })}</div></div>`}
  </div>`;
}

/**
 * Tablero del día (administrador y maestro) para un formulario que se abre por QR.
 *
 * Orden de la pantalla (de lo más urgente a lo más analítico):
 *   1. Tarjetas: % de equipos con registro, registros vs meta, alertas 7 días, pendientes.
 *   2. Cumplimiento por horario: embudo Sede → Sección → Equipo (CumplimientoHorario).
 *   3. Cumplimiento diario en % (7, 14 o 30 días), a todo lo ancho.
 *   4. Mapa de calor: sedes (o secciones) × horarios o días. Patrones de quién falla y cuándo.
 *   5. Tendencia por equipo | Alertas recientes, lado a lado y de la misma altura.
 *      Cada uno tiene sus propios filtros en cascada.
 *   6. Ranking de equipos con más alertas (mantenimiento) | Equipos sin ningún
 *      registro hoy (agrupados por sede), lado a lado y de la misma altura.
 *
 * Regla de diseño: ninguna lista crece sin límite hacia abajo. Las listas
 * largas (embudo, mapa, alertas, ranking, pendientes) se desplazan dentro
 * de su panel, así el tablero mide lo mismo con 3 sedes que con 35.
 *
 * El filtro de sede de la cabecera limita TODO el tablero. Si se elige una
 * sede, los filtros de sede de cada panel desaparecen (ya está fija).
 */
function Tablero({ db, ir }){
  const formsEq = db.formularios.filter(f => f.publicado && f.vinculo === 'equipo');
  const [formId, setFormId] = useState(formsEq[0] ? formsEq[0].id : '');
  const [sede, setSede] = useState('');
  const [equipoSel, setEquipoSel] = useState('');
  // Filtros propios del panel de alertas.
  const [aSede, setASede] = useState('');
  const [aSeccion, setASeccion] = useState('');
  const [aPeriodo, setAPeriodo] = useState('7');   // '1' = hoy, '7' = últimos 7 días
  const [dRango, setDRango] = useState(window.innerWidth < 700 ? 7 : 14);   // días del cumplimiento diario (7, 14 o 30); en celular arranca en 7

  const form = db.formularios.find(f => f.id === formId);
  const hoy = diaKey(new Date());

  // ---- Alcance del tablero: formulario elegido + sede de la cabecera ----
  const resps = db.respuestas.filter(r => r.formId === formId && (!sede || r.sede === sede));
  const equipos = db.activos.filter(a => a.estado === 'activo' && (!sede || a.sede === sede) && (!form || !form.tipoEquipo || form.tipoEquipo === a.tipo));
  const hoyR = resps.filter(r => diaKey(r.fecha) === hoy);
  const conHoy = new Set(hoyR.map(r => r.activo));
  const cumplimiento = equipos.length ? Math.round(100 * equipos.filter(a => conHoy.has(a.codigo)).length / equipos.length) : 0;
  const hace7 = Date.now() - 7 * 864e5;
  const alertas7 = resps.filter(r => r.alertas.length && new Date(r.fecha).getTime() >= hace7).sort((a, b) => b.fecha.localeCompare(a.fecha));
  const horariosT = (form && form.horarios && form.horarios.length ? form.horarios : []).slice().sort();
  const qTemp = form && preguntaTemperatura(form.publicado.preguntas);
  const qAccion = form && preguntaAccion(form.publicado.preguntas);   // "¿Qué hiciste?" ante una alerta

  // ---- Cumplimiento diario (ver CumplimientoDiario para la fórmula) ----
  const primerDia = resps.reduce((m, r) => { const k = diaKey(r.fecha); return !m || k < m ? k : m; }, '');
  const ahoraMin = new Date().getHours() * 60 + new Date().getMinutes();
  const dias = [];
  for (let i = dRango - 1; i >= 0; i--){
    const k = diaKey(Date.now() - i * 864e5);
    const del = resps.filter(r => diaKey(r.fecha) === k);
    const horariosDia = k === hoy ? horariosT.filter(h => minutos(h) <= ahoraMin) : horariosT;
    const pares = new Set(del.filter(r => r.activo && horariosDia.includes(r.turno)).map(r => r.activo + '|' + r.turno));
    dias.push({ dia: k, esperados: equipos.length * horariosDia.length, hechos: pares.size, alertas: del.filter(r => r.alertas.length).length, sinDatos: !primerDia || k < primerDia });
  }
  const hoyDato = dias[dias.length - 1];   // hoy: esperados solo de los horarios que ya empezaron
  const conDatos = dias.filter(d => !d.sinDatos && d.esperados);
  const promedio = conDatos.length ? Math.round(100 * conDatos.reduce((t, d) => t + Math.min(d.hechos, d.esperados), 0) / conDatos.reduce((t, d) => t + d.esperados, 0)) : null;

  // ---- Alertas: filtros propios (sede, sección, periodo) ----
  const desdeAlertas = aPeriodo === '1' ? hoy : diaKey(hace7);
  const alertasF = resps.filter(r => r.alertas.length && diaKey(r.fecha) >= desdeAlertas && (!aSede || r.sede === aSede) && (!aSeccion || r.seccion === aSeccion)).sort((x, y) => y.fecha.localeCompare(x.fecha));
  const aSedesOpc = Array.from(new Set(equipos.map(a => a.sede))).sort();
  const aSeccionesOpc = Array.from(new Set(equipos.filter(a => !aSede || a.sede === aSede).map(a => a.seccion))).sort();

  // ---- Tendencia: equipo elegido; si no, el de la alerta más reciente; si no, el primero ----
  const eqSel = equipos.find(a => a.codigo === equipoSel) || equipos.find(a => alertas7[0] && a.codigo === alertas7[0].activo) || equipos[0];
  /* Filtros en cascada de la tendencia (Sede → Sección → Equipo). No guardan estado
     propio: se derivan del equipo elegido. Cambiar la sede o la sección elige el
     primer equipo que cumpla, así los tres desplegables nunca quedan incoherentes. */
  const tSedes = Array.from(new Set(equipos.map(a => a.sede))).sort();
  const tSecciones = eqSel ? Array.from(new Set(equipos.filter(a => a.sede === eqSel.sede).map(a => a.seccion))).sort() : [];
  const tEquipos = eqSel ? equipos.filter(a => a.sede === eqSel.sede && a.seccion === eqSel.seccion).sort((x, y) => x.codigo.localeCompare(y.codigo)) : [];
  const elegirPrimero = filtro => { const a = equipos.filter(filtro).sort((x, y) => x.codigo.localeCompare(y.codigo))[0]; if (a) setEquipoSel(a.codigo); };
  const puntos = eqSel && qTemp ? resps.filter(r => r.activo === eqSel.codigo && !vacio(r.valores[qTemp.id])).sort((a, b) => a.fecha.localeCompare(b.fecha)).map(r => ({ f: r.fecha, v: parseFloat(r.valores[qTemp.id]), alerta: r.alertas.includes(qTemp.id) })) : [];
  const rango = eqSel && qTemp ? rangoDe(qTemp, conArea(db, eqSel)) : null;
  // Mostrar un equipo en la tendencia y llevar la vista hasta la gráfica.
  const verEquipo = codigo => { setEquipoSel(codigo); const t = document.getElementById('tendencia'); if (t) t.scrollIntoView({ behavior:'smooth', block:'center' }); };

  // ---- Equipos sin ningún registro hoy, agrupados por sede y luego por sección ----
  const sinRegistro = equipos.filter(a => !conHoy.has(a.codigo));
  const sinPorSede = {};
  sinRegistro.forEach(a => { const g = sinPorSede[a.sede] = sinPorSede[a.sede] || {}; (g[a.seccion] = g[a.seccion] || []).push(a); });
  const gruposSin = Object.entries(sinPorSede).sort((x, y) => Object.values(y[1]).flat().length - Object.values(x[1]).flat().length);

  if (!formsEq.length) return html`<div className="page"><div className="cabeza"><h1>Tablero</h1></div><div className="panel vacio">Publicá un formulario que se abra desde el QR de los equipos para ver su tablero.</div></div>`;
  return html`<div className="page">
    <div className="cabeza">
      <div><h1>Tablero de hoy</h1><p>Cumplimiento y alertas del formulario que se llena desde los QR de los equipos.</p></div>
      <div className="fila">
        <select value=${formId} onChange=${e => setFormId(e.target.value)} style=${{ width:'auto' }}>${formsEq.map(f => html`<option key=${f.id} value=${f.id}>${f.nombre}</option>`)}</select>
        <select value=${sede} onChange=${e => { setSede(e.target.value); setASede(''); setASeccion(''); }} style=${{ width:'auto' }}><option value="">Todas las sedes</option>${db.sedes.map(s => html`<option key=${s.id} value=${s.nombre}>${s.nombre}</option>`)}</select>
      </div>
    </div>

    <!-- 1. Tarjetas -->
    <div className="kpis">
      <div className="kpi destacado"><div className="n">${cumplimiento}%</div><div className="l">equipos con registro hoy</div><div className="l">${conHoy.size} de ${equipos.length}</div></div>
      <div className="kpi"><div className="n">${hoyDato.hechos}<span style=${{ fontSize: 18, color:'var(--muted)' }}> / ${hoyDato.esperados}</span></div><div className="l">registros esperados hasta ahora</div><div className="l">meta del día: ${equipos.length * horariosT.length}</div></div>
      <div className=${'kpi' + (alertas7.length ? ' rojo' : '')}><div className="n">${alertas7.length}</div><div className="l">alertas en los últimos 7 días</div></div>
      <div className="kpi"><div className="n">${sinRegistro.length}</div><div className="l">equipos sin ningún registro hoy</div></div>
    </div>

    <!-- 2. Embudo por horario -->
    ${horariosT.length > 0 && html`<${CumplimientoHorario} key=${'embudo|' + formId + '|' + sede} db=${db} form=${form} equipos=${equipos} registrosHoy=${hoyR} horarios=${horariosT} sedeFija=${sede} ir=${ir} onEquipo=${verEquipo} />`}

    <!-- 3. Cumplimiento diario -->
    <div className="panel" style=${{ marginBottom: 14 }}>
      <div className="panel-tit">
        <div><h3>Cumplimiento diario</h3><p className="muted chico">De los registros que tocaban cada día (equipos × horarios), cuántos se hicieron. Tocá un día para ver su planilla.</p></div>
        <div className="fila">
          ${promedio !== null && html`<span className=${'tag ' + (promedio >= 95 ? 'verde' : promedio >= 80 ? 'aviso' : 'alerta')}>Promedio ${promedio}%</span>`}
          <select value=${dRango} onChange=${e => setDRango(+e.target.value)} style=${{ width:'auto', minWidth: 96, padding:'5px 8px' }} aria-label="Días a mostrar"><option value="7">7 días</option><option value="14">14 días</option><option value="30">30 días</option></select>
        </div>
      </div>
      <${CumplimientoDiario} datos=${dias} onDia=${k => ir('resultados', { formId, vista:'planilla', sede, dia: k })} />
      <div className="fila chico" style=${{ marginTop: 6 }}><span className="tag verde">95 % o más</span><span className="tag aviso">80 a 94 %</span><span className="tag alerta">Menos de 80 %</span><span className="muted">Gris: sin datos · línea punteada: 100 %</span></div>
    </div>

    <!-- 4. Mapa de calor -->
    ${horariosT.length > 0 && html`<${MapaCalor} key=${'mapa|' + formId + '|' + sede} equipos=${equipos} resps=${resps} horarios=${horariosT} primerDia=${primerDia} sedeFija=${sede}
      onCelda=${({ grupo, dia }) => ir('resultados', { formId, vista:'planilla', sede: sede || grupo, seccion: sede ? grupo : '', dia })} />`}

    <!-- 5. Tendencia | Alertas -->
    <div className="par">
      <div className="panel" id="tendencia">
        <div className="panel-tit"><h3>Tendencia por equipo</h3></div>
        ${eqSel && html`<div className="fila" style=${{ marginBottom: 8, alignItems:'flex-end' }}>
          ${!sede && html`<label className="campo" style=${{ flex:'1 1 150px' }}><span>Sede</span><select value=${eqSel.sede} onChange=${e => elegirPrimero(a => a.sede === e.target.value)}>${tSedes.map(x => html`<option key=${x} value=${x}>${x}</option>`)}</select></label>`}
          <label className="campo" style=${{ flex:'1 1 150px' }}><span>Sección</span><select value=${eqSel.seccion} onChange=${e => elegirPrimero(a => a.sede === eqSel.sede && a.seccion === e.target.value)}>${tSecciones.map(x => html`<option key=${x} value=${x}>${x}</option>`)}</select></label>
          <label className="campo" style=${{ flex:'1 1 150px' }}><span>Equipo</span><select value=${eqSel.codigo} onChange=${e => setEquipoSel(e.target.value)}>${tEquipos.map(a => html`<option key=${a.codigo} value=${a.codigo}>${a.codigo.split('-').slice(2).join('-')} · ${tipoCompleto(a).toLowerCase()}</option>`)}</select></label>
        </div>`}
        ${eqSel && html`<p className="muted chico"><b className="codigo">${eqSel.codigo}</b> · últimos días de registros${rango ? ' · franja verde: ' + fmtRango(rango) : ''}</p>`}
        <div className="relleno"><${LineaTemp} puntos=${puntos} rango=${rango} /></div>
      </div>

      <div className="panel">
        <div className="panel-tit">
          <h3>Alertas <span className="tag alerta" style=${{ marginLeft: 4 }}>${alertasF.length}</span></h3>
          <button className="btn chico" onClick=${() => ir('resultados', { formId, vista:'lista', soloAlertas: true, sede: aSede || sede, seccion: aSeccion, desde: desdeAlertas })}>Ver en resultados</button>
        </div>
        <div className="fila" style=${{ marginBottom: 10, alignItems:'flex-end' }}>
          ${!sede && html`<label className="campo" style=${{ flex:'1 1 120px' }}><span>Sede</span><select value=${aSede} onChange=${e => { setASede(e.target.value); setASeccion(''); }}><option value="">Todas</option>${aSedesOpc.map(x => html`<option key=${x} value=${x}>${x}</option>`)}</select></label>`}
          <label className="campo" style=${{ flex:'1 1 120px' }}><span>Sección</span><select value=${aSeccion} onChange=${e => setASeccion(e.target.value)}><option value="">Todas</option>${aSeccionesOpc.map(x => html`<option key=${x} value=${x}>${x}</option>`)}</select></label>
          <label className="campo" style=${{ flex:'0 1 120px' }}><span>Periodo</span><select value=${aPeriodo} onChange=${e => setAPeriodo(e.target.value)}><option value="1">Hoy</option><option value="7">7 días</option></select></label>
        </div>
        <div className="desplaza">
          ${alertasF.length === 0 ? html`<p className="rango-ok">Sin alertas con estos filtros.</p>` :
            html`<div className="pila" style=${{ gap: 6 }}>${alertasF.map(r => html`<button key=${r.id} className=${'alerta-fila' + (eqSel && eqSel.codigo === r.activo ? ' on' : '')} title=${r.activo + ' · ' + r.sede + ' · ' + r.seccion + '\n' + fmtFecha(r.fecha) + (r.turno ? ' · horario ' + r.turno : '') + '\nAcción: ' + (valorDe(r, qAccion) || 'sin acción registrada') + '\nClic: ver su tendencia'} onClick=${() => verEquipo(r.activo)}>
              <span><b className="codigo">${r.activo}</b><small>${r.sede} · ${r.seccion}</small><small>${fmtFecha(r.fecha).slice(0, 5)} ${fmtFecha(r.fecha).slice(11)}${r.turno ? ' · horario ' + r.turno : ''} · ${valorDe(r, qAccion) || 'sin acción registrada'}</small></span>
              <span className="tag alerta">${qTemp && r.valores[qTemp.id] ? r.valores[qTemp.id] + ' °C' : 'Alerta'}</span>
            </button>`)}</div>`}
        </div>
      </div>
    </div>
