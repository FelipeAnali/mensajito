<!doctype html>
<html lang="es">
<head>
<!--
  FORMATOS DIGITALES · SUPERTIENDAS CAÑAVERAL
  ===========================================
  Maqueta funcional de la plataforma para digitalizar formatos en papel
  (piloto: registro de temperatura de neveras y cuartos fríos por QR).

  Es UN SOLO ARCHIVO: estilos (CSS) en <style>, aplicación (JavaScript con
  React) en el último <script>. No necesita instalación ni compilación:
  se abre en el navegador o se publica en cualquier hosting estático
  (por ejemplo GitHub Pages).

  Librerías externas (se cargan por CDN):
    - React 18 + ReactDOM ... pantallas y estado.
    - htm ................... permite escribir las pantallas con html`...`
                              en vez de JSX, así no hace falta compilar.
    - SheetJS (XLSX) ........ genera los archivos de Excel.
    - qrcode-generator ...... dibuja los QR en SVG.

  El mapa completo del código está al inicio del <script> principal.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Formatos digitales Cañaveral</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   ESTILOS
   - Colores: todos salen de las variables de :root (marca Cañaveral:
     --ink, --forest, --lime). El modo oscuro solo redefine variables.
   - Nombres de clase en español y por pantalla: "op-" = operario,
     "q-" = pregunta en el constructor, "kpi" = tarjetas de indicadores.
   - Al final: ajustes para pantallas medianas (1180px), celulares
     (860px) e impresión de la hoja de QR (@media print).
   ===================================================================== */
:root{
  --ink:#05200B; --forest:#1C5A2A; --lime:#7DD105;
  --bg:#F1F6EA; --paper:#FFFFFF; --soft:#E5EEDB; --line:#D5E1CB;
  --text:#132419; --muted:#56685A;
  --alert:#B93E0B; --alert-bg:#FCE8DA; --ok:#1C7A3A; --ok-bg:#E1F3D6; --warn:#8A6100; --warn-bg:#FBF0CF;
  /* Rellenos de barras: bien / medio / mal (los de texto de arriba son para letras). */
  --b-bien:#6CBF0A; --b-medio:#E8B53A; --b-mal:#E0703A;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1A10; --paper:#14251A; --soft:#1B3022; --line:#284031;
    --text:#E4EFE0; --muted:#9BB09E;
    --alert:#F2895A; --alert-bg:#3B1D10; --ok:#8FDB6A; --ok-bg:#183420; --warn:#E9C25A; --warn-bg:#352B0E;
    --b-bien:#7DD105; --b-medio:#D9AE45; --b-mal:#E9805A;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1A10; --paper:#14251A; --soft:#1B3022; --line:#284031;
  --text:#E4EFE0; --muted:#9BB09E;
  --alert:#F2895A; --alert-bg:#3B1D10; --ok:#8FDB6A; --ok-bg:#183420; --warn:#E9C25A; --warn-bg:#352B0E;
  --b-bien:#7DD105; --b-medio:#D9AE45; --b-mal:#E9805A;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
#root{height:100%}
h1,h2,h3,h4{font-family:'Poppins','Nunito',system-ui,sans-serif;margin:0;line-height:1.2;letter-spacing:-0.01em}
p{margin:0}
img{max-width:100%}
button{font:inherit}
:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* Controles */
.btn{font-weight:800;border:1px solid var(--line);background:var(--paper);color:var(--text);padding:8px 14px;border-radius:9px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--forest)}
.btn.pri{background:var(--forest);border-color:var(--forest);color:#fff}
.btn.pri:hover{background:#174c23}
.btn.lima{background:var(--lime);border-color:var(--lime);color:var(--ink)}
.btn.peligro{color:var(--alert)}
.btn.chico{padding:4px 10px;font-size:13px;border-radius:7px}
.btn.plano{border-color:transparent;background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;color:var(--text);background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--forest);box-shadow:0 0 0 3px rgba(125,209,5,.28)}
textarea{min-height:84px;resize:vertical}
.campo{display:flex;flex-direction:column;gap:5px;font-weight:700;font-size:13px;color:var(--muted)}
.campo > span{color:var(--muted)}
.check{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--forest)}
.fila{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pila{display:flex;flex-direction:column;gap:12px}
.muted{color:var(--muted)}
.chico{font-size:13px}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:800;background:var(--soft);color:var(--forest);white-space:nowrap}
:root .tag{color:var(--text)}
.tag.verde{background:var(--ok-bg);color:var(--ok)}
.tag.alerta{background:var(--alert-bg);color:var(--alert)}
.tag.aviso{background:var(--warn-bg);color:var(--warn)}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px}
.vacio{padding:30px 18px;text-align:center;color:var(--muted)}

/* Shell */
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);height:100%}
.side{background:var(--ink);color:#D8E8D0;display:flex;flex-direction:column;padding:22px 14px 16px;gap:3px;overflow:auto}
.marca{padding:0 10px 18px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:12px}
.marca b{display:block;font-family:'Poppins',sans-serif;font-size:17px;color:#fff;letter-spacing:-.01em}
.marca small{color:var(--lime);font-weight:800;font-size:12.5px}
.nav{all:unset;box-sizing:border-box;cursor:pointer;display:block;padding:9px 12px;border-radius:9px;font-weight:700;color:#C3D8BA}
.nav:hover{background:rgba(125,209,5,.09);color:#fff}
.nav.on{background:var(--forest);color:#fff;box-shadow:inset 3px 0 0 var(--lime)}
.nav:focus-visible{outline:3px solid var(--lime)}
.nav-grupo{font-size:12px;color:#7F9C80;font-weight:800;padding:14px 12px 4px}
.yo{margin-top:auto;padding:12px 10px 0;border-top:1px solid rgba(255,255,255,.08);font-size:13px}
.yo b{color:#fff;display:block}
.main{overflow:auto;min-width:0;height:100%}
/* Ocupa el ancho disponible; solo en pantallas muy anchas se limita y se centra. */
.page{padding:28px 34px 70px;max-width:1800px;margin:0 auto}
.cabeza{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.cabeza h1{font-size:27px;font-weight:700}
.cabeza p{margin-top:5px;color:var(--muted);max-width:66ch}
.topmovil{display:none;align-items:center;gap:12px;padding:12px 16px;background:var(--ink);color:#fff;position:sticky;top:0;z-index:30}
.velo-menu{display:none}

/* Tablas */
/* Listas que en pantalla ancha son tabla y en celular son tarjetas: se pintan las dos
   versiones y el CSS muestra una (ver @media max-width:860px). */
.solo-celular,.solo-celular-txt{display:none}
.reg-tarjeta{display:flex;flex-direction:column;gap:3px;text-align:left;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--text);font:inherit;cursor:pointer}
.reg-tarjeta.mal{border-color:var(--alert);box-shadow:inset 4px 0 0 var(--alert)}
.tabla{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--paper)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-weight:800;color:var(--muted);font-size:12.5px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--soft);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.clic{cursor:pointer}
tr.clic:hover td{background:var(--soft)}
.codigo{font-family:'Poppins',sans-serif;font-weight:600;font-size:13px;letter-spacing:.01em;white-space:nowrap}

/* Tablero */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.kpi .n{font-family:'Poppins',sans-serif;font-size:32px;font-weight:700;line-height:1.1}
.kpi .l{color:var(--muted);font-weight:700;font-size:13.5px}
.kpi.destacado{background:var(--forest);border-color:var(--forest);color:#fff}
.kpi.destacado .l{color:#CDE6C1}
.kpi.rojo .n{color:var(--alert)}
.barra{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
/* --- Tablero: cumplimiento por horario (embudo sede → sección → equipo) --- */
.horarios-sel{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.horario-btn{all:unset;box-sizing:border-box;cursor:pointer;border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--paper)}
.horario-btn:hover{border-color:var(--forest)}
.horario-btn.on{border-color:var(--forest);box-shadow:0 0 0 2px var(--lime)}
.horario-btn:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
.migas{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-weight:800;font-size:14px}
.migas button{all:unset;cursor:pointer;color:var(--forest);text-decoration:underline;text-underline-offset:3px}
.migas button:focus-visible{outline:3px solid var(--lime)}
.migas span.actual{color:var(--text)}
.cump-lista{display:flex;flex-direction:column;gap:6px}
/* REGLA DEL TABLERO: ninguna lista crece sin límite hacia abajo.
   Con 30+ sedes, toda lista larga se desplaza DENTRO de su panel. */
.limitada{max-height:340px;overflow:auto;padding-right:2px}
.cump-fila{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(80px,1fr) auto auto auto;gap:12px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:9px 12px;cursor:pointer}
.cump-fila:hover{border-color:var(--forest)}
.cump-fila:focus-visible{outline:3px solid var(--lime);outline-offset:1px}
.cump-fila .nom{font-weight:800;min-width:0;overflow-wrap:anywhere}
.cump-fila .nom small{display:block;font-weight:700;color:var(--muted);font-size:12.5px}
.cump-fila .num{font-family:'Poppins',sans-serif;font-weight:700;white-space:nowrap}
@media (max-width:860px){ .cump-fila{grid-template-columns:minmax(0,1fr) auto;row-gap:6px} .cump-fila .barra{grid-column:1/-1;order:5} }
.barra i{display:block;height:100%;background:var(--lime);border-radius:99px}
.dos{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px;margin-bottom:14px;align-items:start}
/* --- Tablero: fila de dos paneles con la MISMA altura (tendencia | alertas).
   La altura es fija en escritorio; lo que no cabe en la lista de alertas
   se desplaza dentro del panel, así ninguno de los dos queda con hueco. --- */
.par{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px;margin-bottom:14px}
.par > .panel{display:flex;flex-direction:column;min-width:0;height:480px}
.par .relleno{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center}
.par .desplaza{flex:1;min-height:0;overflow:auto;padding-right:2px}
.panel-tit{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.panel-tit h3{font-size:16px}
.alerta-fila{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--paper)}
.alerta-fila:hover{border-color:var(--forest)}
.alerta-fila.on{border-color:var(--alert);box-shadow:0 0 0 2px var(--alert-bg)}
.alerta-fila:focus-visible{outline:3px solid var(--lime)}
.alerta-fila small{color:var(--muted);font-weight:700;font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alerta-fila > span:first-child{min-width:0}
.mapa{border-collapse:separate;border-spacing:4px;width:100%;font-size:13px}
.mapa th{background:var(--paper);border:0;padding:4px 6px;text-align:center;font-size:12px;position:sticky;top:0;z-index:1}
.mapa th.fila-tit{text-align:left}
.mapa td{border:0;padding:0}
.mapa .nombre{font-weight:800;padding:6px 8px 6px 0;white-space:nowrap;width:260px;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.celda-mapa{all:unset;box-sizing:border-box;display:block;width:100%;text-align:center;padding:6px 4px;border-radius:7px;font-family:'Poppins',sans-serif;font-weight:700;cursor:pointer;min-width:44px}
.celda-mapa:focus-visible{outline:3px solid var(--lime)}
.celda-mapa.c-bien{background:var(--ok-bg);color:var(--ok)}
.celda-mapa.c-medio{background:var(--warn-bg);color:var(--warn)}
.celda-mapa.c-mal{background:var(--alert-bg);color:var(--alert)}
.celda-mapa.c-nada{background:var(--soft);color:var(--muted);cursor:default;font-weight:600}
.celda-mapa.prom{outline:1px solid var(--line)}
/* Fila compacta del ranking: todo en una línea; los textos largos se cortan con «…» (el detalle completo va en el texto emergente). */
.rank{display:grid;grid-template-columns:22px minmax(0,1fr) 70px auto auto;gap:10px;align-items:center;padding:6px 10px;border-radius:9px;border:1px solid var(--line);background:var(--paper);cursor:pointer}
.rank:hover{border-color:var(--forest)}
.rank:focus-visible{outline:3px solid var(--lime)}
.rank .pos{font-family:'Poppins',sans-serif;font-weight:800;color:var(--muted);text-align:center}
.rank small{display:block;color:var(--muted);font-weight:700;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:860px){ .rank{grid-template-columns:24px minmax(0,1fr) auto} .rank .barra,.rank .extra{display:none} }
.grupo-sede{border:1px solid var(--line);border-radius:11px;padding:8px 12px;background:var(--paper)}
.grupo-sede summary{cursor:pointer;font-weight:800;display:flex;justify-content:space-between;gap:10px}
.grupo-sede[open] summary{margin-bottom:8px}
.svg-graf{width:100%;height:auto;display:block}

/* Modal y aviso */
.velo{position:fixed;inset:0;background:rgba(5,32,11,.5);display:grid;place-items:center;padding:16px;z-index:60}
.modal{background:var(--paper);border-radius:16px;max-width:680px;width:100%;max-height:calc(100% - 32px);overflow:auto;padding:22px;box-shadow:0 20px 50px rgba(5,32,11,.25)}
.modal.ancho{max-width:980px}
.modal h2{font-size:20px;margin-bottom:6px}
.modal-pie{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
/* Aviso de conexión: franja a todo el ancho arriba; el contenido baja lo que ella mide. */
.conexion{position:fixed;left:0;right:0;top:0;background:var(--warn-bg);color:var(--warn);border-bottom:1px solid var(--warn);padding:calc(8px + env(safe-area-inset-top,0px)) 16px 8px;font-weight:800;font-size:13.5px;line-height:1.35;z-index:70;display:flex;gap:10px;align-items:center;justify-content:center;text-align:center}
.conexion.mal{background:var(--alert-bg);color:var(--alert);border-color:var(--alert)}
body.con-aviso{padding-top:var(--alto-aviso,0px)}
body.con-aviso .op-cab,body.con-aviso .topmovil{top:var(--alto-aviso,0px)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;z-index:80;max-width:min(92vw,560px);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.error{background:var(--alert)}

/* Constructor */
.constructor{display:grid;grid-template-columns:300px minmax(0,1fr) 372px;gap:16px;align-items:start}
.lista-q{display:flex;flex-direction:column;gap:6px}
.q-item{all:unset;box-sizing:border-box;cursor:pointer;background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:9px 11px;display:flex;flex-direction:column;gap:4px}
.q-item:hover{border-color:var(--forest)}
.q-item.on{border-color:var(--forest);box-shadow:0 0 0 2px var(--lime)}
.q-item.sec{background:var(--soft);border-style:dashed}
.q-item .t{font-weight:800;font-size:14px;line-height:1.3}
.q-item .m{display:flex;gap:4px;flex-wrap:wrap}
.q-item .m .tag{font-size:11px;padding:1px 7px}
.q-item.ramal{margin-left:16px;border-left:3px solid var(--lime)}
.agregar{display:flex;flex-wrap:wrap;gap:6px}
.agregar .btn{font-size:12.5px;padding:5px 9px}
.editor h3{font-size:16px;margin-bottom:12px}
.bloque{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.bloque > b{display:block;font-family:'Poppins',sans-serif;font-size:14px;margin-bottom:8px}
.regla{background:var(--soft);border-radius:11px;padding:12px}
.tel-marco{position:sticky;top:18px}
.tel{border:10px solid var(--ink);border-radius:34px;height:min(700px, calc(100vh - 140px));overflow:auto;background:var(--bg);position:relative}
.tel::before{content:"";display:block;width:90px;height:18px;background:var(--ink);border-radius:0 0 12px 12px;margin:0 auto;position:sticky;top:0;z-index:2}
.revision{border-radius:11px;padding:10px 12px;font-size:13.5px}
.revision.ok{background:var(--ok-bg);color:var(--ok);font-weight:700}
.revision.mal{background:var(--alert-bg);color:var(--alert)}
.revision ul{margin:4px 0 0;padding-left:18px}
.pestanas{display:none;gap:6px;margin-bottom:12px}

/* Formulario (llenado) */
.form-llenar{padding:16px 16px 40px;display:flex;flex-direction:column;gap:14px}
.form-cab h2{font-size:19px}
.equipo-chip{background:var(--forest);color:#fff;border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.equipo-chip .c{font-family:'Poppins',sans-serif;font-weight:700;font-size:17px;letter-spacing:.01em}
.equipo-chip .d{color:#CDE6C1;font-size:13px;font-weight:700}
.preg{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px}
.preg.error{border-color:var(--alert);box-shadow:0 0 0 2px var(--alert-bg)}
.preg.nueva{animation:entra .35s ease-out}
@keyframes entra{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.preg .et{font-weight:800;font-size:15.5px;margin-bottom:8px;display:block}
.preg .et em{color:var(--alert);font-style:normal}
.preg .ay{font-size:13px;color:var(--muted);margin:-4px 0 8px}
.preg .err{color:var(--alert);font-weight:700;font-size:13px;margin-top:6px}
.sec-tit{font-family:'Poppins',sans-serif;font-weight:700;font-size:15px;color:var(--forest);padding:6px 2px 0}
.auto{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--soft);border-radius:10px;padding:9px 12px;font-weight:800}
.auto small{font-weight:700;color:var(--muted);font-size:11.5px;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--paper);color:var(--text);border-radius:11px;padding:10px 14px;font-weight:800;cursor:pointer;min-height:44px}
.chip.on{background:var(--forest);border-color:var(--forest);color:#fff}
.sino{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sino .chip{font-size:17px}
.temp{display:grid;grid-template-columns:52px 1fr 52px;gap:8px;align-items:stretch}
.temp button{border:1.5px solid var(--line);background:var(--paper);color:var(--text);border-radius:12px;font-size:24px;font-weight:800;cursor:pointer}
.temp input{text-align:center;font-family:'Poppins',sans-serif;font-size:30px;font-weight:700;padding:8px}
.temp-u{text-align:center;color:var(--muted);font-weight:800;font-size:13px;margin-top:6px}
.alerta-caja{margin-top:10px;background:var(--alert-bg);color:var(--alert);border-radius:11px;padding:10px 12px;font-weight:700;font-size:14px}
.rango-ok{margin-top:10px;background:var(--ok-bg);color:var(--ok);border-radius:11px;padding:8px 12px;font-weight:700;font-size:13.5px}
.firma{border:1.5px dashed var(--line);border-radius:12px;background:#fff;touch-action:none;width:100%;height:150px;display:block}
.foto-prev{margin-top:8px;max-height:180px;border-radius:10px}
.enviar{min-height:52px;font-size:17px;width:100%}
/* --- Formulario del operario --- */
/* Barra inferior fija con el botón Enviar: siempre a mano con el pulgar. */
.barra-enviar{position:sticky;bottom:0;margin:4px -16px -40px;padding:18px 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom, transparent 0, var(--bg) 16px);z-index:5}
.barra-enviar p{text-align:center;font-weight:800;font-size:13px;margin-bottom:6px;color:var(--warn)}
/* Datos que se llenan solos (desde el QR): un resumen plegable dentro de la tarjeta del equipo. */
.equipo-chip details{margin-top:6px}
.equipo-chip summary{cursor:pointer;font-size:12.5px;font-weight:800;color:#CDE6C1}
.equipo-chip dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:6px 0 0;font-size:13px}
.equipo-chip dt{color:#CDE6C1;font-weight:700}
.equipo-chip dd{margin:0;font-weight:800}
.auto-lista{background:var(--soft);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13.5px}
.auto-lista dt{color:var(--muted);font-weight:700}
.auto-lista dd{margin:0;font-weight:800}
/* Campo numérico sin las flechitas del navegador (estorban en celular). */
.temp input::-webkit-outer-spin-button,.temp input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.temp input{-moz-appearance:textfield;appearance:textfield}
.temp-extra{display:flex;justify-content:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.lecturas{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:10px;font-size:12.5px;font-weight:700;color:var(--muted)}
.lectura{background:var(--soft);border-radius:999px;padding:2px 9px;color:var(--text)}
.lectura.mal{background:var(--alert-bg);color:var(--alert)}
.aviso-caja{margin-top:10px;background:var(--warn-bg);color:var(--warn);border-radius:11px;padding:10px 12px;font-weight:700;font-size:14px}
.revision-op{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--b-mal);border-radius:12px;padding:11px 14px}
.revision-op small{display:block;color:var(--muted);font-weight:700;font-size:12.5px}
.temp-extra .btn{min-height:38px}
.foto-btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;cursor:pointer}
.foto-btn input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
/* --- Inicio del operario --- */
.estado-turno{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px}
.estado-turno .grande{font-family:'Poppins',sans-serif;font-weight:700;font-size:30px;line-height:1.05}
.estado-turno .grande small{font-size:16px;color:var(--muted);font-weight:600}
.estado-turno .barra{height:10px;margin-top:12px}
.seccion-op{background:var(--paper);border:1px solid var(--line);border-radius:13px;overflow:hidden}
.seccion-op > summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 14px;font-weight:800}
.seccion-op > summary::-webkit-details-marker{display:none}
.seccion-op > summary::after{content:'▾';color:var(--muted);margin-left:4px}
.seccion-op:not([open]) > summary::after{content:'▸'}
.eq-fila{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 14px;border-top:1px solid var(--line)}
.eq-fila b{font-family:'Poppins',sans-serif;font-size:14px}
.eq-fila small{display:block;color:var(--muted);font-weight:700;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eq-fila .puntos{margin-top:0}
.eq-fila .cuenta{font-size:16px}
.plegable{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:11px 14px}
.plegable > summary{cursor:pointer;font-weight:800}
.plegable[open] > summary{margin-bottom:8px}
/* Botón de escanear fijo abajo en el inicio del operario. */
.op{display:flex;flex-direction:column}
.op-barra{position:sticky;bottom:0;margin-top:auto;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom, transparent, var(--bg) 25%);z-index:5}
.op-barra .escanear{width:100%;padding:16px 18px;flex-direction:row;justify-content:center;align-items:center;gap:10px;box-shadow:0 6px 18px rgba(5,32,11,.25)}
.op-barra .escanear b{font-size:19px}
.instructivo{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 14px}
.instructivo summary{cursor:pointer;font-weight:800}
.instructivo div{white-space:pre-wrap;font-size:13.5px;margin-top:8px;color:var(--muted);line-height:1.55}
.op.ancho{max-width:1240px}
.op-tabs{display:flex;gap:6px;margin-top:12px}
.op-tab{all:unset;box-sizing:border-box;cursor:pointer;padding:7px 16px;border-radius:999px;font-weight:800;color:#CDE6C1;background:rgba(255,255,255,.07)}
.op-tab.on{background:var(--lime);color:var(--ink)}
.op-tab:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
.celda{text-align:center;white-space:nowrap}
.puntos{display:flex;gap:4px;margin-top:6px}
.punto{width:26px;height:8px;border-radius:99px;background:var(--line)}
.punto.ok{background:var(--forest)}
.punto.mal{background:var(--alert)}
.punto.falta{background:var(--warn)}
.cuenta{font-family:'Poppins',sans-serif;font-weight:700;font-size:19px;line-height:1.1}
.cuenta small{font-size:13px;color:var(--muted);font-weight:600}
.celda-btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-block;min-width:54px;padding:4px 8px;border-radius:8px;font-family:'Poppins',sans-serif;font-weight:700}
.celda-btn.bien{background:var(--ok-bg);color:var(--ok)}
.celda-btn.mal{background:var(--alert-bg);color:var(--alert)}
.celda-btn:focus-visible{outline:3px solid var(--lime)}
/* Planilla en celular: los horarios del equipo en una fila de casillas iguales. */
.pl-horas{display:grid;grid-template-columns:repeat(auto-fit,minmax(60px,1fr));gap:6px;margin-top:6px}
.pl-hora{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.pl-hora small{font-weight:800;color:var(--muted);font-size:11.5px}
.pl-hora .celda-btn{min-width:0;width:100%;text-align:center}

/* Operario */
.op{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.op-cab{background:var(--ink);color:#fff;padding:16px 18px 18px;position:sticky;top:0;z-index:20}
.op-cab .fila{justify-content:space-between}
.op-cab b{font-family:'Poppins',sans-serif;font-size:17px}
.op-cab small{color:var(--lime);font-weight:800}
.op-cuerpo{padding:16px;display:flex;flex-direction:column;gap:16px}
.escanear{all:unset;box-sizing:border-box;cursor:pointer;background:var(--lime);color:var(--ink);border-radius:18px;padding:22px 20px;display:flex;flex-direction:column;gap:4px}
.escanear b{font-family:'Poppins',sans-serif;font-size:22px}
.escanear span{font-weight:700}
.escanear:focus-visible{outline:3px solid var(--forest)}
.lista-op{display:flex;flex-direction:column;gap:8px}
.item-op{all:unset;box-sizing:border-box;cursor:pointer;background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.item-op:hover{border-color:var(--forest)}
.item-op b{display:block}
.camara{width:100%;border-radius:14px;background:#000;aspect-ratio:3/4;object-fit:cover}

/* Login */
.login{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);min-height:100%}
.login-izq{background:var(--forest);color:#fff;padding:48px 44px;display:flex;flex-direction:column;justify-content:space-between;gap:30px;position:relative;overflow:hidden}
.login-izq h1{font-size:clamp(34px,4.6vw,58px);font-weight:800;line-height:1.02;letter-spacing:-.03em;max-width:12ch}
.login-izq p{color:#D7EBCB;max-width:44ch;font-size:16px;margin-top:16px}
.login-izq .sello{font-weight:800;color:var(--lime)}
.cana{position:absolute;right:-30px;bottom:-20px;width:240px;opacity:.16}
.login-der{padding:44px;display:flex;flex-direction:column;gap:22px;justify-content:center;max-width:640px}
.rol{display:flex;flex-direction:column;gap:8px}
.rol h3{font-size:16px}
.rol p{color:var(--muted);font-size:14px}
.usuario-btn{all:unset;box-sizing:border-box;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.usuario-btn:hover{border-color:var(--forest)}
.usuario-btn:focus-visible{outline:3px solid var(--lime)}

/* QR */
.qr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.qr-ficha{border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;background:#fff;color:#05200B;break-inside:avoid}
.qr-ficha svg{width:100%;height:auto;display:block}
.qr-ficha b{font-family:'Poppins',sans-serif;font-size:13px;display:block}
.qr-ficha small{font-size:11px;color:#41564a;display:block;line-height:1.3}

@media (max-width:1180px){
  .constructor{grid-template-columns:260px minmax(0,1fr)}
  .tel-marco{display:none}
  .tel-marco.visible{display:block;grid-column:1/-1}
  .pestanas{display:flex}
}
@media (max-width:860px){
  .solo-ancho{display:none !important}
  .solo-celular{display:flex}
  .solo-celular-txt{display:inline}
  /* Tablas "apilar": en celular cada fila es una tarjeta (sin encabezados); la primera
     celda va arriba a lo ancho y la última (botones) abajo. Nada queda cortado. */
  .tabla.apilar{border:0;background:none;overflow:visible}
  .apilar table,.apilar tbody{display:block}
  .apilar thead{display:none}
  .apilar tr{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;padding:12px 14px;margin-bottom:8px;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
  .apilar td{display:block;padding:0;border:0}
  .apilar td:first-child,.apilar td:last-child{flex-basis:100%}
  .apilar td:empty{display:none}
  .shell{grid-template-columns:1fr}
  .side{position:fixed;top:0;bottom:0;left:0;width:260px;z-index:50;transform:translateX(-105%);transition:transform .2s ease-out;padding-top:calc(22px + env(safe-area-inset-top,0px))}
  .side.abierta{transform:none}
  .velo-menu.si{display:block;position:fixed;inset:0;background:rgba(5,32,11,.45);z-index:45}
  .topmovil{display:flex}
  .page{padding:18px 16px 70px}
  .constructor{grid-template-columns:1fr}
  .dos,.par,.grid2,.grid3{grid-template-columns:1fr}
  .par > .panel{height:auto}
  .par .desplaza{max-height:420px}
  .kpis{grid-template-columns:1fr 1fr;gap:8px}
  .kpi{padding:12px 14px}
  .kpi .n{font-size:26px}
  .cabeza > .fila, .cabeza > .fila > select{width:100% !important}
  .cump-fila .tag{justify-self:start}
  .mapa .nombre{width:120px;max-width:120px}
  .panel-tit{flex-wrap:wrap}
  .login{grid-template-columns:1fr}
  .login-izq{padding:32px 24px}
  .login-der{padding:24px}
}
@media print{
  body *{visibility:hidden}
  .imprimible, .imprimible *{visibility:visible}
  .imprimible{position:absolute;left:0;top:0;width:100%}
  .no-print{display:none!important}
  .velo{position:static;background:none;padding:0}
  .modal{box-shadow:none;max-height:none;overflow:visible}
}

<body>
<div id="root"><p style="padding:24px">Cargando…</p></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
(function(){
'use strict';
/* =====================================================================
   MAPA DEL CÓDIGO
   =====================================================================
   El código va en este orden (buscá el título en mayúsculas):

     0. MODO DEMOSTRACIÓN ........ interruptor de todo lo que es solo de muestra.
     1. CAPA DE DATOS ............ dónde se guarda todo: local o servidor
                                   (sesión, cola sin señal), migraciones,
                                   operaciones y permisos.
     2. CATÁLOGOS FIJOS .......... tipos de equipo, rangos, horarios, textos.
     3. UTILIDADES ............... fechas, formatos, horarios, áreas.
     4. LÓGICA DE FORMULARIOS .... autollenado, ramificación, alertas.
     5. PLANTILLAS ............... formularios de ejemplo y "pegar formato".
     6. DATOS DE DEMOSTRACIÓN .... códigos de equipo y registros de prueba.
     7. COMPONENTES BÁSICOS ...... ventana modal, QR, gráficas, firma.
     8. FORMULARIO PARA LLENAR ... lo que ve el operario al escanear.
     9. LOGIN / OPERARIO ......... pantallas del rol operario.
    10. ADMINISTRADOR ............ tablero, formularios, constructor, resultados.
    11. EQUIPOS Y QR ............. códigos, traslados, hoja de QR.
    12. MAESTRO .................. usuarios, sedes y secciones, auditoría, sistema.
    13. APLICACIÓN ............... estado global y navegación entre pantallas.

   ROLES
     - maestro ... todo lo del administrador + configuración del sistema.
     - admin ..... formularios, tablero, resultados, Excel, ver/imprimir QR.
     - operario .. escanea el QR, llena, ve resultados SOLO de su área.

   CÓMO FLUYEN LOS DATOS
     Todo el estado vive en un único objeto "db" dentro de <App>.
     Ninguna pantalla modifica "db" directamente: llaman a
         commit(d => { ...cambios sobre d... }, 'texto para auditoría')
     commit copia db, aplica el cambio, calcula las OPERACIONES (qué registro
     se creó, cambió o borró), revisa los PERMISOS de cada una, y solo si
     todas son válidas muestra el cambio y lo guarda con el Adaptador.
     Si se pasó un texto, deja un renglón en la auditoría.

   MODELO DE DATOS (forma del objeto db)
     esquema       número de versión de la estructura. Si cambia, al abrir
                   se cargan datos de demostración nuevos (ver <App>).
     config        { qrBase, apiUrl, codigoManual, simulador }
     sedes[]       { id, nombre, codigo ('SC14'), horaCierre ('' = 20:00) }
     secciones[]   { id, nombre, codigo ('CBP'), area ('CARNES') }
                   El ÁREA agrupa secciones: el operario se asigna por área.
     usuarios[]    { id, nombre, rol, sede, areas[], estado, cargo }
                   areas vacío = todas las áreas de su sede.
     activos[]     Equipos: { codigo, sede, seccion, tipo, subtipo, estado,
                   historial[{ fecha, de, a }] }. El código NO cambia nunca,
                   aunque el equipo se traslade (por eso el QR no se daña).
     formularios[] { id, nombre, descripcion, instructivo,
                     vinculo ('equipo' = se abre por QR | 'libre'),
                     tipoEquipo ('' | 'NEVERA' | 'CUARTO FRIO'),
                     horarios ['08:00',...], vecesDia,
                     preguntas[]  ← borrador que edita el administrador,
                     publicado { version, preguntas[], fecha } ← lo que ve
                                el operario; null si nunca se publicó,
                     cambiosSinPublicar, archivado, creado, actualizado }
     respuestas[]  { id, formId, version, usuarioId, usuario, fecha (ISO),
                     turno ('08:00'...), activo (código), sede, seccion,
                     valores { idPregunta: respuesta },
                     alertas [idPregunta fuera de rango] }
     revisiones[]  Casos de mantenimiento: se abre uno cuando una temperatura quedó
                   en alerta y NO se reguló en 15 minutos (se pidió revisión).
                   { id, equipo, sede, seccion, formId, respuestaId, abierta (ISO),
                     solicitud (a quién se pidió), veces, ultima (ISO),
                     cerrada (ISO | null), cerradaPor, nota }
                   Un equipo tiene como máximo UN caso abierto: si vuelve a fallar
                   antes de cerrarse, se suma a "veces" en vez de abrir otro.
                   Los registros (respuestas) nunca se modifican al cerrar un caso.
     auditoria[]   { id, fecha, usuario, accion } (máximo 500, la más nueva primero)

   UNA PREGUNTA (dentro de formulario.preguntas)
     { id, tipo (ver TIPOS_PREGUNTA), etiqueta, ayuda, requerida, opciones[],
       autollenado (ver AUTOS; '' = la responde la persona), bloqueada,
       redondear (aproximar al entero),
       condicion { qid, op, valor } | null   ← cuándo se muestra.
                 qid puede ser otra pregunta o '@activo.subtipo', etc.
       alerta { modo: 'ninguna' | 'rango' | 'subtipo' | 'opcion',
                min, max                ← modo 'rango'
                rangos, excepciones     ← modo 'subtipo'
                ref, porOpcion          ← modo 'opcion' } }

   CONVENCIONES
     - Rangos: [mínimo, máximo]. '' en un lado = sin límite de ese lado.
     - Fechas de día: texto 'AAAA-MM-DD' (ver diaKey) para comparar fácil.
     - Nombres en español; componentes de pantalla con Mayúscula inicial.
   ===================================================================== */
const { useState, useEffect, useLayoutEffect, useMemo, useRef, useCallback } = React;
const html = htm.bind(React.createElement);

/* =====================================================================
   MODO DEMOSTRACIÓN
   ---------------------------------------------------------------------
   TODO lo que existe solo para mostrar la maqueta depende de esta
   constante. Para producción se pone en false y desaparecen:
     - la carga de datos de ejemplo cuando no hay datos (sembrar),
     - el botón "Volver a datos de demostración" (Sistema),
     - el simulador de escaneo (botones de códigos en el escáner),
     - el aviso "Versión de demostración" en la entrada.
   La entrada eligiendo usuario sin contraseña se reemplaza cuando el
   adaptador de servidor implemente iniciarSesion (ver AdaptadorServidor).
   ===================================================================== */
const MODO_DEMO = true;

/* =====================================================================
   CAPA DE DATOS
   ---------------------------------------------------------------------
   Toda la app lee y escribe SOLO a través de "Adaptador". Interfaz:

     cargar()                  → Promise<db | null>   datos al abrir.
     guardar(db, operaciones)  → Promise<boolean>     guarda un cambio.
         operaciones = [{ coleccion, tipo:'crear'|'actualizar'|'borrar', id, dato }]
         (las arma commit comparando antes/después; ver calcularOperaciones).
         El adaptador local ignora las operaciones y guarda todo; el de
         servidor envía SOLO las operaciones, así dos personas que guardan
         a la vez no se pisan.
     ahora()                   → Date                 hora oficial del registro.
         Local: la del dispositivo. Servidor: debe ser la del servidor
         (y el servidor la reescribe al recibir el registro).
     subirArchivo(dataURL)     → Promise<string>      fotos y firmas.
         Local: devuelve el mismo dataURL. Servidor: sube el archivo y
         devuelve su dirección; en los datos solo queda la dirección.
     alCambiarEstado(fn)       → función para dejar de escuchar.
         Avisa { enLinea, pendientes, enviando, sesionVencida, rechazo }.
     Solo servidor: requiereSesion, tieneSesion(), iniciarSesion(usuario, clave),
         cerrarSesion(), probar().

   IMPORTANTE para el servidor: las reglas de PERMISOS (más abajo) deben
   correr también allá. Las de esta página son para la experiencia del
   usuario; las del servidor son las que protegen de verdad.
   ===================================================================== */
/* ---------------------------------------------------------------------
   DIRECCIÓN DEL SERVIDOR (el "espacio" para la conexión)
   - URL_SERVIDOR_FIJA: para la instalación definitiva; se escribe aquí al
     publicar la app y nadie la puede cambiar desde la pantalla.
   - Si está vacía, se usa la dirección que el maestro guarde en
     Sistema → Conexión (queda en este navegador; sirve para pruebas).
   - Si no hay ninguna: modo local (todo en este navegador, como la maqueta).
   --------------------------------------------------------------------- */
const URL_SERVIDOR_FIJA = '';
const CLAVE_URL = 'cnv_servidor';
function urlServidor(){
  if (URL_SERVIDOR_FIJA) return URL_SERVIDOR_FIJA;
  try{ return localStorage.getItem(CLAVE_URL) || ''; }catch(e){ return ''; }
}
/* Lectura y escritura seguras en el almacenamiento del navegador (puede estar bloqueado). */
const leerLocal = (k, porDefecto) => { try{ const t = localStorage.getItem(k); return t === null ? porDefecto : JSON.parse(t); }catch(e){ return porDefecto; } };
const escribirLocal = (k, v) => { try{ if (v === null || v === undefined) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } };

/** Clave de localStorage donde se guarda todo el objeto db (modo local). */
const CLAVE = 'cnv_formatos_v1';
/* ---------- Adaptador LOCAL: todo en este navegador (la maqueta) ---------- */
const AdaptadorLocal = {
  nombre: 'Este navegador (modo local)',
  tipo: 'local',
  requiereSesion: false,
  async cargar(){ try{ const t = localStorage.getItem(CLAVE); return t ? JSON.parse(t) : null; }catch(e){ return null; } },
  async guardar(db, operaciones){ void operaciones; try{ localStorage.setItem(CLAVE, JSON.stringify(db)); return true; }catch(e){ return false; } },
  ahora(){ return new Date(); },
  async subirArchivo(dataURL){ return dataURL; },
  alCambiarEstado(fn){ fn({ enLinea: true, pendientes: 0, enviando: false }); return () => {}; }
};

/* ---------- Adaptador SERVIDOR: habla con la API del contrato ----------
   Contrato completo en CONTRATO_CONEXION.md. Resumen:
     GET    /salud        → { ok, hora }               (sin sesión) hora oficial
     POST   /sesion       { usuario, clave } → { token, usuario }
     DELETE /sesion                                   cierra la sesión
     GET    /datos        → db con el ALCANCE del usuario (no necesariamente todo)
     POST   /operaciones  { lote, operaciones } → { ok, hora }
                          lote = id único: si llega dos veces, el servidor lo
                          aplica una sola vez (reintentos sin duplicar).
                          403 { error } si alguna operación no está permitida.
     POST   /archivos     { dataURL } → { url }
   Todas (menos /salud y POST /sesion) llevan "Authorization: Bearer <token>".

   SIN SEÑAL: los cambios se guardan primero en una COLA en este celular y se
   envían en orden; si no hay conexión, se reintentan solos cada 20 s y cuando
   el celular avisa que volvió la red. Los datos de la última carga quedan en
   caché para poder seguir trabajando. Las fotos que no se puedan subir viajan
   dentro del registro (dataURL) y el servidor las convierte en archivo. */
function AdaptadorServidor(url){
  const base = String(url || '').replace(/\/+$/, '');
  const K = { token:'cnv_token', cache:'cnv_cache', cola:'cnv_cola', usuario:'cnv_usuario_servidor' };
  let token = leerLocal(K.token, null);
  /* Quién tiene la sesión. Cada lote de la cola queda marcado con su autor y solo se
     envía con la sesión de ese mismo usuario: si la sesión vence, o si en el mismo
     celular entra otra persona, lo pendiente no se pierde ni se envía a nombre de otro. */
  let usuarioId = leerLocal(K.usuario, null);
  let desfase = 0;   // milisegundos: hora del servidor − hora del dispositivo
  const leerCola = () => leerLocal(K.cola, []) || [];
  const mios = cola => cola.filter(l => l.usuarioId === usuarioId);
  let estado = { enLinea: true, pendientes: mios(leerCola()).length, enviando: false, sesionVencida: false, rechazo: '' };
  const oyentes = new Set();
  const publicar = cambios => { estado = Object.assign({}, estado, cambios); oyentes.forEach(f => f(estado)); };
  let reintento = null;

  /* Petición a la API con tiempo límite. Errores:
       e.red = true      → no hubo conexión (se reintenta)
       e.sesion = true   → sesión vencida (401)
       e.estado = número → el servidor respondió con error (no se reintenta) */
  async function pedir(ruta, opciones){
    opciones = opciones || {};
    const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    const limite = setTimeout(() => ctl && ctl.abort(), 15000);
    let r;
    try{
      r = await fetch(base + ruta, {
        method: opciones.method || 'GET',
        headers: Object.assign({ 'Content-Type':'application/json' }, token ? { Authorization: 'Bearer ' + token } : {}),
        body: opciones.body ? JSON.stringify(opciones.body) : undefined,
        signal: ctl ? ctl.signal : undefined
      });
    }catch(e){ const err = new Error('Sin conexión con el servidor.'); err.red = true; throw err; }
    finally{ clearTimeout(limite); }
    let j = null; try{ j = await r.json(); }catch(e){}
    // 401 al iniciar sesión = usuario o clave mal (no es una sesión vencida).
    if (r.status === 401 && ruta === '/sesion'){ const err = new Error((j && j.error) || 'Usuario o contraseña incorrectos.'); err.estado = 401; throw err; }
    if (r.status === 401){ token = null; escribirLocal(K.token, null); publicar({ sesionVencida: true }); const err = new Error('La sesión venció. Volvé a entrar.'); err.sesion = true; throw err; }
    if (!r.ok){ const err = new Error((j && j.error) || ('El servidor respondió ' + r.status)); err.estado = r.status; throw err; }
    return j || {};
  }

  /* Saca un lote ya resuelto de la cola guardada (se relee por si cambió mientras tanto). */
  function quitarDeCola(lote){
    const cola = leerCola().filter(l => l.lote !== lote);
    escribirLocal(K.cola, cola);
    return mios(cola).length;
  }
  /* Envía, en orden y de a un lote, los cambios pendientes del usuario con sesión.
     Se detiene en el primer error de red (reintenta solo) o si la sesión venció
     (sigue al volver a entrar). Los lotes de otros usuarios esperan a su dueño. */
  async function enviarCola(){
    if (estado.enviando || !token) return;
    if (!mios(leerCola()).length) return;
    publicar({ enviando: true });
    let lote;
    while ((lote = mios(leerCola())[0])){
      try{
        const j = await pedir('/operaciones', { method:'POST', body: { lote: lote.lote, operaciones: lote.operaciones } });
        if (j && j.hora) desfase = Date.parse(j.hora) - Date.now();
        publicar({ enLinea: true, pendientes: quitarDeCola(lote.lote) });
      }catch(e){
        if (e.red){ publicar({ enLinea: false, enviando: false }); programarReintento(); return; }
        if (e.sesion){ publicar({ enviando: false }); return; }
        // El servidor rechazó el lote (permiso o validación): se saca de la cola y se avisa.
        publicar({ pendientes: quitarDeCola(lote.lote), rechazo: e.message });
      }
    }
    publicar({ enviando: false });
  }
  function programarReintento(){ clearTimeout(reintento); reintento = setTimeout(enviarCola, 20000); }
  if (typeof window !== 'undefined') window.addEventListener('online', () => enviarCola());

  return {
    nombre: 'Servidor ' + base,
    tipo: 'servidor',
    url: base,
    requiereSesion: true,
    tieneSesion(){ return !!token; },
    async probar(){
      const t0 = Date.now(); const j = await pedir('/salud'); const t1 = Date.now();
      if (j.hora) desfase = Date.parse(j.hora) - (t0 + t1) / 2;   // se corrige el tiempo de viaje
      return j;
    },
    async iniciarSesion(usuario, clave){
      const j = await pedir('/sesion', { method:'POST', body:{ usuario, clave } });
      token = j.token; escribirLocal(K.token, token);
      usuarioId = j.usuario && j.usuario.id; escribirLocal(K.usuario, usuarioId);
      publicar({ sesionVencida: false, pendientes: mios(leerCola()).length });
      enviarCola();
      return j.usuario;
    },
    /* Cierra la sesión. La cola NO se borra (lo pendiente se envía cuando su dueño vuelva
       a entrar); la caché sí, para que el siguiente que use el celular no vea datos ajenos. */
    async cerrarSesion(){
      try{ await pedir('/sesion', { method:'DELETE' }); }catch(e){}
      token = null; escribirLocal(K.token, null); escribirLocal(K.cache, null);
    },
    async cargar(){
      try{ await this.probar(); }catch(e){}
      try{
        const j = await pedir('/datos');
        escribirLocal(K.cache, j);
        publicar({ enLinea: true });
        enviarCola();
        return j;
      }catch(e){
        if (e.sesion) throw e;
        publicar({ enLinea: false });
        programarReintento();
        return leerLocal(K.cache, null);   // sin señal: se trabaja con lo último que se cargó
      }
    },
    async guardar(db, operaciones){
      escribirLocal(K.cache, db);   // la vista local siempre refleja el cambio
      if (!operaciones || !operaciones.length) return true;
      const cola = leerCola();
      cola.push({ lote: uid(), usuarioId, operaciones });   // usuarioId: solo para la cola, no se envía
      if (!escribirLocal(K.cola, cola)) return false;
      publicar({ pendientes: mios(cola).length });
      enviarCola();
      return true;
    },
    ahora(){ return new Date(Date.now() + desfase); },
    async subirArchivo(dataURL){
      try{ const j = await pedir('/archivos', { method:'POST', body:{ dataURL } }); return j.url; }
      catch(e){ return dataURL; }   // sin señal: viaja dentro del registro y el servidor lo convierte
    },
    alCambiarEstado(fn){ oyentes.add(fn); fn(estado); return () => oyentes.delete(fn); },
    limpiarRechazo(){ publicar({ rechazo: '' }); }
  };
}
/* Adaptador ACTIVO: servidor si hay dirección; si no, local. No se toca nada más. */
const Adaptador = urlServidor() ? AdaptadorServidor(urlServidor()) : AdaptadorLocal;

/* ---------------------------------------------------------------------
   ESQUEMA Y MIGRACIONES
   "esquema" es la versión de la ESTRUCTURA de los datos. Cuando cambia,
   los datos guardados NO se borran: se pasan por las migraciones en orden.
   Para un cambio de estructura nuevo: subir ESQUEMA_ACTUAL y agregar
   MIGRACIONES[versión anterior] = d => { ...ajustar d... }.
   --------------------------------------------------------------------- */
const ESQUEMA_ACTUAL = 5;
const MIGRACIONES = {
  // 4 → 5: aparecen los casos de revisión de mantenimiento.
  4: d => { d.revisiones = d.revisiones || []; }
};
/**
 * Lleva unos datos guardados a la estructura actual.
 * @returns {{ db: object|null, aviso: string }}  db null = no se pudieron migrar.
 */
function migrar(d){
  if (!d) return { db: null, aviso: '' };
  let v = Number(d.esquema) || 0;
  if (v > ESQUEMA_ACTUAL) return { db: d, aviso: 'Estos datos son de una versión más nueva de la aplicación. Actualizá la página.' };
  while (v < ESQUEMA_ACTUAL){
    if (!MIGRACIONES[v]) return { db: null, aviso: 'No hay forma de actualizar datos de la versión ' + v + '.' };
    MIGRACIONES[v](d); v++; d.esquema = v;
  }
  return { db: d, aviso: '' };
}

/* ---------------------------------------------------------------------
   OPERACIONES: qué cambió en un commit, registro por registro.
   Cada colección se identifica por su campo clave. "config" es un solo objeto.
   La auditoría solo genera "crear": que la pantalla guarde las últimas 500
   es un recorte local; el servidor las guarda todas.
   --------------------------------------------------------------------- */
const CLAVES_COLECCION = { sedes:'id', secciones:'id', usuarios:'id', activos:'codigo', formularios:'id', respuestas:'id', revisiones:'id', auditoria:'id' };
/* Colecciones de SOLO AGREGAR: un registro o un renglón de auditoría nunca cambia después
   de creado. Son casi todos los datos, así que no se copian ni se comparan en cada cambio
   (solo se miran los nuevos), y sus objetos quedan congelados: si algún código intenta
   modificarlos, falla en el acto en vez de perder el cambio en silencio. */
const SOLO_AGREGAR = ['respuestas', 'auditoria'];
function congelar(o){ if (o && typeof o === 'object' && !Object.isFrozen(o)){ Object.freeze(o); Object.values(o).forEach(congelar); } return o; }
/* Congela los registros y la auditoría de unos datos (al cargar o al reemplazar). */
function congelarSoloAgregar(db){ SOLO_AGREGAR.forEach(c => (db[c] || []).forEach(congelar)); return db; }
/* Copia para un cambio: todo se copia en profundidad salvo las colecciones de solo agregar,
   que comparten sus objetos (congelados) y solo copian la lista. */
function copiaParaCambio(db){
  const n = {};
  Object.keys(db).forEach(k => { n[k] = SOLO_AGREGAR.includes(k) ? db[k].slice() : clonar(db[k]); });
  return n;
}
function calcularOperaciones(antes, despues){
  const ops = [];
  Object.entries(CLAVES_COLECCION).forEach(([col, clave]) => {
    const soloAgregar = SOLO_AGREGAR.includes(col);
    const a = new Map((antes[col] || []).map(x => [x[clave], x]));
    const dmap = new Map((despues[col] || []).map(x => [x[clave], x]));
    dmap.forEach((x, k) => {
      if (!a.has(k)) ops.push({ coleccion: col, tipo:'crear', id: k, dato: x });
      // En solo agregar basta comparar si es el mismo objeto (están congelados).
      else if (soloAgregar ? a.get(k) !== x : JSON.stringify(a.get(k)) !== JSON.stringify(x)) ops.push({ coleccion: col, tipo:'actualizar', id: k, dato: x });
    });
    // La auditoría se recorta a 500 en pantalla: eso no es un borrado (el servidor guarda todas).
    if (col !== 'auditoria') a.forEach((x, k) => { if (!dmap.has(k)) ops.push({ coleccion: col, tipo:'borrar', id: k, dato: null }); });
  });
  if (JSON.stringify(antes.config) !== JSON.stringify(despues.config)) ops.push({ coleccion:'config', tipo:'actualizar', id:'config', dato: despues.config });
  return ops;
}

/* ---------------------------------------------------------------------
   PERMISOS: quién puede hacer qué. Esta MISMA regla debe correr en el
   servidor antes de aceptar cada operación.
   --------------------------------------------------------------------- */
/* ¿El equipo es de la sede y el área del usuario? (operarios sin áreas = todas las de su sede) */
function equipoEsDe(db, usuario, activo){
  if (!activo || !usuario) return false;
  const areas = usuario.areas || [];
  const s = db.secciones.find(x => x.nombre === activo.seccion);
  const area = s ? (s.area || s.nombre) : activo.seccion;
  return (!usuario.sede || activo.sede === usuario.sede) && (!areas.length || areas.includes(area));
}
/**
 * ¿Puede este usuario hacer esta operación?
 * @returns {string} '' si puede; si no, el motivo para mostrar.
 */
function motivoSinPermiso(db, usuario, op){
  if (!usuario) return 'No hay una sesión iniciada.';
  const rol = usuario.rol;
  const esGestor = rol === 'admin' || rol === 'maestro';
  const equipo = codigo => db.activos.find(a => a.codigo === codigo);
  switch (op.coleccion){
    case 'auditoria':
      return op.tipo === 'crear' ? '' : 'La auditoría no se puede modificar.';
    case 'respuestas':
      // Un registro es lo que pasó: nadie lo modifica ni lo borra después de enviarlo.
      if (op.tipo !== 'crear') return 'Los registros enviados no se pueden modificar ni borrar.';
      if (op.dato.usuarioId !== usuario.id) return 'Solo podés enviar registros a tu nombre.';
      if (esGestor) return '';
      if (op.dato.activo) return equipoEsDe(db, usuario, equipo(op.dato.activo)) ? '' : 'Ese equipo no es de tu sede o tu área.';
      return '';
    case 'revisiones':
      if (op.tipo === 'borrar') return rol === 'maestro' ? '' : 'Solo el maestro puede borrar casos de revisión.';
      if (esGestor) return '';
      return equipoEsDe(db, usuario, equipo(op.dato.equipo)) ? '' : 'Ese equipo no es de tu sede o tu área.';
    case 'formularios':
      return esGestor ? '' : 'Solo el administrador o el maestro pueden cambiar formularios.';
    case 'activos': case 'usuarios': case 'sedes': case 'secciones': case 'config':
      return rol === 'maestro' ? '' : 'Solo el maestro puede cambiar la configuración.';
    default:
      return 'Operación desconocida.';
  }
}

/* Descargas: dentro de claude.ai usa la capacidad "downloads"; abierto como archivo local usa un enlace normal */
const promesaDescargas = (window.claude && typeof window.claude.use === 'function') ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null);
/**
 * Descarga un archivo (Excel, respaldo, hoja de QR).
 * @param {string} nombre  nombre del archivo con extensión.
 * @param {Blob|string} data  contenido.
 * @returns {Promise<'ok'|'cancelado'|'error'>}
 */
async function guardarArchivo(nombre, data){
  const d = await promesaDescargas;
  if (d){
    try{ await d.save({ filename: nombre, data }); return 'ok'; }
    catch(e){ if (e && e.code === 'declined') return 'cancelado'; if (e && e.code !== 'unavailable') return 'error'; }
  }
  try{
    const blob = data instanceof Blob ? data : new Blob([data]);
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nombre;
    document.body.appendChild(a); a.click(); a.remove();
    return 'ok';
  }catch(e){ return 'error'; }
}

/* =====================================================================
   UTILIDADES
   ===================================================================== */
/* --- Pequeñas utilidades ---
   uid ........... identificador único (ver su definición).
   pad ........... 7 → '07'.
   diaKey ........ fecha → 'AAAA-MM-DD' (día local, para comparar).
   fmtFecha ...... ISO → 'DD/MM/AAAA HH:MM'.
   fmtDiaCorto ... 'AAAA-MM-DD' → 'DD/MM'.
   vacio ......... true si es undefined, null, '' o lista vacía.
   clonar ........ copia profunda (para no modificar el estado original). */
/* Identificador único. Usa crypto.randomUUID (estándar del navegador, sin repetidos en la
   práctica aunque registren cientos de celulares). Si el navegador es muy viejo, arma uno
   largo con la hora y números aleatorios. */
const uid = () => {
  try{ if (window.crypto && typeof window.crypto.randomUUID === 'function') return window.crypto.randomUUID().replace(/-/g, ''); }catch(e){}
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 12) + Math.random().toString(36).slice(2, 12);
};
const pad = n => String(n).padStart(2, '0');
const diaKey = d => { const z = new Date(d); return z.getFullYear() + '-' + pad(z.getMonth() + 1) + '-' + pad(z.getDate()); };
const fmtFecha = iso => { const d = new Date(iso); return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const fmtDiaCorto = k => { const [y, m, d] = k.split('-'); return d + '/' + m; };
const vacio = v => v === undefined || v === null || v === '' || (Array.isArray(v) && v.length === 0);
const clonar = o => (typeof structuredClone === 'function') ? structuredClone(o) : JSON.parse(JSON.stringify(o));
/* Un área agrupa una o varias secciones que atiende el mismo operario (ej. CARNES = carnes blancas + carnes rojas) */

   areaDe ....... sección → su área (si la sección no tiene área, es ella misma).

const areaDe = (db, seccionNombre) => { const s = db.secciones.find(x => x.nombre === seccionNombre); return s ? (s.area || s.nombre) : seccionNombre; };
const listaAreas = db => Array.from(new Set(db.secciones.map(s => s.area || s.nombre))).sort();
const textoAreas = u => (u.areas && u.areas.length) ? u.areas.join(', ') : 'Todas las áreas';
/* --- Horarios y rangos ---
   minutos ............ '12:30' → 750 (minutos desde medianoche).

const escaparHtml = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const minutos = h => { const [a, b] = String(h || '0:0').split(':').map(Number); return (a || 0) * 60 + (b || 0); };
const fmtRango = r => !r ? '' : vacio(r[0]) ? 'máximo ' + r[1] + ' °C' : vacio(r[1]) ? 'mínimo ' + r[0] + ' °C' : r[0] + ' a ' + r[1] + ' °C';
const normalizarHorarios = t => Array.from(new Set(String(t || '').split(/[,;\s]+/).map(x => x.trim()).filter(x => /^\d{1,2}:\d{2}$/.test(x)).map(x => { const [h, m] = x.split(':'); return pad(Math.min(23, +h)) + ':' + pad(Math.min(59, +m)); }))).sort();
/* Horario al que pertenece un registro: el más cercano a la hora real. Si la sede cierra antes del último horario, ese horario se cuenta a la hora de cierre. */
/**
 * Horario al que pertenece un registro.
 * Regla: el horario MÁS CERCANO a la hora real del registro.
 * Si la sede cierra antes del último horario (ej. cierra 18:00 y el
 * último es 20:00), ese último horario se mide contra la hora de cierre.
 * @param {string[]} horarios  ej. ['08:00','12:00','16:00','20:00'].
 * @param {Date|string} fecha  momento del registro.
 * @param {string} [cierre]    hora de cierre de la sede ('18:00'); '' = normal.
 * @returns {string} el horario elegido, ej. '12:00'.

function turnoDe(horarios, fecha, cierre){
  const hs = (horarios && horarios.length ? horarios : HORARIOS_DEF).slice().sort();
  const d = new Date(fecha); const m = d.getHours() * 60 + d.getMinutes();
  const ult = hs[hs.length - 1];
  let mejor = hs[0], dist = Infinity;
  hs.forEach(h => { let t = minutos(h); if (h === ult && cierre && minutos(cierre) < t) t = minutos(cierre); const x = Math.abs(m - t); if (x < dist){ dist = x; mejor = h; } });

}
/* Copia del equipo con su área calculada (las reglas de rango y las condiciones la usan). */
const conArea = (db, a) => a ? Object.assign({}, a, { area: areaDe(db, a.seccion) }) : null;
/* Equipo → 'NEVERA CONGELACION' / 'CUARTO REFRIGERACION' (como en el formulario de Forms). */
const tipoCompleto = a => (a.tipo === 'NEVERA' ? 'NEVERA' : 'CUARTO') + ' ' + a.subtipo;
/* Generador aleatorio con semilla: los datos de demostración salen siempre iguales. */
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
/* Sugiere un código corto a partir de un nombre: 'CARNES ROJAS' → 'CR'. */
function sugerirCodigo(nombre){
  const p = String(nombre || '').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').split(/[^A-Z0-9]+/).filter(x => x && !['Y','DE','DEL','LA','EL','LOS','LAS'].includes(x));
  if (!p.length) return '';
  if (p.length === 1) return p[0].slice(0, 3);
  return p.slice(0, 3).map(x => /\d/.test(x) ? x : x[0]).join('');
}
/* Del contenido de un QR saca el código del equipo.
   Acepta la URL completa (…?equipo=SC14-…) o el código suelto. */
function extraerCodigo(texto){
  const t = String(texto || '').trim();
  try{ const u = new URL(t); const e = u.searchParams.get('equipo'); if (e) return e.toUpperCase(); }catch(e){}
  return t.toUpperCase();
}
/* Reduce una foto a máximo 520 px y calidad JPG media para no llenar el almacenamiento. */
function comprimirFoto(file){
  return new Promise(res => {
    const r = new FileReader();
    r.onload = () => { const img = new Image(); img.onload = () => {
      const s = Math.min(1, 520 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', 0.62));
    }; img.onerror = () => res(''); img.src = r.result; };
    r.readAsDataURL(file);
  });
}

/* =====================================================================
   LÓGICA DE FORMULARIOS (ramificación, autollenado, alertas)
   ===================================================================== */
/**
 * Valor de una pregunta con llenado automático.
 * @param {string} a        clave de AUTOS (ej. 'activo.codigo').
 * @param {object} activo   equipo escaneado (con área) o null.
 * @param {object} usuario  quien llena.
 * @param {object} [ctx]    contexto extra: { turno }.
 */
function resolverAuto(a, activo, usuario, ctx){
  const ahora = new Date();
  switch (a){
    case 'activo.codigo': return activo ? activo.codigo : '';
    case 'activo.sede': return activo ? activo.sede : '';
    case 'activo.seccion': return activo ? activo.seccion : '';
    case 'activo.area': return activo ? (activo.area || activo.seccion) : '';
    case 'activo.tipo': return activo ? activo.tipo : '';
    case 'activo.subtipo': return activo ? activo.subtipo : '';
    case 'activo.tipoCompleto': return activo ? tipoCompleto(activo) : '';
    case 'turno.actual': return ctx && ctx.turno ? ctx.turno : '';
    case 'usuario.nombre': return usuario ? usuario.nombre : '';
    case 'usuario.sede': return usuario ? (usuario.sede || '') : '';
    case 'fecha.hoy': return diaKey(ahora);
    case 'hora.ahora': return pad(ahora.getHours()) + ':' + pad(ahora.getMinutes());
    default: return '';
  }
}
/* Respuestas con que arranca el formulario: solo las preguntas automáticas. */
function valoresIniciales(preguntas, activo, usuario, ctx){
  const v = {};
  preguntas.forEach(q => { if (q.autollenado) v[q.id] = resolverAuto(q.autollenado, activo, usuario, ctx); });
  return v;
}
/* Aproximación al entero: Math.round sube desde 0,5 (también en negativos: -18,5 queda en -18) */
/* Convierte la respuesta a número (acepta coma decimal).
   Si la pregunta tiene "redondear", aproxima al entero:
   desde ,5 sube (4,5 → 5; -18,5 → -18), por debajo baja (4,4 → 4). */
function valorNum(q, v){ const n = parseFloat(String(v).replace(',', '.')); if (isNaN(n)) return NaN; return q.redondear ? Math.round(n) : n; }
/**
 * Rango permitido para una pregunta numérica, según su modo de alerta:
 *   'rango'   → el mínimo/máximo fijo de la pregunta.
 *   'subtipo' → el del subtipo del equipo; antes revisa si hay una
 *               EXCEPCIÓN para su sección o área (ej. cuarto refrigeración
 *               de FRUVER = 8 a 14 °C).
 *   'opcion'  → depende de lo que se respondió en otra pregunta
 *               (ej. tipo de producto: Aves = -2 a 4 °C).
 * @returns {Array|null} [min, max] o null si no hay rango.
 */
function rangoDe(q, activo, valores){
  const al = q.alerta; if (!al || al.modo === 'ninguna') return null;
  if (al.modo === 'rango') return (vacio(al.min) && vacio(al.max)) ? null : [al.min, al.max];
  if (al.modo === 'subtipo'){
    if (!activo) return null;
    const ex = (al.excepciones || []).find(e => e.subtipo === activo.subtipo && (!e.tipo || e.tipo === activo.tipo) && (!e.seccion || e.seccion === activo.seccion || e.seccion === activo.area));
    if (ex) return [ex.min, ex.max];
    return (al.rangos || {})[activo.subtipo] || null;
  }
  if (al.modo === 'opcion'){ if (!valores || !al.ref) return null; const sel = valores[al.ref]; return sel ? ((al.porOpcion || {})[sel] || null) : null; }
  return null;
}
/* true si la respuesta queda por fuera de su rango (ver rangoDe). Vacío nunca es alerta. */
function enAlerta(q, valor, activo, valores){
  if (vacio(valor)) return false;
  const r = rangoDe(q, activo, valores); if (!r) return false;
  const n = valorNum(q, valor); if (isNaN(n)) return false;
  const [mn, mx] = r;
  return (!vacio(mn) && n < Number(mn)) || (!vacio(mx) && n > Number(mx));
}
/* Condiciones sobre el equipo escaneado (no sobre otra pregunta) */
const REF_EQUIPO = [['@activo.tipo','tipo de equipo'], ['@activo.subtipo','subtipo del equipo'], ['@activo.area','área del equipo'], ['@activo.seccion','sección del equipo']];
/**
 * ¿Se muestra la pregunta? Evalúa su condición:
 *   - Condición sobre el EQUIPO ('@activo.subtipo', etc.): compara con el
 *     equipo escaneado. Sin equipo (vista previa libre) se muestra.
 *   - Condición sobre OTRA PREGUNTA: primero esa pregunta debe estar
 *     visible (las ramas se encadenan) y luego se aplica el operador.
 * "prof" corta la recursión si alguien arma condiciones circulares.
 */
function esVisible(q, valores, preguntas, activo, prof){
  prof = prof || 0;
  if (!q.condicion || !q.condicion.qid || prof > 20) return true;
  const c = q.condicion;
  if (String(c.qid).startsWith('@')){
    if (!activo) return true;
    const v = resolverAuto(c.qid.slice(1), activo);
    return c.op === 'distinto' ? v !== c.valor : v === c.valor;
  }
  const ref = preguntas.find(p => p.id === c.qid);
  if (!ref) return true;
  if (!esVisible(ref, valores, preguntas, activo, prof + 1)) return false;
  const v = valores[ref.id];
  switch (c.op){
    case 'igual': return Array.isArray(v) ? v.includes(c.valor) : String(v ?? '') === String(c.valor ?? '');
    case 'distinto': return !vacio(v) && (Array.isArray(v) ? !v.includes(c.valor) : String(v) !== String(c.valor ?? ''));
    case 'mayor': return !vacio(v) && valorNum(ref, v) > parseFloat(c.valor);
    case 'menor': return !vacio(v) && valorNum(ref, v) < parseFloat(c.valor);
    case 'contiene': return Array.isArray(v) ? v.includes(c.valor) : String(v ?? '').toLowerCase().includes(String(c.valor ?? '').toLowerCase());
    case 'respondida': return !vacio(v);
    case 'alerta': return enAlerta(ref, v, activo, valores);
    default: return true;
  }
}
/* Respuesta lista para mostrar o exportar a Excel (listas unidas, °C, imágenes como texto). */
/* ---------- Revisiones de mantenimiento ---------- */
/* La pregunta "¿Se reguló en 15 minutos?": la Sí/No que aparece cuando hay alerta. */
function preguntaRegulo(preguntas){ return (preguntas || []).find(q => q.tipo === 'sino' && q.condicion && q.condicion.op === 'alerta') || null; }
/* La pregunta que se abre cuando NO se reguló (a quién se pidió la revisión). */
function preguntaSolicitud(preguntas, qReg){ return qReg ? (preguntas || []).find(q => q.condicion && q.condicion.qid === qReg.id && q.condicion.valor === 'No') || null : null; }
/**
 * Abre (o actualiza) el caso de revisión de un equipo a partir de un registro.
 * Se llama DENTRO de commit, con la copia "d" de la base. No hace nada si el
 * registro no es de un equipo o si no se respondió "No" a "¿se reguló?".
 */
function registrarRevision(d, form, r){
  if (!r.activo || !form || !form.publicado) return;
  const qReg = preguntaRegulo(form.publicado.preguntas);
  if (!qReg || r.valores[qReg.id] !== 'No') return;
  const qSol = preguntaSolicitud(form.publicado.preguntas, qReg);
  d.revisiones = d.revisiones || [];
  const abierta = d.revisiones.find(x => x.equipo === r.activo && !x.cerrada);
  if (abierta){ abierta.veces++; abierta.ultima = r.fecha; return; }
  d.revisiones.push({ id:'v' + uid(), equipo: r.activo, sede: r.sede, seccion: r.seccion, formId: form.id, respuestaId: r.id, abierta: r.fecha, solicitud: qSol ? (r.valores[qSol.id] || '') : '', veces: 1, ultima: r.fecha, cerrada: null, cerradaPor: '', nota: '' });
}
/* Primera pregunta de temperatura del formulario (la "lectura principal" del equipo). */
function preguntaTemperatura(preguntas){ return (preguntas || []).find(q => q.tipo === 'temperatura') || null; }
/* Pregunta "¿Qué hiciste?" de una alerta: la primera de selección o texto que solo aparece
   cuando hay alerta (no la de "¿se reguló?", que es Sí/No, ni la foto). */
function preguntaAccion(preguntas){ return (preguntas || []).find(q => q.condicion && q.condicion.op === 'alerta' && ['multiple','opcion','parrafo','texto'].includes(q.tipo)) || null; }
/* Valor de una pregunta en un registro, ya como texto (o '' si no hay pregunta o respuesta). */
const valorDe = (r, q) => q && r && r.valores && !vacio(r.valores[q.id]) ? textoValor(q, r.valores[q.id]) : '';

/* "hace 25 min", "hace 3 h", "hace 2 días". */
function hace(iso){
  const min = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
  if (min < 60) return 'hace ' + min + ' min';
  const h = Math.round(min / 60); if (h < 24) return 'hace ' + h + ' h';
  const dd = Math.round(h / 24); return 'hace ' + dd + (dd === 1 ? ' día' : ' días');
}
/* Nombre corto del día de una fecha: "hoy", "ayer" o "DD/MM". */
function nombreDia(iso){
  const k = diaKey(iso);
  return k === diaKey(new Date()) ? 'hoy' : k === diaKey(Date.now() - 864e5) ? 'ayer' : fmtDiaCorto(k);
}

function textoValor(q, v){
  if (vacio(v)) return '';
  if (q.tipo === 'foto' || q.tipo === 'firma') return '(imagen adjunta)';
  if (Array.isArray(v)) return v.join(', ');
  if (q.tipo === 'temperatura') return v + ' °C';
  return String(v);
}
/**
 * Revisión antes de publicar.
 * @returns {{errores:string[], avisos:string[]}}
 *   errores → bloquean el botón Publicar (pregunta sin texto, sin opciones,
 *             condición que apunta a una pregunta posterior o borrada…).
 *   avisos  → no bloquean (ej. usa datos del QR en un formulario sin QR).
 */
function revisarFormulario(f){
  const errores = [], avisos = [];
  const qs = f.preguntas;
  if (!f.nombre.trim()) errores.push('El formulario no tiene nombre.');
  if (!qs.some(q => q.tipo !== 'seccion')) errores.push('Agregá al menos una pregunta.');
  qs.forEach((q, i) => {
    const n = 'Pregunta ' + (i + 1);
    if (!String(q.etiqueta || '').trim()) errores.push(n + ' no tiene texto.');
    if ((q.tipo === 'opcion' || q.tipo === 'multiple') && !(q.opciones || []).filter(Boolean).length) errores.push(n + ' («' + q.etiqueta + '») no tiene opciones.');
    if (q.condicion && q.condicion.qid && String(q.condicion.qid).startsWith('@') && f.vinculo === 'libre') avisos.push(n + ' depende del equipo escaneado, pero este formulario no se abre desde un QR: siempre se mostrará.');
    if (q.alerta && q.alerta.modo === 'opcion' && (q.tipo === 'temperatura' || q.tipo === 'numero')){
      const j = qs.findIndex(p => p.id === q.alerta.ref);
      if (j === -1) errores.push(n + ' tiene alerta según otra pregunta, pero falta elegir cuál.');
      else if (j >= i) errores.push(n + ' toma el rango de una pregunta que está después de ella.');
    }
    if (q.condicion && q.condicion.qid && !String(q.condicion.qid).startsWith('@')){
      const j = qs.findIndex(p => p.id === q.condicion.qid);
      if (j === -1) errores.push(n + ' depende de una pregunta que ya no existe.');
      else if (j >= i) errores.push(n + ' depende de una pregunta que está después de ella. Movela más abajo.');
    }
    if (f.vinculo === 'libre' && String(q.autollenado || '').startsWith('activo.')) avisos.push(n + ' se llena desde el QR, pero este formulario no se abre desde un equipo: quedará vacía.');
    if (q.alerta && q.alerta.modo === 'subtipo' && f.vinculo === 'libre') avisos.push(n + ' usa rangos por subtipo de equipo; sin QR no hay subtipo y no generará alertas.');
  });
  return { errores, avisos };
}

/* Convierte el texto de un formato físico en preguntas.
   Reglas: "# Título" = sección; "Pregunta: A / B / C" = opciones;
   "¿...?" = sí o no; "> texto" = solo aparece si la pregunta sí/no anterior fue «No». */
function digitalizarTexto(texto){
  const lineas = String(texto || '').split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const out = []; let ultimoSiNo = null; let ultimaTemp = null;
  lineas.forEach(raw => {
    let l = raw.replace(/^[-•*\d.)\s]+(?=\S)/, m => m.includes('>') ? m : '');
    let rama = false;
    if (l.startsWith('>')){ rama = true; l = l.slice(1).trim(); }
    const low = l.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    let q;
    if (l.startsWith('#')){ q = preguntaBase('seccion', l.replace(/^#+/, '').trim()); q.requerida = false; }
    else if (/:\s*\S+(\s*[\/|]\s*\S+)+/.test(l)){
      const [et, ops] = [l.slice(0, l.indexOf(':')), l.slice(l.indexOf(':') + 1)];
      q = preguntaBase('opcion', et.trim()); q.opciones = ops.split(/[\/|]/).map(s => s.trim()).filter(Boolean);
      if (/varias|seleccione todas|marque todas/.test(low)) q.tipo = 'multiple';
    }
    else if (/temperatura|°c|grados/.test(low)){ q = preguntaBase('temperatura', l.replace(/[:_]+$/, '')); q.alerta.modo = 'rango'; q.alerta.min = 0; q.alerta.max = 4; ultimaTemp = q; }
    else if (/firma/.test(low)) q = preguntaBase('firma', l.replace(/[:_]+$/, ''));
    else if (/foto|evidencia|imagen/.test(low)) q = preguntaBase('foto', l.replace(/[:_]+$/, ''));
    else if (/^fecha|fecha\b/.test(low)){ q = preguntaBase('fecha', l.replace(/[:_]+$/, '')); q.autollenado = 'fecha.hoy'; }
    else if (/^hora|hora\b/.test(low)){ q = preguntaBase('hora', l.replace(/[:_]+$/, '')); q.autollenado = 'hora.ahora'; }
    else if (/responsable|nombre de quien|realizado por|elaborado por/.test(low)){ q = preguntaBase('texto', l.replace(/[:_]+$/, '')); q.autollenado = 'usuario.nombre'; }
    else if (/accion correctiva|correccion/.test(low)){
      q = preguntaBase('parrafo', l.replace(/[:_]+$/, '')); q.requerida = true;
      if (ultimaTemp && !rama) q.condicion = { qid: ultimaTemp.id, op:'alerta', valor:'' };
    }
    else if (/observ|comentario|descripcion|novedad|detalle/.test(low)){ q = preguntaBase('parrafo', l.replace(/[:_]+$/, '')); q.requerida = false; }
    else if (/^¿?\s*(cuant[oa]s?)\b/.test(low)) q = preguntaBase('numero', l);
    else if (/^¿?\s*(que|por que|cual|cuales|como|donde|quien|quienes)\b/.test(low)) q = preguntaBase('parrafo', l);
    else if (l.startsWith('¿') || l.endsWith('?')) q = preguntaBase('sino', l);
    else if (/cantidad|numero|kg|peso|unidades|litros|valor/.test(low)) q = preguntaBase('numero', l.replace(/[:_]+$/, ''));
    else q = preguntaBase('texto', l.replace(/[:_]+$/, ''));
    if (rama && ultimoSiNo) q.condicion = { qid: ultimoSiNo.id, op:'igual', valor:'No' };
    if (q.tipo === 'sino') ultimoSiNo = q;
    out.push(q);
  });
  return out;
}

/**
 * Crea equipos nuevos con su código: SEDE-SECCION-TIPO-SUBTIPO-##.
 * El consecutivo sigue al número más alto ya existente para esa
 * combinación, así nunca se reutiliza un código (ni de equipos de baja).
 * Devuelve la lista; NO la guarda (quien llama hace commit).
 */
function generarCodigos(db, sedeNombre, seccionNombre, tipo, subtipo, cantidad){
  const sede = db.sedes.find(s => s.nombre === sedeNombre); const sec = db.secciones.find(s => s.nombre === seccionNombre);
  if (!sede || !sec) return [];
  const pref = [sede.codigo, sec.codigo, TIPOS[tipo], SUBTIPOS[subtipo]].join('-') + '-';
  let max = 0;
  db.activos.forEach(a => { if (a.codigo.startsWith(pref)){ const n = parseInt(a.codigo.slice(pref.length), 10); if (n > max) max = n; } });
  const nuevos = [];
  for (let i = 1; i <= cantidad; i++) nuevos.push({ codigo: pref + pad(max + i), sede: sedeNombre, seccion: seccionNombre, tipo, subtipo, estado:'activo', historial:[] });
  return nuevos;
}
