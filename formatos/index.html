    <!-- 6. Ranking de equipos con más alertas | 7. Equipos sin ningún registro hoy (lado a lado, misma altura) -->
    <div className="par">
      <${RankingAlertas} key=${'ranking|' + formId + '|' + sede} equipos=${equipos} resps=${resps} form=${form} revisiones=${db.revisiones} onEquipo=${verEquipo} />
      <div className="panel">
        <div className="panel-tit"><div><h3>Sin ningún registro hoy <span className="tag aviso" style=${{ marginLeft: 4 }}>${sinRegistro.length}</span></h3><p className="muted chico">Agrupados por sede; los que más pendientes tienen, primero.</p></div></div>
        ${gruposSin.length === 0 ? html`<p className="rango-ok">Todos los equipos tienen al menos un registro hoy.</p>` : html`<div className="desplaza"><div className="pila" style=${{ gap: 6 }}>${gruposSin.map(([sd, secs]) => { const n = Object.values(secs).flat().length; return html`<details key=${sd} className="grupo-sede" open=${gruposSin.length <= 3}>
          <summary><span>${sd}</span><span className="tag aviso">${n} ${n === 1 ? 'equipo' : 'equipos'}</span></summary>
          <div className="pila" style=${{ gap: 6 }}>${Object.entries(secs).map(([sc, lista]) => html`<div key=${sc} className="fila" style=${{ gap: 6 }}>
            <span className="chico" style=${{ fontWeight: 800, width:'100%' }}>${sc}</span>
            ${lista.map(a => html`<button key=${a.codigo} className="tag aviso codigo" style=${{ border: 0, cursor:'pointer' }} title="Ver su tendencia" onClick=${() => verEquipo(a.codigo)}>${a.codigo}</button>`)}
          </div>`)}</div>
        </details>`; })}</div></div>`}
      </div>
    </div>
  </div>`;
}

/* =====================================================================
   ADMINISTRADOR: FORMULARIOS (lista + plantillas)
   ===================================================================== */
/* Lista de formularios con su estado (borrador / publicado / cambios sin
   publicar). Crear desde plantilla o pegando el texto de un formato de papel. */
function Formularios({ db, commit, ir, avisar }){
  const [nuevo, setNuevo] = useState(false);
  const [texto, setTexto] = useState('');
  const [modo, setModo] = useState('plantillas');
  const activos = db.formularios.filter(f => !f.archivado);
  const archivados = db.formularios.filter(f => f.archivado);
  const crear = (nombre, preguntas, extra) => {
    const ahora = new Date().toISOString();
    const f = Object.assign({ id:'f' + uid(), nombre, descripcion:'', vinculo:'libre', tipoEquipo:'', vecesDia:1, preguntas, publicado:null, cambiosSinPublicar:true, archivado:false, creado:ahora, actualizado:ahora }, extra || {});
    commit(d => { d.formularios.push(f); }, 'Creó el formulario «' + nombre + '».');
    setNuevo(false); ir('constructor', { formId: f.id });
  };
  const estado = f => !f.publicado ? html`<span className="tag aviso">Borrador</span>` : f.cambiosSinPublicar ? html`<span className="tag aviso">Publicado v${f.publicado.version} · cambios sin publicar</span>` : html`<span className="tag verde">Publicado v${f.publicado.version}</span>`;
  const fila = f => {
    const n = db.respuestas.filter(r => r.formId === f.id).length;
    return html`<tr key=${f.id}>
      <td><b>${f.nombre}</b><div className="muted chico">${f.descripcion}</div></td>
      <td>${f.vinculo === 'equipo' ? 'Desde el QR del equipo' : 'Formato general'}</td>
      <td>${estado(f)}</td>
      <td>${n}<span className="solo-celular-txt"> ${n === 1 ? 'registro' : 'registros'}</span></td>
      <td><div className="fila">
        <button className="btn chico pri" onClick=${() => ir('constructor', { formId: f.id })}>Editar</button>
        <button className="btn chico" onClick=${() => commit(d => { const o = clonar(f); o.id = 'f' + uid(); o.nombre = f.nombre + ' (copia)'; o.publicado = null; o.cambiosSinPublicar = true; o.archivado = false; d.formularios.push(o); }, 'Duplicó «' + f.nombre + '».')}>Duplicar</button>
        <button className="btn chico" onClick=${() => commit(d => { const o = d.formularios.find(x => x.id === f.id); o.archivado = !o.archivado; }, (f.archivado ? 'Restauró' : 'Archivó') + ' «' + f.nombre + '».')}>${f.archivado ? 'Restaurar' : 'Archivar'}</button>
      </div></td>
    </tr>`;
  };
  const vistaPrevia = useMemo(() => digitalizarTexto(texto), [texto]);
  return html`<div className="page">
    <div className="cabeza">
      <div><h1>Formularios</h1><p>Cada cambio queda como borrador hasta que lo publiques. Los registros ya enviados guardan la versión con la que se llenaron.</p></div>
      <button className="btn pri" onClick=${() => { setNuevo(true); setModo('plantillas'); }}>Crear formulario</button>
    </div>
    <div className="tabla apilar"><table>
      <thead><tr><th>Formulario</th><th>Cómo se abre</th><th>Estado</th><th>Registros</th><th></th></tr></thead>
      <tbody>${activos.map(fila)}</tbody>
    </table></div>
    ${archivados.length > 0 && html`<h3 style=${{ fontSize: 16, margin:'22px 0 10px' }}>Archivados</h3><div className="tabla apilar"><table><tbody>${archivados.map(fila)}</tbody></table></div>`}
    ${nuevo && html`<${Modal} titulo="Crear formulario" ancho=${modo === 'texto'} onCerrar=${() => setNuevo(false)}>
      <div className="fila" style=${{ margin:'6px 0 16px' }}>
        <button className=${'btn chico' + (modo === 'plantillas' ? ' pri' : '')} onClick=${() => setModo('plantillas')}>Desde una plantilla</button>
        <button className=${'btn chico' + (modo === 'texto' ? ' pri' : '')} onClick=${() => setModo('texto')}>Digitalizar un formato de papel</button>
      </div>
      ${modo === 'plantillas' ? html`<div className="lista-op">
        <button className="item-op" onClick=${() => crear('Formulario sin nombre', [preguntaBase('texto','Pregunta nueva')])}><span><b>En blanco</b><span className="muted chico">Empezá desde cero.</span></span></button>
        <button className="item-op" onClick=${() => crear('Registro de temperatura (copia)', plantillaTemperatura(), { vinculo:'equipo', horarios: HORARIOS_DEF.slice(), vecesDia:4, instructivo: INSTRUCTIVO_TEMP })}><span><b>Registro de temperatura por QR</b><span className="muted chico">Datos del equipo automáticos, rangos por subtipo y acción correctiva solo si hay alerta.</span></span></button>
        <button className="item-op" onClick=${() => crear('Checklist de limpieza (copia)', plantillaLimpieza())}><span><b>Checklist con ramificación</b><span className="muted chico">Si responden «No», pide el motivo; si responden «Sí», pide los productos.</span></span></button>
        <button className="item-op" onClick=${() => crear('Recepción de mercancía (copia)', plantillaRecepcion())}><span><b>Recepción de mercancía</b><span className="muted chico">Temperatura con rango fijo, foto si está fuera y firma.</span></span></button>
      </div>` : html`<div className="grid2">
        <div className="pila">
          <label className="campo"><span>Pegá el texto del formato tal como está en el papel, una pregunta por línea</span>
            <textarea style=${{ minHeight: 280 }} value=${texto} onChange=${e => setTexto(e.target.value)} placeholder=${'# Datos generales\nFecha\nResponsable del turno\n# Revisión\nTemperatura de la vitrina\nAcción correctiva\n¿La vitrina está limpia?\n> ¿Qué falta por limpiar?\nEstado de la puerta: Bueno / Regular / Malo\nFoto de evidencia\nObservaciones\nFirma'}></textarea>
          </label>
          <p className="muted chico">Reglas que entiende: <b># Título</b> crea una sección · <b>Pregunta: A / B / C</b> crea opciones · <b>¿…?</b> crea sí o no · empezá con <b>></b> para que solo aparezca si la pregunta sí/no anterior fue «No» · «acción correctiva» aparece solo si la temperatura anterior queda fuera de rango · fecha, hora y responsable se llenan solos.</p>
        </div>
        <div className="pila">
          <b>Así quedaría (${vistaPrevia.length} elementos)</b>
          <div className="lista-q" style=${{ maxHeight: 330, overflow:'auto' }}>${vistaPrevia.map(q => html`<div key=${q.id} className=${'q-item' + (q.tipo === 'seccion' ? ' sec' : '') + (q.condicion ? ' ramal' : '')} style=${{ cursor:'default' }}>
            <span className="t">${q.etiqueta}</span>
            <span className="m"><span className="tag">${NOMBRE_TIPO[q.tipo]}</span>${q.autollenado && html`<span className="tag verde">Automático</span>`}${q.condicion && html`<span className="tag aviso">Condicional</span>`}${q.opciones.length > 0 && html`<span className="tag">${q.opciones.length} opciones</span>`}</span>
          </div>`)}</div>
        </div>
      </div>
      <div className="modal-pie"><button className="btn" onClick=${() => setNuevo(false)}>Cancelar</button><button className="btn pri" disabled=${!vistaPrevia.length} onClick=${() => crear('Formato digitalizado', vistaPrevia)}>Crear con estas ${vistaPrevia.length} preguntas</button></div>`}
    <//>`}
  </div>`;
}

/* =====================================================================
   ADMINISTRADOR: CONSTRUCTOR DE FORMULARIOS
   ===================================================================== */
/* Campo de horarios separados por coma; se limpian y ordenan al salir del campo. */
function HorariosInput({ valor, onCambio }){
  const [t, setT] = useState((valor || []).join(', '));
  useEffect(() => { setT((valor || []).join(', ')); }, [(valor || []).join(',')]);
  return html`<input value=${t} placeholder="08:00, 12:00, 16:00, 20:00" onChange=${e => setT(e.target.value)} onBlur=${() => { const hs = normalizarHorarios(t); onCambio(hs); setT(hs.join(', ')); }} />`;
}
/**
 * Editor de formularios. Tres columnas:
 *   izquierda → revisión, lista de preguntas y botones para agregar.
 *   centro    → la pregunta seleccionada: texto, tipo, autollenado,
 *               alerta por rango, condición para mostrarse.
 *   derecha   → vista previa en un celular, probando con un equipo real.
 * Todo cambio va al BORRADOR (form.preguntas). "Publicar" copia el
 * borrador a form.publicado con una versión nueva; los registros ya
 * enviados conservan la versión con que se llenaron.
 */
function Constructor({ db, formId, commit, ir, avisar, usuario }){
  const form = db.formularios.find(f => f.id === formId);
  const [sel, setSel] = useState(form && form.preguntas[0] ? form.preguntas[0].id : null);
  const [verPrevia, setVerPrevia] = useState(false);
  const [digit, setDigit] = useState(false);
  const [texto, setTexto] = useState('');
  const [equipoPrueba, setEquipoPrueba] = useState('');
  const vistaDigit = useMemo(() => digitalizarTexto(texto), [texto]);
  if (!form) return html`<div className="page"><div className="panel vacio">Ese formulario ya no existe. <button className="btn chico" onClick=${() => ir('formularios')}>Volver</button></div></div>`;

  const cambiarForm = fn => commit(d => { const f = d.formularios.find(x => x.id === formId); fn(f); f.cambiosSinPublicar = true; f.actualizado = new Date().toISOString(); }, null);
  const cambiarQ = (id, fn) => cambiarForm(f => { const q = f.preguntas.find(x => x.id === id); if (q) fn(q); });
  const agregar = tipo => { const q = preguntaBase(tipo, tipo === 'seccion' ? 'Sección nueva' : ''); if (tipo === 'opcion' || tipo === 'multiple') q.opciones = ['Opción 1','Opción 2']; if (tipo === 'temperatura'){ q.alerta.modo = form.vinculo === 'equipo' ? 'subtipo' : 'rango'; q.alerta.min = 0; q.alerta.max = 4; }
    const i = form.preguntas.findIndex(x => x.id === sel);
    cambiarForm(f => { f.preguntas.splice(i === -1 ? f.preguntas.length : i + 1, 0, q); }); setSel(q.id); };
  const mover = (id, d) => cambiarForm(f => { const i = f.preguntas.findIndex(x => x.id === id); const j = i + d; if (j < 0 || j >= f.preguntas.length) return; const t = f.preguntas[i]; f.preguntas[i] = f.preguntas[j]; f.preguntas[j] = t; });
  const borrar = id => { cambiarForm(f => { f.preguntas = f.preguntas.filter(x => x.id !== id); f.preguntas.forEach(q => { if (q.condicion && q.condicion.qid === id) q.condicion = null; }); }); setSel(null); };
  const rev = revisarFormulario(form);
  const publicar = () => {
    commit(d => { const f = d.formularios.find(x => x.id === formId); f.publicado = { version: (f.publicado ? f.publicado.version : 0) + 1, preguntas: clonar(f.preguntas), fecha: new Date().toISOString() }; f.cambiosSinPublicar = false; }, 'Publicó «' + form.nombre + '» (versión ' + ((form.publicado ? form.publicado.version : 0) + 1) + ').');
    avisar('Publicado. Los operarios ya ven la versión ' + ((form.publicado ? form.publicado.version : 0) + 1) + '.');
  };
  const descartar = () => { if (!form.publicado) return; commit(d => { const f = d.formularios.find(x => x.id === formId); f.preguntas = clonar(f.publicado.preguntas); f.cambiosSinPublicar = false; }, 'Descartó cambios de «' + form.nombre + '».'); };

  const q = form.preguntas.find(x => x.id === sel);
  const qi = q ? form.preguntas.indexOf(q) : -1;
  const anteriores = qi > 0 ? form.preguntas.slice(0, qi).filter(p => p.tipo !== 'seccion' && p.tipo !== 'foto' && p.tipo !== 'firma') : [];
  const ref = q && q.condicion ? form.preguntas.find(p => p.id === q.condicion.qid) : null;
  const opcionesAnt = anteriores.filter(p => p.tipo === 'opcion');
  const refOp = q && q.alerta && q.alerta.ref ? form.preguntas.find(p => p.id === q.alerta.ref) : null;
  const valoresEquipo = k => k === '@activo.tipo' ? Object.keys(TIPOS) : k === '@activo.subtipo' ? Object.keys(SUBTIPOS) : k === '@activo.area' ? listaAreas(db) : db.secciones.map(x => x.nombre);
  const numOVacio = v => v === '' ? '' : Number(v);
  const equiposPosibles = db.activos.filter(a => a.estado === 'activo' && (!form.tipoEquipo || a.tipo === form.tipoEquipo));
  const activoPrueba = form.vinculo === 'equipo' ? (equiposPosibles.find(a => a.codigo === equipoPrueba) || equiposPosibles[0]) : null;
  const dependientes = q ? form.preguntas.filter(p => p.condicion && p.condicion.qid === q.id) : [];

  const editor = !q ? html`<div className="panel vacio">Elegí una pregunta de la lista o agregá una nueva.</div>` : html`<div className="panel editor">
    <div className="fila" style=${{ justifyContent:'space-between', marginBottom: 12 }}>
      <h3 style=${{ margin: 0 }}>${q.tipo === 'seccion' ? 'Título de sección' : 'Pregunta ' + (qi + 1)}</h3>
      <div className="fila">
        <button className="btn chico" disabled=${qi === 0} onClick=${() => mover(q.id, -1)} aria-label="Subir">Subir</button>
        <button className="btn chico" disabled=${qi === form.preguntas.length - 1} onClick=${() => mover(q.id, 1)} aria-label="Bajar">Bajar</button>
        <button className="btn chico" onClick=${() => { const c = clonar(q); c.id = 'q' + uid(); cambiarForm(f => f.preguntas.splice(qi + 1, 0, c)); setSel(c.id); }}>Duplicar</button>
        <button className="btn chico peligro" onClick=${() => borrar(q.id)}>Eliminar</button>
      </div>
    </div>
    <div className="pila">
      <label className="campo"><span>Texto</span><input value=${q.etiqueta} placeholder="Escribí la pregunta" onChange=${e => cambiarQ(q.id, x => { x.etiqueta = e.target.value; })} /></label>
      ${q.tipo !== 'seccion' && html`<div className="grid2">
        <label className="campo"><span>Tipo de respuesta</span><select value=${q.tipo} onChange=${e => cambiarQ(q.id, x => { x.tipo = e.target.value; if ((x.tipo === 'opcion' || x.tipo === 'multiple') && !x.opciones.length) x.opciones = ['Opción 1','Opción 2']; })}>${TIPOS_PREGUNTA.filter(t => t[0] !== 'seccion').map(([k, n]) => html`<option key=${k} value=${k}>${n}</option>`)}</select></label>
        <label className="campo"><span>Ayuda para quien llena</span><input value=${q.ayuda} placeholder="Opcional" onChange=${e => cambiarQ(q.id, x => { x.ayuda = e.target.value; })} /></label>
      </div>`}
      ${q.tipo !== 'seccion' && html`<label className="check"><input type="checkbox" checked=${q.requerida} onChange=${e => cambiarQ(q.id, x => { x.requerida = e.target.checked; })} /> Obligatoria</label>`}
      ${(q.tipo === 'temperatura' || q.tipo === 'numero') && html`<label className="check"><input type="checkbox" checked=${!!q.redondear} onChange=${e => cambiarQ(q.id, x => { x.redondear = e.target.checked; })} /> Aproximar al número entero (desde 0,5 sube)</label>`}
      ${(q.tipo === 'opcion' || q.tipo === 'multiple') && html`<label className="campo"><span>Opciones, una por línea</span><textarea value=${(q.opciones || []).join('\n')} onChange=${e => cambiarQ(q.id, x => { x.opciones = e.target.value.split('\n'); })}></textarea></label>`}
    </div>

    ${q.tipo !== 'seccion' && q.tipo !== 'foto' && q.tipo !== 'firma' && html`<div className="bloque">
      <b>Llenado automático</b>
      <div className="grid2">
        <label className="campo"><span>De dónde sale la respuesta</span><select value=${q.autollenado} onChange=${e => cambiarQ(q.id, x => { x.autollenado = e.target.value; if (!x.autollenado) x.bloqueada = false; else if (x.autollenado.startsWith('activo.')) x.bloqueada = true; })}>${AUTOS.map(([k, n]) => html`<option key=${k} value=${k}>${n}</option>`)}</select></label>
        ${q.autollenado && html`<label className="check" style=${{ alignSelf:'end', paddingBottom: 8 }}><input type="checkbox" checked=${q.bloqueada} onChange=${e => cambiarQ(q.id, x => { x.bloqueada = e.target.checked; })} /> No se puede cambiar</label>`}
      </div>
    </div>`}

    ${(q.tipo === 'temperatura' || q.tipo === 'numero') && html`<div className="bloque">
      <b>Alerta por rango</b>
      <div className="regla pila">
        <label className="campo"><span>Cuándo marcar alerta</span><select value=${q.alerta.modo} onChange=${e => cambiarQ(q.id, x => { x.alerta.modo = e.target.value; })}>
          <option value="ninguna">Nunca</option>
          <option value="rango">Fuera de un rango fijo</option>
          ${q.tipo === 'temperatura' && html`<option value="subtipo">Fuera del rango según el subtipo del equipo</option>`}
          ${(opcionesAnt.length > 0 || q.alerta.modo === 'opcion') && html`<option value="opcion">Fuera del rango según la respuesta de otra pregunta</option>`}
        </select></label>
        ${q.alerta.modo === 'rango' && html`<div className="grid2">
          <label className="campo"><span>Mínimo (vacío = sin mínimo)</span><input type="number" value=${q.alerta.min} onChange=${e => cambiarQ(q.id, x => { x.alerta.min = numOVacio(e.target.value); })} /></label>
          <label className="campo"><span>Máximo (vacío = sin máximo)</span><input type="number" value=${q.alerta.max} onChange=${e => cambiarQ(q.id, x => { x.alerta.max = numOVacio(e.target.value); })} /></label>
        </div>`}
        ${q.alerta.modo === 'subtipo' && html`<div className="pila">${Object.keys(SUBTIPOS).map(s => html`<div key=${s} className="grid3" style=${{ alignItems:'end' }}>
          <span className="chico" style=${{ fontWeight: 800 }}>${s.toLowerCase()}</span>
          <label className="campo"><span>Mín.</span><input type="number" value=${(q.alerta.rangos[s] || ['', ''])[0]} onChange=${e => cambiarQ(q.id, x => { x.alerta.rangos[s] = [e.target.value === '' ? '' : Number(e.target.value), (x.alerta.rangos[s] || ['', ''])[1]]; })} /></label>
          <label className="campo"><span>Máx.</span><input type="number" value=${(q.alerta.rangos[s] || ['', ''])[1]} onChange=${e => cambiarQ(q.id, x => { x.alerta.rangos[s] = [(x.alerta.rangos[s] || ['', ''])[0], e.target.value === '' ? '' : Number(e.target.value)]; })} /></label>
        </div>`)}
          <div className="pila" style=${{ marginTop: 6 }}>
            <b className="chico">Excepciones por sección</b>
            <p className="muted chico">Un rango distinto para una sección. Ej.: cuarto de refrigeración de FRUVER de 8 a 14 °C.</p>
            ${(q.alerta.excepciones || []).map((ex, i) => html`<div key=${i} className="fila" style=${{ alignItems:'flex-end', background:'var(--paper)', borderRadius: 10, padding: 8 }}>
              <label className="campo" style=${{ flex:'2 1 150px' }}><span>Sección o área</span><select value=${ex.seccion} onChange=${e => cambiarQ(q.id, x => { x.alerta.excepciones[i].seccion = e.target.value; })}>${Array.from(new Set(db.secciones.map(z => z.nombre).concat(listaAreas(db)))).sort().map(n => html`<option key=${n} value=${n}>${n}</option>`)}</select></label>
              <label className="campo" style=${{ flex:'1 1 120px' }}><span>Equipo</span><select value=${ex.tipo} onChange=${e => cambiarQ(q.id, x => { x.alerta.excepciones[i].tipo = e.target.value; })}><option value="">Nevera o cuarto</option>${Object.keys(TIPOS).map(t => html`<option key=${t} value=${t}>${t}</option>`)}</select></label>
              <label className="campo" style=${{ flex:'1 1 140px' }}><span>Subtipo</span><select value=${ex.subtipo} onChange=${e => cambiarQ(q.id, x => { x.alerta.excepciones[i].subtipo = e.target.value; })}>${Object.keys(SUBTIPOS).map(t => html`<option key=${t} value=${t}>${t}</option>`)}</select></label>
              <label className="campo" style=${{ flex:'0 1 80px' }}><span>Mín.</span><input type="number" value=${ex.min} onChange=${e => cambiarQ(q.id, x => { x.alerta.excepciones[i].min = numOVacio(e.target.value); })} /></label>
              <label className="campo" style=${{ flex:'0 1 80px' }}><span>Máx.</span><input type="number" value=${ex.max} onChange=${e => cambiarQ(q.id, x => { x.alerta.excepciones[i].max = numOVacio(e.target.value); })} /></label>
              <button className="btn chico peligro" onClick=${() => cambiarQ(q.id, x => { x.alerta.excepciones.splice(i, 1); })}>Quitar</button>
            </div>`)}
            <button className="btn chico" style=${{ alignSelf:'flex-start' }} onClick=${() => cambiarQ(q.id, x => { x.alerta.excepciones = (x.alerta.excepciones || []).concat({ seccion: (db.secciones[0] || {}).nombre || '', tipo:'', subtipo:'REFRIGERACION', min:'', max:'' }); })}>Agregar excepción</button>
          </div>
          <p className="muted chico">Si el mínimo o el máximo queda vacío, ese lado no tiene límite (congelación: máximo -18 °C).</p></div>`}
        ${q.alerta.modo === 'opcion' && html`<div className="pila">
          <label className="campo"><span>Según la respuesta de</span><select value=${q.alerta.ref || ''} onChange=${e => cambiarQ(q.id, x => { x.alerta.ref = e.target.value; x.alerta.porOpcion = x.alerta.porOpcion || {}; })}>
            <option value="">Elegí una pregunta de opciones</option>
            ${opcionesAnt.map(p => html`<option key=${p.id} value=${p.id}>${p.etiqueta || 'sin texto'}</option>`)}
          </select></label>
          ${refOp && (refOp.opciones || []).filter(Boolean).map(o => { const r = (q.alerta.porOpcion || {})[o] || ['', '']; return html`<div key=${o} className="grid3" style=${{ alignItems:'end' }}>
            <span className="chico" style=${{ fontWeight: 800 }}>${o}</span>
            <label className="campo"><span>Mín.</span><input type="number" value=${r[0]} onChange=${e => cambiarQ(q.id, x => { x.alerta.porOpcion = x.alerta.porOpcion || {}; const a = x.alerta.porOpcion[o] || ['', '']; x.alerta.porOpcion[o] = [numOVacio(e.target.value), a[1]]; })} /></label>
            <label className="campo"><span>Máx.</span><input type="number" value=${r[1]} onChange=${e => cambiarQ(q.id, x => { x.alerta.porOpcion = x.alerta.porOpcion || {}; const a = x.alerta.porOpcion[o] || ['', '']; x.alerta.porOpcion[o] = [a[0], numOVacio(e.target.value)]; })} /></label>
          </div>`; })}
          <p className="muted chico">Ej.: el tipo de producto decide el límite. Aves de -2 a 4 °C, bovinos y porcinos máximo 7 °C.</p>
        </div>`}
        ${q.alerta.modo !== 'ninguna' && html`<button className="btn chico" style=${{ alignSelf:'flex-start' }} onClick=${() => { const n = preguntaBase('parrafo','Acción correctiva tomada'); n.condicion = { qid: q.id, op:'alerta', valor:'' }; cambiarForm(f => f.preguntas.splice(qi + 1, 0, n)); setSel(n.id); }}>Agregar «acción correctiva» que solo aparezca con alerta</button>`}
      </div>
    </div>`}

    <div className="bloque">
      <b>Mostrar esta ${q.tipo === 'seccion' ? 'sección' : 'pregunta'}</b>
      ${!anteriores.length && form.vinculo !== 'equipo' ? html`<p className="muted chico">Siempre. Para que dependa de otra respuesta, tiene que haber una pregunta antes.</p>` : html`<div className="regla pila">
        <label className="campo"><span>Cuándo</span><select value=${q.condicion ? q.condicion.qid : ''} onChange=${e => cambiarQ(q.id, x => { x.condicion = e.target.value ? { qid: e.target.value, op: 'igual', valor: e.target.value.startsWith('@') ? valoresEquipo(e.target.value)[0] : '' } : null; const r = form.preguntas.find(p => p.id === e.target.value); if (r && x.condicion){ if (r.tipo === 'sino') x.condicion.valor = 'No'; else if (r.tipo === 'opcion' || r.tipo === 'multiple') x.condicion.valor = (r.opciones || [])[0] || ''; else if (r.alerta && r.alerta.modo !== 'ninguna') x.condicion.op = 'alerta'; } })}>
          <option value="">Siempre</option>
          ${form.vinculo === 'equipo' && REF_EQUIPO.map(([k, n]) => html`<option key=${k} value=${k}>Solo si el ${n} escaneado…</option>`)}
          ${anteriores.map(p => html`<option key=${p.id} value=${p.id}>Solo si «${p.etiqueta || 'sin texto'}»…</option>`)}
        </select></label>
        ${q.condicion && String(q.condicion.qid).startsWith('@') && html`<div className="grid2">
          <label className="campo"><span>Condición</span><select value=${q.condicion.op} onChange=${e => cambiarQ(q.id, x => { x.condicion.op = e.target.value; })}><option value="igual">es</option><option value="distinto">no es</option></select></label>
          <label className="campo"><span>Valor</span><select value=${q.condicion.valor} onChange=${e => cambiarQ(q.id, x => { x.condicion.valor = e.target.value; })}>${valoresEquipo(q.condicion.qid).map(o => html`<option key=${o} value=${o}>${o}</option>`)}</select></label>
        </div>`}
        ${q.condicion && ref && html`<div className="grid2">
          <label className="campo"><span>Condición</span><select value=${q.condicion.op} onChange=${e => cambiarQ(q.id, x => { x.condicion.op = e.target.value; })}>${OPERADORES.filter(([k]) => k !== 'alerta' || (ref.alerta && ref.alerta.modo !== 'ninguna')).map(([k, n]) => html`<option key=${k} value=${k}>${n}</option>`)}</select></label>
          ${!['respondida','alerta'].includes(q.condicion.op) && html`<label className="campo"><span>Valor</span>${(ref.tipo === 'sino' || ref.tipo === 'opcion' || ref.tipo === 'multiple') ?
            html`<select value=${q.condicion.valor} onChange=${e => cambiarQ(q.id, x => { x.condicion.valor = e.target.value; })}>${(ref.tipo === 'sino' ? ['Sí','No'] : ref.opciones.filter(Boolean)).map(o => html`<option key=${o} value=${o}>${o}</option>`)}</select>` :
            html`<input value=${q.condicion.valor} onChange=${e => cambiarQ(q.id, x => { x.condicion.valor = e.target.value; })} />`}</label>`}
        </div>`}
      </div>`}
      ${dependientes.length > 0 && html`<p className="muted chico" style=${{ marginTop: 8 }}>De esta respuesta dependen: ${dependientes.map(d => '«' + d.etiqueta + '»').join(', ')}.</p>`}
    </div>
  </div>`;

  return html`<div className="page" style=${{ maxWidth: 1500 }}>
    <div className="cabeza">
      <div>
        <button className="btn chico" onClick=${() => ir('formularios')} style=${{ marginBottom: 10 }}>Volver a formularios</button>
        <input value=${form.nombre} onChange=${e => cambiarForm(f => { f.nombre = e.target.value; })} aria-label="Nombre del formulario" style=${{ fontFamily:'Poppins, sans-serif', fontSize: 22, fontWeight: 700, border:'1px solid transparent', padding:'4px 8px', marginLeft:-8, background:'transparent' }} />
        <p>${!form.publicado ? 'Borrador, todavía no lo ve nadie.' : form.cambiosSinPublicar ? 'Los operarios siguen viendo la versión ' + form.publicado.version + ' hasta que publiques.' : 'Publicado en versión ' + form.publicado.version + ', sin cambios pendientes.'}</p>
      </div>
      <div className="fila">
        ${form.publicado && form.cambiosSinPublicar && html`<button className="btn" onClick=${descartar}>Descartar cambios</button>`}
        <button className="btn" onClick=${() => setDigit(true)}>Pegar formato de papel</button>
        <button className="btn lima" disabled=${rev.errores.length > 0 || !form.cambiosSinPublicar} onClick=${publicar}>${form.publicado ? 'Publicar versión ' + (form.publicado.version + 1) : 'Publicar'}</button>
      </div>
    </div>

    <div className="panel" style=${{ marginBottom: 16 }}>
      <div className="grid3">
        <label className="campo"><span>Descripción para quien llena</span><input value=${form.descripcion} onChange=${e => cambiarForm(f => { f.descripcion = e.target.value; })} /></label>
        <label className="campo"><span>Cómo se abre</span><select value=${form.vinculo} onChange=${e => cambiarForm(f => { f.vinculo = e.target.value; })}><option value="equipo">Escaneando el QR de un equipo</option><option value="libre">Desde la lista de formatos generales</option></select></label>
        <div className="grid2">
          ${form.vinculo === 'equipo' && html`<label className="campo"><span>Para equipos</span><select value=${form.tipoEquipo} onChange=${e => cambiarForm(f => { f.tipoEquipo = e.target.value; })}><option value="">Todos</option><option value="NEVERA">Solo neveras</option><option value="CUARTO FRIO">Solo cuartos fríos</option></select></label>`}
          <label className="campo"><span>Horarios del día</span><${HorariosInput} valor=${form.horarios || []} onCambio=${hs => cambiarForm(f => { f.horarios = hs; f.vecesDia = Math.max(1, hs.length); })} /></label>
        </div>
      </div>
      <label className="campo" style=${{ marginTop: 12 }}><span>Instructivo (lo ve el operario arriba del formulario)</span><textarea style=${{ minHeight: 90 }} value=${form.instructivo || ''} onChange=${e => cambiarForm(f => { f.instructivo = e.target.value; })}></textarea></label>
    </div>

    <div className="pestanas">
      <button className=${'btn chico' + (!verPrevia ? ' pri' : '')} onClick=${() => setVerPrevia(false)}>Estructura</button>
      <button className=${'btn chico' + (verPrevia ? ' pri' : '')} onClick=${() => setVerPrevia(true)}>Vista previa</button>
    </div>

    <div className="constructor">
      <div className="pila" style=${{ display: verPrevia ? 'none' : undefined }}>
        <div className=${'revision ' + (rev.errores.length ? 'mal' : 'ok')}>
          ${rev.errores.length ? html`<${React.Fragment}><b>Revisá antes de publicar</b><ul>${rev.errores.map((e, i) => html`<li key=${i}>${e}</li>`)}</ul><//>` : 'Listo para publicar.'}
        </div>
        ${rev.avisos.length > 0 && html`<div className="revision" style=${{ background:'var(--warn-bg)', color:'var(--warn)' }}><ul style=${{ margin: 0 }}>${rev.avisos.map((e, i) => html`<li key=${i}>${e}</li>`)}</ul></div>`}
        <div className="lista-q">
          ${form.preguntas.map((p, i) => html`<button key=${p.id} className=${'q-item' + (p.id === sel ? ' on' : '') + (p.tipo === 'seccion' ? ' sec' : '') + (p.condicion && p.condicion.qid ? ' ramal' : '')} onClick=${() => setSel(p.id)}>
            <span className="t">${p.tipo === 'seccion' ? '' : (i + 1) + '. '}${p.etiqueta || html`<span className="muted">Sin texto</span>`}</span>
            <span className="m">
              <span className="tag">${NOMBRE_TIPO[p.tipo]}</span>
              ${p.requerida && p.tipo !== 'seccion' && !p.bloqueada && html`<span className="tag">Obligatoria</span>`}
              ${p.autollenado && html`<span className="tag verde">Automática</span>`}
              ${p.condicion && p.condicion.qid && html`<span className="tag aviso">${p.condicion.op === 'alerta' ? 'Solo con alerta' : 'Condicional'}</span>`}
              ${p.alerta && p.alerta.modo !== 'ninguna' && (p.tipo === 'temperatura' || p.tipo === 'numero') && html`<span className="tag alerta">Con rango</span>`}
            </span>
          </button>`)}
        </div>
        <div className="panel" style=${{ padding: 12 }}>
          <p className="chico" style=${{ fontWeight: 800, marginBottom: 8 }}>Agregar debajo de la seleccionada</p>
          <div className="agregar">${TIPOS_PREGUNTA.map(([k, n]) => html`<button key=${k} className="btn" onClick=${() => agregar(k)}>${n}</button>`)}</div>
        </div>
      </div>

      <div style=${{ display: verPrevia ? 'none' : undefined }}>${editor}</div>

      <div className=${'tel-marco' + (verPrevia ? ' visible' : '')}>
        <div className="fila" style=${{ justifyContent:'space-between', marginBottom: 8 }}>
          <b className="chico">Así lo ve el operario</b>
          ${form.vinculo === 'equipo' && html`<select value=${activoPrueba ? activoPrueba.codigo : ''} onChange=${e => setEquipoPrueba(e.target.value)} style=${{ width:'auto', fontSize: 12.5, padding:'4px 6px' }} aria-label="Probar con equipo">${equiposPosibles.map(a => html`<option key=${a.codigo} value=${a.codigo}>${a.codigo}</option>`)}</select>`}
        </div>
        <div className="tel" style=${{ maxWidth: 372, margin:'0 auto' }}>
          <${Formulario} key=${JSON.stringify(form.preguntas.map(p => [p.id, p.tipo, p.autollenado, p.opciones])) + (activoPrueba ? activoPrueba.codigo : '')} titulo=${form.nombre} descripcion=${form.descripcion} preguntas=${form.preguntas} activo=${conArea(db, activoPrueba)} turno=${form.vinculo === 'equipo' && form.horarios && form.horarios.length ? turnoDe(form.horarios, new Date()) : ''} instructivo=${form.instructivo} usuario=${usuario} previa=${true} onEnviar=${async () => avisar('Vista previa: el registro no se guarda.')} />
        </div>
      </div>
    </div>

    ${digit && html`<${Modal} titulo="Pegar un formato de papel" ancho=${true} onCerrar=${() => setDigit(false)}>
      <div className="grid2">
        <label className="campo"><span>Una pregunta por línea</span><textarea style=${{ minHeight: 260 }} value=${texto} onChange=${e => setTexto(e.target.value)} placeholder=${'¿El área está limpia?\n> ¿Qué falta?\nTemperatura de la vitrina\nAcción correctiva\nEstado: Bueno / Regular / Malo'}></textarea></label>
        <div className="lista-q" style=${{ maxHeight: 300, overflow:'auto' }}>${vistaDigit.map(p => html`<div key=${p.id} className=${'q-item' + (p.tipo === 'seccion' ? ' sec' : '') + (p.condicion ? ' ramal' : '')} style=${{ cursor:'default' }}><span className="t">${p.etiqueta}</span><span className="m"><span className="tag">${NOMBRE_TIPO[p.tipo]}</span>${p.condicion && html`<span className="tag aviso">Condicional</span>`}${p.autollenado && html`<span className="tag verde">Automática</span>`}</span></div>`)}</div>
      </div>
      <div className="modal-pie">
        <button className="btn" onClick=${() => setDigit(false)}>Cancelar</button>
        <button className="btn" disabled=${!vistaDigit.length} onClick=${() => { cambiarForm(f => { f.preguntas = vistaDigit; }); setSel(vistaDigit[0].id); setDigit(false); setTexto(''); }}>Reemplazar todo</button>
        <button className="btn pri" disabled=${!vistaDigit.length} onClick=${() => { cambiarForm(f => { f.preguntas = f.preguntas.concat(vistaDigit); }); setSel(vistaDigit[0].id); setDigit(false); setTexto(''); }}>Agregar al final</button>
      </div>
    <//>`}
  </div>`;
}

/* =====================================================================
   ADMINISTRADOR: RESULTADOS Y EXCEL
   ===================================================================== */
/**
 * Resultados de un formulario. Dos vistas:
 *   Planilla por horario → un renglón por equipo, una columna por horario
 *                          y la columna Avance (X/4). Un día a la vez.
 *   Lista de registros   → todos los registros en un rango de fechas.
 * Las dos exportan a Excel.
 * Props para el operario:
 *   alcance(equipo) → true si el equipo es de su área. Si viene, la
 *                     pantalla se limita a esos equipos y muestra las
 *                     tarjetas del día.
 *   usuarioId       → en formatos sin equipo, solo ve sus propios registros.
 * La planilla toma el ÚLTIMO registro de cada equipo en cada horario.
 */
function Resultados({ db, avisar, inicial, alcance, usuarioId }){
  const esOp = !!alcance;
  const publicados = db.formularios.filter(f => f.publicado && !(esOp && f.archivado));
  const [formId, setFormId] = useState((inicial && inicial.formId) || (publicados[0] && publicados[0].id) || '');
  const form = db.formularios.find(f => f.id === formId);
  // "inicial" puede traer filtros desde el tablero: { vista, sede, seccion, buscar, dia, desde, soloAlertas }.
  const [vista, setVista] = useState((inicial && inicial.vista) || (esOp ? 'planilla' : 'lista'));
  const [desde, setDesde] = useState((inicial && inicial.desde) || diaKey(Date.now() - 6 * 864e5));
  const [hasta, setHasta] = useState(diaKey(new Date()));
  const [dia, setDia] = useState((inicial && inicial.dia) || diaKey(new Date()));
  const [sede, setSede] = useState((inicial && inicial.sede) || '');
  const [seccion, setSeccion] = useState((inicial && inicial.seccion) || '');
  const [soloAlertas, setSoloAlertas] = useState(!!(inicial && inicial.soloAlertas));
  const [buscar, setBuscar] = useState((inicial && inicial.buscar) || '');
  const [detalle, setDetalle] = useState(null);
  // Lista de registros: cuántos se pintan (de a 100, para que el celular no se trabe con miles).
  const [cuantos, setCuantos] = useState(100);
  const equipoDe = useMemo(() => Object.fromEntries(db.activos.map(a => [a.codigo, a])), [db.activos]);
  if (!form) return html`<div className="page"><div className="cabeza"><h1>Resultados</h1></div><div className="panel vacio">Todavía no hay formularios publicados.</div></div>`;

  const enAlcance = r => !esOp || (r.activo ? !!(equipoDe[r.activo] && alcance(equipoDe[r.activo])) : r.usuarioId === usuarioId);
  const esPlanilla = vista === 'planilla' && form.vinculo === 'equipo';
  const horarios = (form.horarios && form.horarios.length ? form.horarios : HORARIOS_DEF).slice().sort();
  const cols = form.publicado.preguntas.filter(q => q.tipo !== 'seccion' && !['activo.sede','activo.seccion','activo.codigo','turno.actual'].includes(q.autollenado));
  const qT = form.publicado.preguntas.find(q => q.tipo === 'temperatura');
  const b = buscar.toLowerCase();

  const filas = db.respuestas.filter(r => r.formId === formId && enAlcance(r) && diaKey(r.fecha) >= desde && diaKey(r.fecha) <= hasta && (!sede || r.sede === sede) && (!seccion || r.seccion === seccion) && (!soloAlertas || r.alertas.length) && (!b || JSON.stringify([r.activo, r.usuario, r.seccion]).toLowerCase().includes(b))).sort((x, y) => y.fecha.localeCompare(x.fecha));

  const equiposPl = db.activos.filter(a => a.estado === 'activo' && (!form.tipoEquipo || a.tipo === form.tipoEquipo) && (!sede || a.sede === sede) && (!seccion || a.seccion === seccion) && (!esOp || alcance(a)) && (!b || (a.codigo + ' ' + a.seccion).toLowerCase().includes(b))).sort((x, y) => (x.sede + x.seccion + x.codigo).localeCompare(y.sede + y.seccion + y.codigo));
  const celda = {};
  db.respuestas.forEach(r => { if (r.formId === formId && r.activo && diaKey(r.fecha) === dia){ const k = r.activo + '|' + (r.turno || turnoDe(horarios, r.fecha)); if (!celda[k] || celda[k].fecha < r.fecha) celda[k] = r; } });
  const hoyK = diaKey(new Date()); const ahoraMin = new Date().getHours() * 60 + new Date().getMinutes();
  const vencido = h => dia < hoyK || (dia === hoyK && ahoraMin > minutos(h) + 120);
  const filasPl = soloAlertas ? equiposPl.filter(a => horarios.some(h => { const r = celda[a.codigo + '|' + h]; return r && r.alertas.length; })) : equiposPl;
  const totalPl = equiposPl.length * horarios.length;
  const hechosPl = equiposPl.reduce((s, a) => s + horarios.filter(h => celda[a.codigo + '|' + h]).length, 0);
  const alertasPl = equiposPl.reduce((s, a) => s + horarios.filter(h => { const r = celda[a.codigo + '|' + h]; return r && r.alertas.length; }).length, 0);
  const conRegistroPl = equiposPl.filter(a => horarios.some(h => celda[a.codigo + '|' + h])).length;
  const incompletosPl = equiposPl.filter(a => horarios.some(h => !celda[a.codigo + '|' + h] && vencido(h))).length;
  const pctPl = equiposPl.length ? Math.round(100 * conRegistroPl / equiposPl.length) : 0;
  const moverDia = n => { const [y, m, d] = dia.split('-').map(Number); const k = diaKey(new Date(y, m - 1, d + n)); setDia(k > hoyK ? hoyK : k); };
  const nombreDia = dia === hoyK ? 'hoy' : 'el ' + fmtDiaCorto(dia);

  const exportar = async () => {
    let enc, datos, nombre;
    if (esPlanilla){
      enc = ['Sede', 'Sección', 'Equipo', 'Tipo', 'Avance'].concat(horarios);
      datos = filasPl.map(a => [a.sede, a.seccion, a.codigo, tipoCompleto(a), horarios.filter(h => celda[a.codigo + '|' + h]).length + '/' + horarios.length].concat(horarios.map(h => { const r = celda[a.codigo + '|' + h]; if (!r) return ''; const v = qT ? r.valores[qT.id] : ''; return (vacio(v) ? 'Registrado' : v + ' °C') + (r.alertas.length ? ' (alerta)' : ''); })));
      nombre = 'Planilla_temperaturas_' + dia + '.xlsx';
    } else {
      enc = ['Fecha', 'Horario', 'Usuario', 'Sede', 'Sección', 'Equipo', 'Versión', 'Alerta'].concat(cols.map(q => q.etiqueta));
      datos = filas.map(r => [fmtFecha(r.fecha), r.turno || '', r.usuario, r.sede, r.seccion, r.activo || '', r.version, r.alertas.length ? 'Sí' : 'No'].concat(cols.map(q => textoValor(q, r.valores[q.id]))));
      nombre = (form.nombre.replace(/[^\wáéíóúñ ]+/gi, '').trim().replace(/\s+/g, '_').slice(0, 60) || 'registros') + '_' + desde + '_a_' + hasta + '.xlsx';
    }
    const ws = XLSX.utils.aoa_to_sheet([enc].concat(datos));
    ws['!cols'] = enc.map((h, i) => ({ wch: Math.min(40, Math.max(10, String(h).length + 2, ...datos.slice(0, 50).map(d => String(d[i] || '').length))) }));
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, esPlanilla ? 'Planilla' : 'Registros');
    const buf = XLSX.write(wb, { bookType:'xlsx', type:'array' });
    const r = await guardarArchivo(nombre, new Blob([buf], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
    if (r === 'error') avisar('No se pudo descargar el archivo en esta vista.', 'error');
  };
  const nExport = esPlanilla ? filasPl.length : filas.length;

  return html`<div className="page">
    <div className="cabeza">
      <div><h1>${esOp ? 'Resultados de tu área' : 'Resultados'}</h1><p>${esPlanilla ? 'Planilla del día: una columna por horario, como el formato en papel. Tocá un valor para ver el registro completo.' : 'Filtrá los registros y descargalos a Excel con una columna por pregunta.'}</p></div>
      <button className="btn pri" disabled=${!nExport} onClick=${exportar}>Descargar Excel (${nExport})</button>
    </div>
    <div className="panel" style=${{ marginBottom: 14 }}>
      ${form.vinculo === 'equipo' && html`<div className="fila" style=${{ marginBottom: 12 }}>
        <button className=${'btn chico' + (vista === 'planilla' ? ' pri' : '')} onClick=${() => setVista('planilla')}>Planilla por horario</button>
        <button className=${'btn chico' + (vista === 'lista' ? ' pri' : '')} onClick=${() => setVista('lista')}>Lista de registros</button>
      </div>`}
      <div className="fila" style=${{ alignItems:'flex-end' }}>
        <label className="campo" style=${{ flex:'2 1 240px' }}><span>Formulario</span><select value=${formId} onChange=${e => setFormId(e.target.value)}>${publicados.map(f => html`<option key=${f.id} value=${f.id}>${f.nombre}</option>`)}</select></label>
        ${esPlanilla ? html`<${React.Fragment}>
          <label className="campo" style=${{ flex:'1 1 150px' }}><span>Día</span><input type="date" value=${dia} max=${hoyK} onChange=${e => setDia(e.target.value || hoyK)} /></label>
          <div className="fila" style=${{ gap: 6, paddingBottom: 2 }}>
            <button className="btn chico" onClick=${() => moverDia(-1)}>Día anterior</button>
            <button className="btn chico" disabled=${dia >= hoyK} onClick=${() => moverDia(1)}>Día siguiente</button>
            <button className="btn chico" disabled=${dia === hoyK} onClick=${() => setDia(hoyK)}>Hoy</button>
          </div>
        <//>` : html`<${React.Fragment}>
          <label className="campo" style=${{ flex:'1 1 140px' }}><span>Desde</span><input type="date" value=${desde} onChange=${e => setDesde(e.target.value)} /></label>
          <label className="campo" style=${{ flex:'1 1 140px' }}><span>Hasta</span><input type="date" value=${hasta} onChange=${e => setHasta(e.target.value)} /></label>
        <//>`}
        ${!esOp && html`<label className="campo" style=${{ flex:'1 1 180px' }}><span>Sede</span><select value=${sede} onChange=${e => setSede(e.target.value)}><option value="">Todas</option>${db.sedes.map(s => html`<option key=${s.id} value=${s.nombre}>${s.nombre}</option>`)}</select></label>`}
        <label className="campo" style=${{ flex:'1 1 180px' }}><span>Sección</span><select value=${seccion} onChange=${e => setSeccion(e.target.value)}><option value="">Todas</option>${db.secciones.filter(x => !esOp || db.activos.some(a => a.seccion === x.nombre && alcance(a))).map(x => html`<option key=${x.id} value=${x.nombre}>${x.nombre}</option>`)}</select></label>
        <label className="campo" style=${{ flex:'1 1 180px' }}><span>Buscar equipo${esPlanilla ? ' o sección' : ' o persona'}</span><input value=${buscar} onChange=${e => setBuscar(e.target.value)} /></label>
        <label className="check" style=${{ paddingBottom: 9 }}><input type="checkbox" checked=${soloAlertas} onChange=${e => setSoloAlertas(e.target.checked)} /> Solo alertas</label>
      </div>
    </div>

    ${esPlanilla ? html`<${React.Fragment}>
      ${esOp && html`<div className="kpis">
        <div className="kpi destacado"><div className="n">${pctPl}%</div><div className="l">equipos con registro ${nombreDia} (${conRegistroPl} de ${equiposPl.length})</div></div>
        <div className="kpi"><div className="n">${hechosPl}</div><div className="l">registros ${nombreDia} · meta ${totalPl}</div></div>
        <div className=${'kpi' + (alertasPl ? ' rojo' : '')}><div className="n">${alertasPl}</div><div className="l">${alertasPl === 1 ? 'alerta' : 'alertas'} ${nombreDia}</div></div>
        <div className="kpi"><div className="n">${incompletosPl}</div><div className="l">${incompletosPl === 1 ? 'equipo' : 'equipos'} con horarios sin registrar</div></div>
      </div>`}
      <div className="fila" style=${{ marginBottom: 10 }}>
        <span className="tag verde">${hechosPl} de ${totalPl} registros del día</span>
        ${alertasPl > 0 && html`<span className="tag alerta">${alertasPl} con alerta</span>`}
        <span className="muted chico">«Falta» aparece cuando ya pasaron 2 horas del horario sin registro.</span>
      </div>
      ${filasPl.length === 0 ? html`<div className="panel vacio">No hay equipos con estos filtros.</div>` : html`<${React.Fragment}><div className="tabla solo-ancho"><table>
        <thead><tr><th>Equipo</th><th>Sección</th><th style=${{ textAlign:'center' }}>Avance</th>${horarios.map(h => html`<th key=${h} style=${{ textAlign:'center' }}>${h}</th>`)}</tr></thead>
        <tbody>${filasPl.map(a => html`<tr key=${a.codigo}>
          <td><span className="codigo">${a.codigo}</span><div className="muted chico">${tipoCompleto(a).toLowerCase()}</div></td>
          <td>${a.seccion}</td>
          <td className="celda"><b className="cuenta" style=${{ fontSize: 15 }}>${horarios.filter(h => celda[a.codigo + '|' + h]).length}/${horarios.length}</b></td>
          ${horarios.map(h => { const r = celda[a.codigo + '|' + h];
            if (r){ const v = qT ? r.valores[qT.id] : ''; return html`<td key=${h} className="celda"><button className=${'celda-btn ' + (r.alertas.length ? 'mal' : 'bien')} title=${'Registrado por ' + r.usuario + ' a las ' + fmtFecha(r.fecha).slice(11)} onClick=${() => setDetalle(r)}>${vacio(v) ? 'Ver' : v + ' °C'}</button></td>`; }
            return html`<td key=${h} className="celda">${vencido(h) ? html`<span className="tag aviso">Falta</span>` : html`<span className="muted">—</span>`}</td>`; })}
        </tr>`)}</tbody>
      </table></div>
      <div className="pila solo-celular" style=${{ gap: 8 }}>${filasPl.map(a => html`<div key=${a.codigo} className="reg-tarjeta" style=${{ cursor:'default' }}>
        <span className="fila" style=${{ justifyContent:'space-between', flexWrap:'nowrap' }}>
          <b className="codigo">${a.codigo}</b>
          <b className="cuenta">${horarios.filter(h => celda[a.codigo + '|' + h]).length}/${horarios.length}</b>
        </span>
        <span className="muted chico">${a.seccion} · ${tipoCompleto(a).toLowerCase()}</span>
        <span className="pl-horas">${horarios.map(h => { const r = celda[a.codigo + '|' + h]; const v = r && qT ? r.valores[qT.id] : '';
          return html`<span key=${h} className="pl-hora"><small>${h}</small>${r
            ? html`<button className=${'celda-btn ' + (r.alertas.length ? 'mal' : 'bien')} onClick=${() => setDetalle(r)}>${vacio(v) ? 'Ver' : v + '°'}</button>`
            : vencido(h) ? html`<span className="tag aviso">Falta</span>` : html`<span className="muted">—</span>`}</span>`; })}</span>
      </div>`)}</div><//>`}
    <//>` : filas.length === 0 ? html`<div className="panel vacio">No hay registros con estos filtros. Ampliá las fechas o quitá «Solo alertas».</div>` : html`<${React.Fragment}>
    <div className="tabla solo-ancho"><table>
      <thead><tr><th>Fecha</th><th>Horario</th><th>Equipo</th><th>Sección</th><th>Usuario</th>${cols.slice(0, 4).map(q => html`<th key=${q.id}>${q.etiqueta}</th>`)}<th></th></tr></thead>
      <tbody>${filas.slice(0, cuantos).map(r => html`<tr key=${r.id} className="clic" onClick=${() => setDetalle(r)}>
        <td style=${{ whiteSpace:'nowrap' }}>${fmtFecha(r.fecha)}</td>
        <td>${r.turno || ''}</td>
        <td className="codigo">${r.activo || '—'}</td><td>${r.seccion || r.sede}</td><td>${r.usuario}</td>
        ${cols.slice(0, 4).map(q => html`<td key=${q.id}>${r.alertas.includes(q.id) ? html`<span className="tag alerta">${textoValor(q, r.valores[q.id])}</span>` : textoValor(q, r.valores[q.id]).slice(0, 60)}</td>`)}
        <td>${r.alertas.length ? html`<span className="tag alerta">Alerta</span>` : ''}</td>
      </tr>`)}</tbody>
    </table></div>
    <div className="pila solo-celular" style=${{ gap: 8 }}>${filas.slice(0, cuantos).map(r => { const v = qT ? r.valores[qT.id] : ''; return html`<button key=${r.id} className=${'reg-tarjeta' + (r.alertas.length ? ' mal' : '')} onClick=${() => setDetalle(r)}>
      <span className="fila" style=${{ justifyContent:'space-between', flexWrap:'nowrap' }}>
        <b className="codigo">${r.activo || form.nombre}</b>
        ${r.alertas.length ? html`<span className="tag alerta">${vacio(v) ? 'Alerta' : v + ' °C'}</span>` : !vacio(v) && html`<span className="tag verde">${v} °C</span>`}
      </span>
      <span className="chico">${fmtFecha(r.fecha)}${r.turno ? ' · horario ' + r.turno : ''}</span>
      <span className="muted chico">${r.seccion || r.sede} · ${r.usuario}</span>
    </button>`; })}</div>
    ${filas.length > cuantos && html`<div className="fila" style=${{ marginTop: 10 }}>
      <span className="muted chico">Se muestran ${cuantos} de ${filas.length}. El Excel incluye todos.</span>
      <button className="btn chico" onClick=${() => setCuantos(c => c + 100)}>Mostrar ${Math.min(100, filas.length - cuantos)} más</button>
    </div>`}<//>`}

    ${detalle && html`<${Modal} titulo=${detalle.activo || form.nombre} onCerrar=${() => setDetalle(null)}>
      <p className="muted">${fmtFecha(detalle.fecha)}${detalle.turno ? ' · horario de las ' + detalle.turno : ''} · ${detalle.usuario} · versión ${detalle.version}</p>
      <div className="pila" style=${{ marginTop: 14 }}>${(form.publicado.preguntas).filter(q => q.tipo !== 'seccion' && !vacio(detalle.valores[q.id])).map(q => html`<div key=${q.id}>
        <div className="chico muted" style=${{ fontWeight: 800 }}>${q.etiqueta}</div>
        ${q.tipo === 'foto' || q.tipo === 'firma' ? html`<img src=${detalle.valores[q.id]} alt=${q.etiqueta} style=${{ maxHeight: 200, borderRadius: 10, background:'#fff' }} />` : html`<div className=${detalle.alertas.includes(q.id) ? 'alerta-caja' : ''} style=${{ marginTop: detalle.alertas.includes(q.id) ? 4 : 0 }}>${textoValor(q, detalle.valores[q.id])}</div>`}
      </div>`)}</div>
      <div className="modal-pie"><button className="btn" onClick=${() => setDetalle(null)}>Cerrar</button></div>
    <//>`}
  </div>`;
}

/* =====================================================================
   EQUIPOS Y QR (maestro edita; administrador consulta e imprime)
   ===================================================================== */
/**
 * Equipos y QR. El QR contiene la dirección de la app + ?equipo=CÓDIGO,
 * nunca el link del formulario: si el formulario cambia, el QR impreso
 * sigue sirviendo. puedeEditar (solo maestro) habilita crear equipos,
 * trasladar (cambia sede/sección, el código queda igual y se guarda en
 * historial) y dar de baja.
 */
function Equipos({ db, commit, avisar, puedeEditar }){
  const [sede, setSede] = useState(db.sedes[0] ? db.sedes[0].nombre : '');
  const [seccion, setSeccion] = useState('');
  const [ver, setVer] = useState('activo');
  const [crear, setCrear] = useState(false);
  const [nuevo, setNuevo] = useState({ seccion: db.secciones[0] ? db.secciones[0].nombre : '', tipo:'NEVERA', subtipo:'CONGELACION', cantidad:1 });
  const [qrUno, setQrUno] = useState(null);
  const [hoja, setHoja] = useState(false);
  const [traslado, setTraslado] = useState(null);
  const base = db.config.qrBase || (location.origin + location.pathname);
  const urlQR = c => base + '?equipo=' + encodeURIComponent(c);
  const lista = db.activos.filter(a => (!sede || a.sede === sede) && (!seccion || a.seccion === seccion) && (ver === 'todos' || a.estado === ver));
  const previa = crear ? generarCodigos(db, sede, nuevo.seccion, nuevo.tipo, nuevo.subtipo, Math.max(1, Math.min(50, nuevo.cantidad || 1))) : [];
  const descargarHoja = async () => {
    const fichas = lista.filter(a => a.estado === 'activo').map(a => { const q = qrcode(0, 'M'); q.addData(urlQR(a.codigo)); q.make(); return '<div class="f">' + q.createSvgTag({ cellSize: 4, margin: 2, scalable: true }) + '<b>' + escaparHtml(a.codigo) + '</b><small>' + escaparHtml(a.seccion) + '<br>' + escaparHtml(tipoCompleto(a)) + '</small></div>'; }).join('');
    const doc = '<!doctype html><html lang="es"><head><meta charset="utf-8"><title>QR equipos ' + escaparHtml(sede) + '</title><style>body{font-family:Arial,sans-serif;margin:12mm}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:6mm}.f{border:1px solid #1C5A2A;border-radius:3mm;padding:3mm;text-align:center;break-inside:avoid}.f svg{width:100%;height:auto}.f b{display:block;font-size:11pt}.f small{font-size:8pt;color:#333}</style></head><body><h3>Supertiendas Cañaveral · ' + escaparHtml(sede) + '</h3><div class="g">' + fichas + '</div></body></html>';
    const r = await guardarArchivo('QR_equipos_' + (sede || 'todas').replace(/\s+/g, '_') + '.html', doc);
    if (r === 'error') avisar('No se pudo descargar en esta vista.', 'error');
  };
  return html`<div className="page">
    <div className="cabeza">
      <div><h1>Equipos y QR</h1><p>El QR apunta a esta aplicación con el código del equipo, no al formulario. Si el formulario cambia, el QR impreso sigue funcionando.</p></div>
      <div className="fila">
        <button className="btn" onClick=${() => setHoja(true)}>Hoja de QR para imprimir</button>
        ${puedeEditar && html`<button className="btn pri" onClick=${() => setCrear(true)}>Agregar equipos</button>`}
      </div>
    </div>
    <div className="fila" style=${{ marginBottom: 14 }}>
      <select value=${sede} onChange=${e => setSede(e.target.value)} style=${{ width:'auto' }}><option value="">Todas las sedes</option>${db.sedes.map(s => html`<option key=${s.id} value=${s.nombre}>${s.nombre}</option>`)}</select>
      <select value=${seccion} onChange=${e => setSeccion(e.target.value)} style=${{ width:'auto' }}><option value="">Todas las secciones</option>${db.secciones.map(s => html`<option key=${s.id} value=${s.nombre}>${s.nombre}</option>`)}</select>
      <select value=${ver} onChange=${e => setVer(e.target.value)} style=${{ width:'auto' }}><option value="activo">Activos</option><option value="baja">Dados de baja</option><option value="todos">Todos</option></select>
      <span className="muted chico">${lista.length} equipos</span>
    </div>
    ${lista.length === 0 ? html`<div className="panel vacio">No hay equipos con estos filtros.</div>` : html`<div className="tabla apilar"><table>
      <thead><tr><th>Código</th><th>Sede</th><th>Sección</th><th>Tipo</th><th>Estado</th><th></th></tr></thead>
      <tbody>${lista.map(a => html`<tr key=${a.codigo}>
        <td className="codigo">${a.codigo}</td><td>${a.sede}</td><td>${a.seccion}${a.historial && a.historial.length ? html` <span className="tag aviso" title=${a.historial.map(h => fmtFecha(h.fecha) + ': ' + h.de + ' → ' + h.a).join('\n')}>Trasladado</span>` : ''}</td>
        <td>${tipoCompleto(a).toLowerCase()}</td>
        <td>${a.estado === 'activo' ? html`<span className="tag verde">Activo</span>` : html`<span className="tag">De baja</span>`}</td>
        <td><div className="fila">
          <button className="btn chico" onClick=${() => setQrUno(a)}>Ver QR</button>
          ${puedeEditar && a.estado === 'activo' && html`<button className="btn chico" onClick=${() => setTraslado({ codigo: a.codigo, sede: a.sede, seccion: a.seccion })}>Trasladar</button>`}
          ${puedeEditar && html`<button className="btn chico" onClick=${() => commit(d => { const x = d.activos.find(z => z.codigo === a.codigo); x.estado = x.estado === 'activo' ? 'baja' : 'activo'; }, (a.estado === 'activo' ? 'Dio de baja ' : 'Reactivó ') + a.codigo + '.')}>${a.estado === 'activo' ? 'Dar de baja' : 'Reactivar'}</button>`}
        </div></td>
      </tr>`)}</tbody>
    </table></div>`}

    ${crear && html`<${Modal} titulo="Agregar equipos" onCerrar=${() => setCrear(false)}>
      <p className="muted">El código se arma solo: sede, sección, tipo, subtipo y consecutivo. Los códigos dados de baja no se reutilizan.</p>
      <div className="grid2" style=${{ marginTop: 14 }}>
        <label className="campo"><span>Sede</span><select value=${sede} onChange=${e => setSede(e.target.value)}>${db.sedes.map(s => html`<option key=${s.id} value=${s.nombre}>${s.nombre}</option>`)}</select></label>
        <label className="campo"><span>Sección</span><select value=${nuevo.seccion} onChange=${e => setNuevo(Object.assign({}, nuevo, { seccion: e.target.value }))}>${db.secciones.map(s => html`<option key=${s.id} value=${s.nombre}>${s.nombre}</option>`)}</select></label>
        <label className="campo"><span>Tipo de equipo</span><select value=${nuevo.tipo} onChange=${e => setNuevo(Object.assign({}, nuevo, { tipo: e.target.value }))}>${Object.keys(TIPOS).map(t => html`<option key=${t} value=${t}>${t}</option>`)}</select></label>
        <label className="campo"><span>Subtipo</span><select value=${nuevo.subtipo} onChange=${e => setNuevo(Object.assign({}, nuevo, { subtipo: e.target.value }))}>${Object.keys(SUBTIPOS).map(t => html`<option key=${t} value=${t}>${t}</option>`)}</select></label>
        <label className="campo"><span>Cantidad</span><input type="number" min="1" max="50" value=${nuevo.cantidad} onChange=${e => setNuevo(Object.assign({}, nuevo, { cantidad: parseInt(e.target.value || '1', 10) }))} /></label>
      </div>
      ${!sede ? html`<p className="alerta-caja">Elegí una sede.</p>` : html`<div className="fila" style=${{ marginTop: 14 }}>${previa.map(a => html`<span key=${a.codigo} className="tag verde codigo">${a.codigo}</span>`)}</div>`}
      <div className="modal-pie"><button className="btn" onClick=${() => setCrear(false)}>Cancelar</button><button className="btn pri" disabled=${!previa.length} onClick=${() => { commit(d => { d.activos.push(...generarCodigos(d, sede, nuevo.seccion, nuevo.tipo, nuevo.subtipo, previa.length)); }, 'Creó ' + previa.length + ' equipo(s): ' + previa.map(a => a.codigo).join(', ') + '.'); setCrear(false); avisar('Se crearon ' + previa.length + ' equipos.'); }}>Crear ${previa.length} equipo${previa.length === 1 ? '' : 's'}</button></div>
    <//>`}

    ${traslado && html`<${Modal} titulo=${'Trasladar ' + traslado.codigo} onCerrar=${() => setTraslado(null)}>
      <p className="muted">El código y el QR no cambian; cambia la ubicación que se llena automáticamente en el formulario.</p>
      <div className="grid2" style=${{ marginTop: 14 }}>
        <label className="campo"><span>Sede nueva</span><select value=${traslado.sede} onChange=${e => setTraslado(Object.assign({}, traslado, { sede: e.target.value }))}>${db.sedes.map(s => html`<option key=${s.id} value=${s.nombre}>${s.nombre}</option>`)}</select></label>
        <label className="campo"><span>Sección nueva</span><select value=${traslado.seccion} onChange=${e => setTraslado(Object.assign({}, traslado, { seccion: e.target.value }))}>${db.secciones.map(s => html`<option key=${s.id} value=${s.nombre}>${s.nombre}</option>`)}</select></label>
      </div>
      <div className="modal-pie"><button className="btn" onClick=${() => setTraslado(null)}>Cancelar</button><button className="btn pri" onClick=${() => { commit(d => { const x = d.activos.find(z => z.codigo === traslado.codigo); x.historial = x.historial || []; x.historial.push({ fecha: new Date().toISOString(), de: x.sede + ' / ' + x.seccion, a: traslado.sede + ' / ' + traslado.seccion }); x.sede = traslado.sede; x.seccion = traslado.seccion; }, 'Trasladó ' + traslado.codigo + ' a ' + traslado.sede + ' / ' + traslado.seccion + '.'); setTraslado(null); }}>Guardar traslado</button></div>
    <//>`}

    ${qrUno && html`<${Modal} titulo=${qrUno.codigo} onCerrar=${() => setQrUno(null)}>
      <div className="qr-ficha" style=${{ maxWidth: 260, margin:'10px auto' }}><${QR} texto=${urlQR(qrUno.codigo)} tam=${6} /><b>${qrUno.codigo}</b><small>${qrUno.seccion}<br/>${tipoCompleto(qrUno)}</small></div>
      <p className="muted chico" style=${{ wordBreak:'break-all' }}>Contenido del QR: ${urlQR(qrUno.codigo)}</p>
      <div className="modal-pie"><button className="btn" onClick=${() => setQrUno(null)}>Cerrar</button></div>
    <//>`}

    ${hoja && html`<${Modal} titulo=${'Hoja de QR · ' + (sede || 'todas las sedes')} ancho=${true} clase="imprimible" onCerrar=${() => setHoja(false)}>
      <p className="muted no-print">${lista.filter(a => a.estado === 'activo').length} QR de equipos activos según los filtros.</p>
      <div className="qr-grid" style=${{ marginTop: 14 }}>${lista.filter(a => a.estado === 'activo').map(a => html`<div key=${a.codigo} className="qr-ficha"><${QR} texto=${urlQR(a.codigo)} /><b>${a.codigo}</b><small>${a.seccion}<br/>${tipoCompleto(a)}</small></div>`)}</div>
      <div className="modal-pie no-print"><button className="btn" onClick=${() => setHoja(false)}>Cerrar</button><button className="btn" onClick=${descargarHoja}>Descargar hoja</button><button className="btn pri" onClick=${() => window.print()}>Imprimir</button></div>
    <//>`}
  </div>`;
}

/* =====================================================================
   MAESTRO: USUARIOS, CATÁLOGOS, AUDITORÍA, SISTEMA
   ===================================================================== */
/* Usuarios (solo maestro): rol, sede y áreas que registra cada operario. */
function Usuarios({ db, commit }){
  const [edit, setEdit] = useState(null);
  const guardar = () => {
    if (!edit.nombre.trim()) return;
    commit(d => { const i = d.usuarios.findIndex(u => u.id === edit.id); if (i === -1) d.usuarios.push(edit); else d.usuarios[i] = edit; }, (db.usuarios.some(u => u.id === edit.id) ? 'Editó' : 'Creó') + ' el usuario ' + edit.nombre + ' (' + ROLES[edit.rol] + ').');
    setEdit(null);
  };
  return html`<div className="page">
    <div className="cabeza"><div><h1>Usuarios</h1><p>El rol define qué aplicación ve cada persona. Cada operario ve solo los equipos de su sede y de las áreas que tiene a cargo.</p></div><button className="btn pri" onClick=${() => setEdit({ id:'u' + uid(), nombre:'', rol:'operario', sede: db.sedes[0] ? db.sedes[0].nombre : '', areas:[], cargo:'', estado:'activo' })}>Crear usuario</button></div>
    <div className="tabla apilar"><table>
      <thead><tr><th>Nombre</th><th>Rol</th><th>Sede</th><th>Áreas a cargo</th><th>Estado</th><th></th></tr></thead>
      <tbody>${db.usuarios.map(u => html`<tr key=${u.id}>
        <td><b>${u.nombre}</b>${u.cargo && html`<div className="muted chico">${u.cargo}</div>`}</td>
        <td><span className=${'tag' + (u.rol === 'maestro' ? ' alerta' : u.rol === 'admin' ? ' verde' : '')}>${ROLES[u.rol]}</span></td>
        <td>${u.sede || 'Todas'}</td>
        <td>${u.rol === 'operario' ? textoAreas(u) : '—'}</td>
        <td>${u.estado === 'activo' ? 'Activo' : 'Inactivo'}</td>
        <td><button className="btn chico" onClick=${() => setEdit(clonar(u))}>Editar</button></td>
      </tr>`)}</tbody>
    </table></div>
    ${edit && html`<${Modal} titulo=${db.usuarios.some(u => u.id === edit.id) ? 'Editar usuario' : 'Crear usuario'} onCerrar=${() => setEdit(null)}>
      <div className="grid2" style=${{ marginTop: 10 }}>
        <label className="campo"><span>Nombre</span><input value=${edit.nombre} onChange=${e => setEdit(Object.assign({}, edit, { nombre: e.target.value }))} /></label>
        <label className="campo"><span>Cargo</span><input value=${edit.cargo || ''} onChange=${e => setEdit(Object.assign({}, edit, { cargo: e.target.value }))} /></label>
        <label className="campo"><span>Rol</span><select value=${edit.rol} onChange=${e => setEdit(Object.assign({}, edit, { rol: e.target.value }))}>${Object.entries(ROLES).map(([k, n]) => html`<option key=${k} value=${k}>${n}</option>`)}</select></label>
        <label className="campo"><span>Sede</span><select value=${edit.sede} onChange=${e => setEdit(Object.assign({}, edit, { sede: e.target.value }))}><option value="">Todas</option>${db.sedes.map(s => html`<option key=${s.id} value=${s.nombre}>${s.nombre}</option>`)}</select></label>
        <label className="campo"><span>Estado</span><select value=${edit.estado} onChange=${e => setEdit(Object.assign({}, edit, { estado: e.target.value }))}><option value="activo">Activo</option><option value="inactivo">Inactivo</option></select></label>
      </div>
      ${edit.rol === 'operario' && html`<div className="bloque">
        <b>Áreas a cargo</b>
        <p className="muted chico" style=${{ marginBottom: 8 }}>Si no marcás ninguna, ve todos los equipos de su sede.</p>
        <div className="chips">${listaAreas(db).map(ar => { const on = (edit.areas || []).includes(ar); const secs = db.secciones.filter(s => (s.area || s.nombre) === ar).map(s => s.nombre); return html`<button type="button" key=${ar} className=${'chip' + (on ? ' on' : '')} aria-pressed=${on} title=${secs.join(', ')} onClick=${() => setEdit(Object.assign({}, edit, { areas: on ? edit.areas.filter(x => x !== ar) : (edit.areas || []).concat(ar) }))}>${ar}${secs.length > 1 ? ' (' + secs.length + ' secciones)' : ''}</button>`; })}</div>
      </div>`}
      <div className="modal-pie"><button className="btn" onClick=${() => setEdit(null)}>Cancelar</button><button className="btn pri" disabled=${!edit.nombre.trim()} onClick=${guardar}>Guardar usuario</button></div>
    <//>`}
  </div>`;
}
/* Lista editable de sedes o secciones (nombre + código corto).
   Opcional: conArea (las secciones tienen área) y conCierre (las sedes
   tienen hora de cierre). No deja borrar lo que tiene equipos. */
function ListaCatalogo({ titulo, items, onGuardar, onBorrar, enUso, conArea, areas, onArea, conCierre, onCierre }){
  const [nombre, setNombre] = useState(''); const [codigo, setCodigo] = useState(''); const [tocado, setTocado] = useState(false);
  return html`<div className="panel">
    <h3 style=${{ fontSize: 16, marginBottom: 12 }}>${titulo}</h3>
    <div className="pila">${items.map(it => html`<div key=${it.id} className="fila" style=${{ justifyContent:'space-between', borderBottom:'1px solid var(--line)', paddingBottom: 8 }}>
      <span><b>${it.nombre}</b> <span className="tag codigo">${it.codigo}</span></span>
      ${conArea && html`<label className="chico muted" style=${{ display:'flex', alignItems:'center', gap: 6, fontWeight: 700 }}>Área <input list="lista-areas" value=${it.area || it.nombre} onChange=${e => onArea(it, e.target.value.toUpperCase())} style=${{ width: 150, padding:'4px 8px' }} /></label>`}
      ${conCierre && html`<label className="chico muted" style=${{ display:'flex', alignItems:'center', gap: 6, fontWeight: 700 }}>Cierra <input type="time" value=${it.horaCierre || '20:00'} onChange=${e => onCierre(it, e.target.value)} style=${{ width: 120, padding:'4px 8px' }} /></label>`}
      <button className="btn chico" disabled=${enUso(it)} title=${enUso(it) ? 'Tiene equipos asociados' : ''} onClick=${() => onBorrar(it)}>Eliminar</button>
    </div>`)}</div>
    ${conArea && html`<datalist id="lista-areas">${(areas || []).map(a => html`<option key=${a} value=${a} />`)}</datalist>`}
    <div className="grid2" style=${{ marginTop: 14, gridTemplateColumns:'2fr 1fr' }}>
      <label className="campo"><span>Nombre</span><input value=${nombre} onChange=${e => { setNombre(e.target.value.toUpperCase()); if (!tocado) setCodigo(sugerirCodigo(e.target.value)); }} /></label>
      <label className="campo"><span>Código</span><input value=${codigo} onChange=${e => { setCodigo(e.target.value.toUpperCase()); setTocado(true); }} /></label>
    </div>
    <button className="btn pri chico" style=${{ marginTop: 10 }} disabled=${!nombre.trim() || !codigo.trim() || items.some(i => i.codigo === codigo || i.nombre === nombre)} onClick=${() => { onGuardar(Object.assign({ id: uid(), nombre: nombre.trim(), codigo: codigo.trim() }, conArea ? { area: nombre.trim() } : {})); setNombre(''); setCodigo(''); setTocado(false); }}>Agregar</button>
  </div>`;
}
/* Pantalla Sedes y secciones (solo maestro). */
function Catalogos({ db, commit }){
  return html`<div className="page">
    <div className="cabeza"><div><h1>Sedes y secciones</h1><p>Los códigos cortos forman el código de cada equipo. Si una sede cierra antes de las 20:00, su último registro se pide antes del cierre. El área agrupa secciones que atiende el mismo operario: carnes blancas y carnes rojas comparten el área CARNES.</p></div></div>
    <div className="grid2">
      <${ListaCatalogo} titulo="Sedes" conCierre=${true} onCierre=${(it, v) => commit(d => { const x = d.sedes.find(z => z.id === it.id); x.horaCierre = (!v || v >= '20:00') ? '' : v; }, 'Cambió la hora de cierre de ' + it.nombre + '.')} items=${db.sedes} enUso=${it => db.activos.some(a => a.sede === it.nombre)} onGuardar=${it => commit(d => d.sedes.push(it), 'Agregó la sede ' + it.nombre + '.')} onBorrar=${it => commit(d => { d.sedes = d.sedes.filter(x => x.id !== it.id); }, 'Eliminó la sede ' + it.nombre + '.')} />
      <${ListaCatalogo} titulo="Secciones" conArea=${true} areas=${listaAreas(db)} onArea=${(it, v) => commit(d => { const x = d.secciones.find(z => z.id === it.id); x.area = v || x.nombre; }, null)} items=${db.secciones} enUso=${it => db.activos.some(a => a.seccion === it.nombre)} onGuardar=${it => commit(d => d.secciones.push(it), 'Agregó la sección ' + it.nombre + '.')} onBorrar=${it => commit(d => { d.secciones = d.secciones.filter(x => x.id !== it.id); }, 'Eliminó la sección ' + it.nombre + '.')} />
    </div>
  </div>`;
}
/* Historial de cambios de configuración (quién, cuándo, qué). */
function Auditoria({ db }){
  return html`<div className="page">
    <div className="cabeza"><div><h1>Auditoría</h1><p>Quién cambió qué. Los registros de los operarios se ven en Resultados.</p></div></div>
    <div className="tabla apilar"><table><thead><tr><th>Fecha</th><th>Usuario</th><th>Acción</th></tr></thead>
      <tbody>${db.auditoria.slice(0, 200).map(a => html`<tr key=${a.id}><td style=${{ whiteSpace:'nowrap' }}>${fmtFecha(a.fecha)}</td><td>${a.usuario}</td><td>${a.accion}</td></tr>`)}</tbody></table></div>
  </div>`;
}
/* Sistema (solo maestro): almacenamiento y respaldo, dirección de los QR,
   cómo abre el operario los registros y dirección del servidor futuro. */
function Sistema({ db, commit, avisar, reiniciar, importar }){
  const [qrBase, setQrBase] = useState(db.config.qrBase || '');
  // Prueba de conexión: la dirección se guarda en este navegador (no en los datos), porque decide DE DÓNDE salen los datos.
  const [urlPrueba, setUrlPrueba] = useState(URL_SERVIDOR_FIJA || urlServidor());
  const [prueba, setPrueba] = useState(null);
  const [probando, setProbando] = useState(false);
  const tam = useMemo(() => Math.round(JSON.stringify(db).length / 1024), [db]);
  const fileRef = useRef(null);
  return html`<div className="page">
    <div className="cabeza"><div><h1>Sistema</h1><p>Dónde se guardan los datos, respaldos y preparación para el servidor.</p></div></div>
    <div className="grid2">
      <div className="panel pila">
        <h3 style=${{ fontSize: 16 }}>Almacenamiento</h3>
        <p><b>${Adaptador.nombre}</b></p>
        <p className="muted chico">${tam} KB usados · ${db.respuestas.length} registros · ${db.activos.length} equipos · ${db.formularios.length} formularios. En modo local cada navegador tiene sus propios datos: lo que registra un celular no lo ve otro computador hasta conectar el servidor.</p>
        <div className="fila">
          <button className="btn pri" onClick=${async () => { const r = await guardarArchivo('respaldo_formatos_' + diaKey(new Date()) + '.json', JSON.stringify(db)); if (r === 'error') avisar('No se pudo descargar.', 'error'); }}>Descargar respaldo</button>
          <button className="btn" onClick=${() => fileRef.current.click()}>Cargar respaldo</button>
          <input ref=${fileRef} type="file" accept="application/json,.json" style=${{ display:'none' }} onChange=${e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { try{ const d = JSON.parse(r.result); if (!d.formularios || !d.activos) throw 0; const problema = importar(d); if (problema) avisar(problema, 'error'); else avisar('Respaldo cargado.'); }catch(err){ avisar('Ese archivo no es un respaldo válido de esta aplicación.', 'error'); } }; r.readAsText(f); e.target.value = ''; }} />
          ${MODO_DEMO && html`<button className="btn peligro" onClick=${() => { if (confirm('Esto borra todo y vuelve a los datos de demostración. ¿Continuar?')) reiniciar(); }}>Volver a datos de demostración</button>`}
        </div>
      </div>
      <div className="panel pila">
        <h3 style=${{ fontSize: 16 }}>Dirección de los QR</h3>
        <p className="muted chico">Es la dirección fija que va impresa en cada QR, seguida de ?equipo=CÓDIGO. Cuando la app esté publicada en su dirección definitiva, se pone aquí una sola vez.</p>
        <input value=${qrBase} placeholder=${location.origin + location.pathname} onChange=${e => setQrBase(e.target.value)} />
        <button className="btn chico" style=${{ alignSelf:'flex-start' }} onClick=${() => commit(d => { d.config.qrBase = qrBase.trim(); }, 'Cambió la dirección de los QR.')}>Guardar dirección</button>
      </div>
      <div className="panel pila">
        <h3 style=${{ fontSize: 16 }}>Cómo abre el operario los registros</h3>
        <p className="muted chico">Los registros de equipos solo se abren escaneando el QR. Así queda la evidencia de que la persona estuvo frente al equipo.</p>
        <label className="check"><input type="checkbox" checked=${!!db.config.codigoManual} onChange=${e => commit(d => { d.config.codigoManual = e.target.checked; }, (e.target.checked ? 'Permitió' : 'Quitó') + ' escribir el código del equipo a mano.')} /> Permitir escribir el código si el QR está dañado</label>
        ${MODO_DEMO && html`<label className="check"><input type="checkbox" checked=${db.config.simulador !== false} onChange=${e => commit(d => { d.config.simulador = e.target.checked; }, (e.target.checked ? 'Activó' : 'Desactivó') + ' el simulador de escaneo.')} /> Mostrar simulador de escaneo (solo para demostraciones)</label>`}
      </div>
      <div className="panel pila">
        <h3 style=${{ fontSize: 16 }}>Conexión a servidor</h3>
        <p className="muted chico">Hoy: <b>${Adaptador.nombre}</b>${URL_SERVIDOR_FIJA ? ' (fijada en la instalación)' : ''}. Con una dirección, la app usa el servidor: entrada con usuario y contraseña, y los cambios se envían solos (si no hay señal, quedan en cola en el celular).</p>
        <input value=${urlPrueba} disabled=${!!URL_SERVIDOR_FIJA} placeholder="https://formatos.canaveral.com/api" onChange=${e => { setUrlPrueba(e.target.value); setPrueba(null); }} />
        <div className="fila">
          <button className="btn chico" disabled=${!urlPrueba.trim() || probando} onClick=${async () => { setProbando(true); try{ const j = await AdaptadorServidor(urlPrueba.trim()).probar(); setPrueba({ ok: true, texto: 'Responde. Hora del servidor: ' + (j.hora ? fmtFecha(j.hora) : 'no informada') + (j.version ? ' · versión ' + j.version : '') }); }catch(e){ setPrueba({ ok: false, texto: e.message }); } setProbando(false); }}>${probando ? 'Probando…' : 'Probar conexión'}</button>
          ${!URL_SERVIDOR_FIJA && html`<button className="btn chico pri" disabled=${!prueba || !prueba.ok} title=${!prueba || !prueba.ok ? 'Primero probá la conexión' : ''} onClick=${() => { if (!confirm('La app va a usar el servidor desde ahora en este navegador. Los datos locales NO se pasan solos: si los necesitás, descargá un respaldo e importalo en el servidor. ¿Continuar?')) return; escribirLocal(CLAVE_URL, null); try{ localStorage.setItem(CLAVE_URL, urlPrueba.trim()); localStorage.removeItem('cnv_sesion'); }catch(e){} location.reload(); }}>Conectar</button>`}
          ${!URL_SERVIDOR_FIJA && Adaptador.tipo === 'servidor' && html`<button className="btn chico" onClick=${() => { try{ localStorage.removeItem(CLAVE_URL); localStorage.removeItem('cnv_sesion'); }catch(e){} location.reload(); }}>Volver a modo local</button>`}
        </div>
        ${prueba && html`<p className=${prueba.ok ? 'rango-ok' : 'alerta-caja'}>${prueba.texto}</p>`}
      </div>
    </div>
  </div>`;
}

/* =====================================================================
   APLICACIÓN
   ===================================================================== */
/**
 * Componente raíz. Guarda el estado global y decide qué se ve:
 *   - sin sesión     → Login
 *   - operario       → Operario (vista de celular)
 *   - admin/maestro  → menú lateral + la pantalla de "ruta".
 * commit(fn, accion): ÚNICA forma de modificar datos (ver MAPA DEL CÓDIGO).
 *                     Devuelve true si se guardó, false si algún permiso lo impidió.
 * avisar(msg, tipo):  mensaje temporal abajo; tipo 'error' lo pinta naranja.
 */
function App(){
  const [db, setDb] = useState(null);
  const [sesion, setSesion] = useState(() => { try{ return localStorage.getItem('cnv_sesion'); }catch(e){ return null; } });
  const [ruta, setRuta] = useState({ v:'tablero' });
  const [aviso, setAviso] = useState(null);
  const [menu, setMenu] = useState(false);
  const [equipoURL, setEquipoURL] = useState(() => { try{ const e = new URLSearchParams(location.search).get('equipo'); return e ? e.toUpperCase() : null; }catch(e){ return null; } });
  const usuarioRef = useRef(null);
  const timer = useRef(null);
  /* Copia siempre actualizada de los datos. commit trabaja sobre ella (no dentro de setDb),
     así el guardado ocurre UNA sola vez por cambio aunque React repita una actualización. */
  const dbRef = useRef(null);
  /* Reemplaza todos los datos de una vez (carga inicial, respaldo, demostración). */
  const reemplazarDb = useCallback(d => { if (d) congelarSoloAgregar(d); dbRef.current = d; setDb(d); }, []);
