<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Románticos lunes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#030403;
    --frame:#0b0c0b;
    --canvas:#070807;
    --green:#1ed760;
    --green-soft:#7dffa8;
    --green-deep:#139a44;
    --purple:#5b2a6e;
    --text:#eef8f0;
    --muted:rgba(238,248,240,.72);
    --env:#151a16;
    --env-shade:#1d2620;
    --paper:#eafbee;
  }

  *{box-sizing:border-box}
  body{
    margin:0;
    background-color:var(--night);
    background-image:radial-gradient(rgba(30,215,96,.13) 1.1px, transparent 1.2px);
    background-size:22px 22px;
    color:var(--text);
    font-family:"Space Mono",ui-monospace,monospace;
    min-height:100dvh;
    display:flex;
    justify-content:center;
    padding:24px;
  }

  .frame{
    margin:auto 0;
    width:min(94vw,460px);
    background:var(--frame);
    border:1px solid rgba(30,215,96,.22);
    border-radius:30px;
    padding:12px;
    box-shadow:0 0 60px -10px rgba(30,215,96,.22), 0 30px 60px -25px #000;
  }

  .topbar{
    height:46px;
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 14px;
  }
  .topbar::before{
    content:"";
    width:8px;height:8px;
    border-radius:50%;
    background:var(--green);
    box-shadow:0 0 10px var(--green);
  }
  .sender{
    color:var(--text);
    font-size:15px;
    letter-spacing:.5px;
  }

  .canvas{
    position:relative;
    border-radius:20px;
    overflow:hidden;
    background:
      radial-gradient(70% 50% at 50% 42%, rgba(30,215,96,.10) 0%, transparent 70%),
      radial-gradient(80% 60% at 90% 100%, rgba(91,42,110,.50) 0%, transparent 65%),
      radial-gradient(60% 50% at 0% 0%, rgba(91,42,110,.22) 0%, transparent 70%),
      var(--canvas);
  }

  .stage{
    position:relative;
    z-index:1;
    min-height:520px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:44px 30px;
    text-align:center;
  }

  /* ---------- SOBRE ---------- */
  .envelope-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:26px;
  }
  .envelope{
    position:relative;
    width:270px;
    height:180px;
    border:0;
    background:transparent;
    padding:0;
    cursor:pointer;
    perspective:900px;
    filter:drop-shadow(0 0 22px rgba(30,215,96,.28));
    animation:hover 3.2s ease-in-out infinite;
  }
  @keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .envelope:focus-visible{outline:3px solid var(--green);outline-offset:10px;border-radius:8px}

  .env-body{
    position:absolute;inset:0;
    background:var(--env);
    border:1px solid rgba(30,215,96,.35);
    border-radius:10px;
    z-index:1;
  }
  .env-letter{
    position:absolute;
    left:12px;right:12px;
    top:16px;
    height:140px;
    background:var(--paper);
    border-radius:7px 7px 3px 3px;
    box-shadow:0 0 18px rgba(30,215,96,.35);
    z-index:2;
    transform:translateY(20px);
    transition:transform .7s cubic-bezier(.2,.9,.25,1) .3s, z-index 0s .35s;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .env-letter span{font-size:34px;opacity:0;transition:opacity .4s ease .4s}
  .envelope.open .env-letter span{opacity:.9}
  .env-pocket{
    position:absolute;inset:0;
    z-index:3;
    background:linear-gradient(180deg, #1a221c, var(--env-shade));
    border-radius:10px;
    clip-path:polygon(0 42%, 50% 100%, 100% 42%, 100% 100%, 0 100%);
  }
  .env-flap{
    position:absolute;
    top:0;left:0;right:0;
    height:96px;
    background:linear-gradient(180deg, #24342a, #18211b);
    clip-path:polygon(0 0, 100% 0, 50% 100%);
    transform-origin:top center;
    transform:rotateX(0deg);
    z-index:5;
    transition:transform .7s cubic-bezier(.6,.05,.3,1), z-index 0s .35s;
    backface-visibility:hidden;
  }
  .env-seal{
    position:absolute;
    top:66px;left:50%;
    width:44px;height:44px;
    margin-left:-22px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--green-soft), var(--green) 45%, var(--green-deep));
    box-shadow:0 0 16px rgba(30,215,96,.7);
    z-index:6;
    display:flex;align-items:center;justify-content:center;
    color:#04140a;font-size:20px;
    transition:opacity .3s ease, transform .3s ease;
  }

  .envelope.open{animation:none}
  .envelope.open .env-flap{transform:rotateX(178deg);z-index:0}
  .envelope.open .env-letter{transform:translateY(-40px);z-index:6}
  .envelope.open .env-seal{opacity:0;transform:scale(.4)}

  .tap{
    color:var(--green);
    font-size:13px;
    letter-spacing:2px;
    text-transform:uppercase;
    animation:breathe 2.4s ease-in-out infinite;
  }
  @keyframes breathe{0%,100%{opacity:.35}50%{opacity:.95}}

  /* ---------- LINTERNA (animación al abrir) ---------- */
  .beam{
    position:absolute;
    width:760px;height:560px;
    margin-top:-280px;
    transform-origin:0 50%;
    background:linear-gradient(90deg, rgba(235,255,240,.95) 0%, rgba(30,215,96,.6) 18%, rgba(30,215,96,.18) 60%, transparent 90%);
    clip-path:polygon(0 50%, 100% 8%, 100% 92%);
    filter:blur(3px);
    opacity:0;
    pointer-events:none;
    z-index:3;
    mix-blend-mode:screen;
  }
  .beam.sweep{animation:sweep 1.9s cubic-bezier(.45,.05,.35,1) forwards}
  @keyframes sweep{
    0%{opacity:0;transform:rotate(140deg)}
    12%{opacity:1}
    75%{opacity:1;transform:rotate(430deg)}
    100%{opacity:0;transform:rotate(470deg)}
  }

  /* Luz verde tipo puerta, detrás del mensaje */
  .door{
    position:absolute;
    left:50%;top:0;
    width:260px;height:100%;
    margin-left:-130px;
    background:linear-gradient(180deg, rgba(30,215,96,.30), rgba(30,215,96,.08) 55%, transparent 90%);
    clip-path:polygon(32% 0, 68% 0, 92% 100%, 8% 100%);
    filter:blur(10px);
    opacity:0;
    z-index:0;
    pointer-events:none;
    transition:opacity 1.6s ease;
  }
  .canvas.lit .door{opacity:1}

  .spark{
    position:absolute;
    width:5px;height:5px;
    margin:-2.5px 0 0 -2.5px;
    border-radius:50%;
    background:#d9ffe5;
    box-shadow:0 0 10px 2px rgba(30,215,96,.9);
    z-index:4;
    pointer-events:none;
    animation:burst 1.3s cubic-bezier(.15,.8,.3,1) forwards;
  }
  @keyframes burst{
    0%{opacity:1;transform:translate(0,0) scale(1)}
    100%{opacity:0;transform:translate(var(--x),var(--y)) scale(.2)}
  }

  /* ---------- MENSAJE ---------- */
  .note{
    opacity:0;
    transform:scale(.94);
    transition:opacity .7s ease, transform .7s cubic-bezier(.2,.9,.25,1);
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .note.show{opacity:1;transform:scale(1)}

  .note-emoji{
    width:96px;height:96px;
    border-radius:50%;
    background:rgba(30,215,96,.08);
    border:1.5px solid rgba(30,215,96,.55);
    display:flex;align-items:center;justify-content:center;
    font-size:46px;
    margin-bottom:26px;
    animation:glow 3.2s ease-in-out infinite;
  }
  @keyframes glow{
    0%,100%{box-shadow:0 0 18px rgba(30,215,96,.30)}
    50%{box-shadow:0 0 40px rgba(30,215,96,.60)}
  }
  .note h1{
    font-family:"Fraunces",Georgia,serif;
    font-weight:600;
    font-size:clamp(30px,7.5vw,42px);
    line-height:1.08;
    margin:0 0 22px;
    color:var(--text);
    text-shadow:0 0 24px rgba(30,215,96,.35);
  }
  .note p{
    font-size:15px;
    line-height:1.85;
    color:var(--muted);
    max-width:32ch;
    margin:0 auto;
  }

  /* Palabras que se "iluminan" una a una, como con la linterna */
  .w{
    display:inline-block;
    opacity:0;
    animation:litIn 1.1s ease forwards;
    animation-delay:calc(var(--i) * 70ms + .5s);
  }
  @keyframes litIn{
    0%{opacity:0;filter:blur(6px);transform:translateY(6px);color:var(--green-soft);text-shadow:0 0 14px var(--green)}
    45%{opacity:1;filter:blur(0);transform:none;color:var(--green-soft);text-shadow:0 0 10px var(--green)}
    100%{opacity:1;filter:blur(0);transform:none;color:var(--muted);text-shadow:none}
  }

  .wave{
    margin-top:30px;
    color:var(--green);
    opacity:0;
    animation:fadeIn 1s ease forwards;
    animation-delay:var(--wave-delay,1s);
  }

  /* ---------- CANCIÓN (Spotify Code) ---------- */
  .song{
    margin-top:30px;
    width:100%;
    max-width:300px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    opacity:0;
    transform:translateY(14px);
    animation:rise .9s cubic-bezier(.2,.9,.25,1) forwards;
    animation-delay:var(--song-delay,2s);
  }
  @keyframes rise{to{opacity:1;transform:none}}
  .song-label{
    font-size:11px;
    letter-spacing:2.5px;
    text-transform:uppercase;
    color:var(--green);
  }
  .song-card{
    position:relative;
    display:block;
    width:100%;
    border-radius:16px;
    overflow:hidden;
    border:1px solid rgba(30,215,96,.4);
    box-shadow:0 0 34px rgba(30,215,96,.28);
    transition:transform .3s ease, box-shadow .3s ease;
  }
  a.song-card:hover{transform:translateY(-3px);box-shadow:0 0 46px rgba(30,215,96,.45)}
  a.song-card:focus-visible{outline:3px solid var(--green);outline-offset:4px}
  .song-card img{display:block;width:100%;height:auto}
  /* Línea de escáner que recorre la tarjeta */
  .song-card::after{
    content:"";
    position:absolute;
    left:0;right:0;
    top:0;
    height:3px;
    background:var(--green-soft);
    box-shadow:0 0 14px 4px rgba(30,215,96,.75);
    opacity:0;
    animation:scan 3.6s ease-in-out infinite;
    animation-delay:calc(var(--song-delay,2s) + .6s);
  }
  @keyframes scan{
    0%{top:0;opacity:0}
    8%{opacity:1}
    55%{top:calc(100% - 3px);opacity:1}
    65%,100%{top:calc(100% - 3px);opacity:0}
  }
  .song-hint{
    font-size:12px;
    line-height:1.6;
    color:var(--muted);
    margin:0;
  }
  .listen{
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:12px 22px;
    border-radius:999px;
    background:var(--green);
    color:#04140a;
    font-family:inherit;
    font-weight:700;
    font-size:13px;
    letter-spacing:.5px;
    text-decoration:none;
    box-shadow:0 0 22px rgba(30,215,96,.45);
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .listen:hover{transform:scale(1.04);box-shadow:0 0 32px rgba(30,215,96,.7)}
  .listen:focus-visible{outline:3px solid var(--text);outline-offset:4px}
  .eq{display:inline-flex;align-items:flex-end;gap:2px;height:14px}
  .eq i{width:3px;background:#04140a;border-radius:1px;animation:eq 1s ease-in-out infinite}
  .eq i:nth-child(2){animation-delay:.2s}
  .eq i:nth-child(3){animation-delay:.4s}
  .eq i:nth-child(4){animation-delay:.1s}
  @keyframes eq{0%,100%{height:4px}50%{height:14px}}

  /* ---------- YA VISTO ---------- */
  .spent{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
    opacity:0;
    animation:fadeIn .8s ease forwards;
  }
  @keyframes fadeIn{to{opacity:1}}
  .spent .mark{
    font-size:40px;
    color:var(--green);
    opacity:.7;
    text-shadow:0 0 14px var(--green);
  }
  .spent h2{
    font-family:"Fraunces",Georgia,serif;
    font-weight:500;
    font-size:24px;
    margin:0;
    color:var(--text);
  }
  .spent p{
    font-size:13px;
    line-height:1.8;
    color:var(--muted);
    max-width:30ch;
    margin:0;
  }

  [hidden]{display:none !important}

  @media (prefers-reduced-motion: reduce){
    .env-flap,.env-letter,.note,.env-seal{transition:opacity .3s ease !important}
    .envelope,.tap,.note-emoji,.eq i,.song-card::after{animation:none}
    .w,.wave,.song{animation:none;opacity:1;transform:none}
  }

  @media (max-width:420px){
    .stage{min-height:470px;padding:38px 22px}
    .envelope{width:230px;height:158px}
    .env-letter{height:118px}
    .env-flap{height:84px}
  }
</style>
</head>
<body>
  <main class="frame">
    <div class="topbar">
      <span class="sender" id="sender"></span>
    </div>
    <div class="canvas" id="canvas">
      <div class="door" aria-hidden="true"></div>
      <div class="beam" id="beam" aria-hidden="true"></div>
      <div class="stage">

        <!-- Estado 1: sobre cerrado -->
        <div class="envelope-wrap" id="wrap">
          <button class="envelope" id="envelope" aria-label="Abrir el mensaje">
            <div class="env-body"></div>
            <div class="env-letter"><span id="letterEmoji"></span></div>
            <div class="env-pocket"></div>
            <div class="env-flap"></div>
            <div class="env-seal">♥</div>
          </button>
          <div class="tap">toca para abrir</div>
        </div>

        <!-- Estado 2: mensaje revelado -->
        <article class="note" id="note" hidden>
          <div class="note-emoji" id="noteEmoji"></div>
          <h1 id="noteTitle"></h1>
          <p id="noteBody"></p>
          <svg class="wave" width="190" height="16" viewBox="0 0 190 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M2 9 C 14 -2, 26 18, 38 9 S 62 -2, 74 9 S 98 18, 110 9 S 134 -2, 146 9 S 170 18, 188 9"
                  stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/>
          </svg>

          <section class="song" id="song" aria-label="Canción">
            <span class="song-label">una canción para ti</span>
            <div class="song-card" id="songCard">
              <img id="songImg" alt="Código de Spotify de la canción">
            </div>
            <p class="song-hint">Escanéala desde Spotify (Buscar → cámara) o tócala para escucharla.</p>
            <a class="listen" id="listen" target="_blank" rel="noopener" hidden>
              <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
              Escuchar en Spotify
            </a>
          </section>
        </article>

        <!-- Estado 3: ya fue visto -->
        <div class="spent" id="spent" hidden>
          <div class="mark">✧</div>
          <h2>Ya lo abriste</h2>
          <p>Este mensaje era para verse una sola vez. Cumplió su momento y se quedó guardado en tu memoria.</p>
        </div>

      </div>
    </div>
  </main>

<script>
  // ===================================================================
  //  EDITA AQUÍ  →  todo lo personalizable está en este bloque
  // ===================================================================
  const CONFIG = {
    remitente: "Anonimo",
    emoji: "☕",
    titulo: "Románticos lunes",
    mensaje: "Los lunes suelen ser un perro rabioso mordiéndote los talones. El mundo pesa y la rutina pesa. Pero hable y, de repente, apareció ese desayuno. Hay gente que destruye el día y hay gente como ella, capaz de volver un maldito lunes el momento más hermoso de la semana. Me encantas. Hoy el día me suena distinto por ti",

    // Imagen con el código de Spotify (el que se escanea con la cámara)
    imagenCancion: "cancion.jpg",
    // Link de la canción en Spotify (Compartir → Copiar enlace).
    // Si lo dejas vacío, solo se muestra el código para escanear.
    spotify: "https://open.spotify.com/track/3b9hmdwt0RWluhFm3hLKz8",

    // Cambia el número del final (v1 → v2 → v3...) cuando quieras
    // "reiniciarlo" y poder verlo de nuevo mientras pruebas.
    clave: "recordatorio_visto_v3"
  };
  // ===================================================================

  const $ = (id) => document.getElementById(id);

  // Pintar contenido
  $("sender").textContent = CONFIG.remitente;
  $("letterEmoji").textContent = CONFIG.emoji;
  $("noteEmoji").textContent = CONFIG.emoji;
  $("noteTitle").textContent = CONFIG.titulo;

  // El mensaje se arma palabra por palabra para animarlo
  const body = $("noteBody");
  body.setAttribute("aria-label", CONFIG.mensaje);
  const palabras = CONFIG.mensaje.split(/\s+/).filter(Boolean);
  palabras.forEach((palabra, i) => {
    const span = document.createElement("span");
    span.className = "w";
    span.style.setProperty("--i", i);
    span.setAttribute("aria-hidden", "true");
    span.textContent = palabra;
    body.appendChild(span);
    if (i < palabras.length - 1) body.appendChild(document.createTextNode(" "));
  });
  const finTexto = palabras.length * 70 + 900;
  document.querySelector(".wave").style.setProperty("--wave-delay", finTexto + "ms");

  // Canción: código de Spotify + link opcional
  const song = $("song");
  song.style.setProperty("--song-delay", (finTexto + 400) + "ms");
  $("songImg").src = CONFIG.imagenCancion;
  if (CONFIG.spotify){
    const card = $("songCard");
    const link = document.createElement("a");
    link.className = "song-card";
    link.href = CONFIG.spotify;
    link.target = "_blank";
    link.rel = "noopener";
    link.setAttribute("aria-label", "Abrir la canción en Spotify");
    link.append(...card.childNodes);
    card.replaceWith(link);
    $("listen").href = CONFIG.spotify;
    $("listen").hidden = false;
  }

  // Lectura segura de localStorage (algunos entornos lo bloquean)
  function yaVisto(){
    try { return localStorage.getItem(CONFIG.clave) === "1"; }
    catch(e){ return false; }
  }
  function marcarVisto(){
    try { localStorage.setItem(CONFIG.clave, "1"); }
    catch(e){ /* si no hay storage, no se puede "gastar"; se muestra igual */ }
  }

  const wrap = $("wrap");
  const envelope = $("envelope");
  const note = $("note");
  const spent = $("spent");
  const canvas = $("canvas");
  const beam = $("beam");
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const azar = (min, max) => min + Math.random() * (max - min);

  function centroSobre(){
    const c = canvas.getBoundingClientRect();
    const e = envelope.getBoundingClientRect();
    return { x: e.left + e.width / 2 - c.left, y: e.top + e.height / 2 - c.top };
  }

  // La linterna barre la pantalla desde el sobre
  function linterna(){
    const { x, y } = centroSobre();
    beam.style.left = x + "px";
    beam.style.top = y + "px";
    beam.classList.add("sweep");
  }

  // Chispas verdes desde el centro del sobre
  function chispas(){
    const { x, y } = centroSobre();
    for (let i = 0; i < 26; i++){
      const p = document.createElement("span");
      p.className = "spark";
      const ang = azar(0, Math.PI * 2);
      const dist = azar(90, 230);
      p.style.left = x + "px";
      p.style.top = y + "px";
      p.style.setProperty("--x", Math.cos(ang) * dist + "px");
      p.style.setProperty("--y", Math.sin(ang) * dist + "px");
      p.style.animationDelay = azar(0, .15).toFixed(2) + "s";
      canvas.appendChild(p);
      p.addEventListener("animationend", () => p.remove());
    }
  }

  function mostrarMensaje(){
    wrap.hidden = true;
    note.hidden = false;
    requestAnimationFrame(() => note.classList.add("show"));
  }

  function abrir(){
    if (envelope.classList.contains("open")) return;
    marcarVisto();                 // se consume en el momento de abrir
    envelope.classList.add("open");
    if (reduce){
      canvas.classList.add("lit");
      setTimeout(mostrarMensaje, 150);
      return;
    }
    setTimeout(() => { linterna(); chispas(); }, 550);
    setTimeout(() => canvas.classList.add("lit"), 1400);
    setTimeout(mostrarMensaje, 1900);
  }

  // Arranque
  if (yaVisto()){
    wrap.hidden = true;
    spent.hidden = false;
  } else {
    envelope.addEventListener("click", abrir);
  }
</script>
</body>
</html>
